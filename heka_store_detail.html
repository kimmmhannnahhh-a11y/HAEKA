.scroll-wrap{height:calc(620px - 248px);overflow-y:auto;padding:26px 0 96px;scrollbar-width:none}.scroll-wrap::-webkit-scrollbar{display:none}.section{margin:0 18px 32px;padding:0 0 25px;background:transparent;border:0;border-bottom:1px solid var(--hk-border);box-shadow:none;border-radius:0}.section:last-of-type{border-bottom:0}.sec-title,.sec-title-blue,.sec-title-red{font-size:18px;font-weight:800;letter-spacing:-.04em;color:var(--hk-text);margin-bottom:14px}.sec-title-blue{color:var(--hk-accent)}.sec-title-red{color:#991B1B}

.hk-pay-strip{margin:0 0 32px!important;padding:24px 18px 26px!important;background:linear-gradient(180deg,#FFF1F2,#fff)!important;border:0!important;border-radius:0!important;box-shadow:none!important}.card-grid{display:flex;flex-wrap:wrap;gap:8px}.card-chip{display:inline-flex;align-items:center;gap:6px;padding:9px 11px;border-radius:999px;background:var(--hk-accent);color:#fff;font-size:11px;font-weight:800;box-shadow:0 8px 18px rgba(255,56,92,.18)}.card-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.75)}#cards-no-section{background:#F9FAFB!important;margin:0 18px 32px!important;padding:18px!important;border:0!important;border-radius:18px!important;box-shadow:none!important}

@media not all{
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f0f0;display:flex;justify-content:center;padding:30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.phone{width:300px;background:#fff;border-radius:26px;border:1px solid #e0e0e0;overflow:hidden;color:#111;position:relative;min-height:620px;display:flex;flex-direction:column}
.sb{background:#FF3900;color:#fff;font-size:10px;padding:10px 16px 6px;display:flex;justify-content:space-between;flex-shrink:0}

/* 상단 사진 영역 */
.hero{position:relative;width:100%;height:180px;background:#1a2e1a;flex-shrink:0}
.hero-img{width:100%;height:100%;object-fit:cover;display:block}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,transparent 50%,rgba(0,0,0,.5) 100%)}
.hero-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.back-btn{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:16px;line-height:1}
.share-btn{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.share-btn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero-bottom{position:absolute;bottom:0;left:0;right:0;padding:10px 14px}
.signal-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-bottom:4px}
.signal-green{background:rgba(74,222,128,.2);color:#4ade80;border:1px solid rgba(74,222,128,.4)}
.signal-yellow{background:rgba(251,191,36,.2);color:#fbbf24;border:1px solid rgba(251,191,36,.4)}
.signal-red{background:rgba(248,113,113,.2);color:#f87171;border:1px solid rgba(248,113,113,.4)}
.hero-name{font-size:18px;font-weight:800;color:#fff;line-height:1.2}
.hero-cat{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}

/* 스크롤 영역 */
.scroll-wrap{flex:1;overflow-y:auto;padding-bottom:70px}
.scroll-wrap::-webkit-scrollbar{display:none}

/* 섹션 공통 */
.section{padding:14px 16px;border-bottom:.5px solid #f5f5f5}
.sec-title{font-size:10px;font-weight:700;color:#bbb;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}

/* 등록정보 */
.meta-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#888;margin-bottom:4px}
.meta-row:last-child{margin-bottom:0}
.meta-ico{font-size:12px;width:16px;text-align:center;flex-shrink:0}

/* 주소 */
.addr-box{background:#f8f8f8;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;cursor:pointer}
.addr-box:hover{background:#f0f0f0}
.addr-txt{flex:1;font-size:12px;color:#333;line-height:1.5}
.addr-copy-btn{flex-shrink:0;background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center}
.addr-copy-btn svg{width:15px;height:15px;stroke:#aaa;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 영업시간 */
.hours-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hours-today{font-size:12px;font-weight:600;color:#111}
.hours-badge-open{display:inline-flex;align-items:center;background:#FF3900;color:#fff;font-size:10px;padding:3px 8px;border-radius:6px;font-weight:700;margin-right:5px;line-height:1;height:22px;box-sizing:border-box}
.hours-badge-close{display:inline-flex;align-items:center;background:#ff3b30;color:#fff;font-size:10px;padding:3px 8px;border-radius:6px;font-weight:700;margin-right:5px;line-height:1;height:22px;box-sizing:border-box}
.hours-toggle{background:#fff;border:1px solid #ddd;border-radius:6px;font-size:10px;color:#666;cursor:pointer;padding:0 8px;display:inline-flex;align-items:center;gap:4px;font-family:inherit;line-height:1;height:22px;box-sizing:border-box}
.hours-toggle .arr{font-size:12px;color:#999;line-height:1;transform:translateY(-2px);display:inline-block}
.hours-all{display:none;background:#f8f8f8;border-radius:8px;padding:8px 10px;margin-top:6px}
.hours-day-row{display:flex;justify-content:space-between;padding:3px 0;font-size:11px}

/* 카드 */
.card-grid{display:flex;flex-wrap:wrap;gap:6px}
.card-chip{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;color:#fff}
.card-chip-no{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:600;color:#ff3b30;background:#fff5f5;border:1px solid #fecaca}
.card-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);flex-shrink:0}
.sec-title-blue{font-size:10px;font-weight:700;color:#2563eb;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.sec-title-red{font-size:10px;font-weight:700;color:#dc2626;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}

/* 결제 후기 */
.rev-item{display:flex;align-items:flex-start;gap:6px;padding:5px 0;border-bottom:1px solid #f0f0f0}
.rev-item:last-child{border-bottom:none}
.rev-top{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.rev-av{width:18px;height:18px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#666;flex-shrink:0;margin-top:1px}
.rev-name{font-size:10px;font-weight:600;color:#333}
.rev-date{font-size:10px;color:#bbb;margin-left:4px}
.rev-txt{font-size:11px;color:#555;line-height:1.4}
.rev-body{flex:1}
.rev-rating-btn{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:#f5a623;font-weight:700;cursor:pointer;padding:2px 6px;border-radius:6px;border:1px solid #fde68a;background:#fffbeb;transition:.15s}
.rev-rating-btn:hover{background:#fef3c7}

/* 찜하기 */
.zzim-btn{position:absolute;top:10px;right:50px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.zzim-btn svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.15s}
.zzim-btn.on svg{fill:#e53935;stroke:#e53935}

/* 카테고리 추가 요청 */
.cat-request{background:#f8f8f8;border-radius:8px;padding:7px 12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px dashed #ddd;transition:.15s;white-space:nowrap}
.cat-request:hover{border-color:#FF3900;background:#FFF1F2}
.cat-request-txt{font-size:10px;color:#888;white-space:nowrap}

/* 하단 버튼 */
.bottom-btns{position:absolute;bottom:0;left:0;right:0;padding:10px 16px 14px;background:#fff;border-top:.5px solid #f0f0f0;display:flex;gap:8px}
.btn-report{flex:1;padding:11px;border-radius:10px;background:#fff;color:#555;font-size:12px;font-weight:600;border:1px solid #ddd;cursor:pointer;font-family:inherit}
.closed-badge{position:absolute;top:50px;left:12px;z-index:11;background:rgba(220,38,38,.85);color:#fff;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;pointer-events:none}
.edit-badge{display:none;position:absolute;top:44px;left:12px;z-index:10;align-items:center;gap:5px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);font-size:9px;font-weight:700;padding:3px 10px;border-radius:20px;cursor:pointer}
.btn-report:hover{background:#f5f5f5}

/* 토스트 */
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.75);color:#fff;font-size:12px;font-weight:600;padding:8px 16px;border-radius:20px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 카테고리 요청 팝업 */
.popup-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;border-radius:26px}
.popup-overlay.open{display:flex}
.popup-box{background:#fff;border-radius:18px 18px 0 0;width:100%;padding:16px}
.popup-handle{width:34px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 12px}
.popup-title{font-size:14px;font-weight:700;margin-bottom:10px}
.popup-inp{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #e0e0e0;font-size:12px;font-family:inherit;outline:none;resize:none;min-height:80px}
.popup-inp:focus{border-color:#FF3900}
.popup-btn{width:100%;margin-top:8px;padding:12px;border-radius:10px;background:#FF3900;color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit}

/* HAEKA UI v2 — 상세: 결제 신뢰 정보 우선 */
:root{
  --haeka-primary:#10B981;
  --haeka-primary-deep:#059669;
  --haeka-mint:#ECFDF5;
  --haeka-accent:#F97316;
  --haeka-bg:#FAFAFA;
  --haeka-text:#1F2937;
  --haeka-muted:#6B7280;
  --haeka-line:#E5E7EB;
}
body{background:var(--haeka-bg);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--haeka-text)}
.phone{color:var(--haeka-text);border-color:#E5E7EB;box-shadow:0 18px 48px rgba(15,23,42,.10)}
.sb{background:linear-gradient(135deg,var(--haeka-primary),var(--haeka-primary-deep))}
.hero-name{font-size:20px;font-weight:900;letter-spacing:-.6px}
.hero-cat{font-size:11px;font-weight:600;color:rgba(255,255,255,.82)}
.signal-badge{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900;backdrop-filter:blur(6px)}
.signal-green{background:#D1FAE5;color:#064E3B;border:1px solid #6EE7B7}
.signal-yellow{background:#FEF3C7;color:#92400E;border:1px solid #FCD34D}
.signal-red{background:#FEE2E2;color:#7F1D1D;border:1px solid #FCA5A5}
.section{border-radius:16px;margin:10px 14px;padding:13px 14px;border:1px solid var(--haeka-line);box-shadow:0 4px 14px rgba(15,23,42,.04)}
.sec-title,.sec-title-blue{font-size:11px;font-weight:900;color:var(--haeka-primary-deep);letter-spacing:.06em;margin-bottom:10px}
.sec-title-blue::before{content:'✓ ';color:var(--haeka-primary)}
.sec-title-red{font-size:11px;font-weight:900;color:#DC2626;letter-spacing:.06em;margin-bottom:10px}
.card-grid{gap:7px}
.card-chip{border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900;box-shadow:0 3px 10px rgba(15,23,42,.10)}
.card-dot{width:5px;height:5px;background:rgba(255,255,255,.8)}
.hours-badge-open,.popup-btn{background:var(--haeka-primary)}
.cat-request:hover{border-color:var(--haeka-primary);background:var(--haeka-mint)}
.popup-inp:focus{border-color:var(--haeka-primary)}
.bottom-btns{border-top:1px solid var(--haeka-line)}
.btn-report{border-radius:12px;color:var(--haeka-primary-deep);border-color:rgba(16,185,129,.35);background:var(--haeka-mint);font-weight:800}

/* HAEKA 2.0 Warm Minimal — store detail */
:root{
  --hk-bg:#FAFAF8;
  --hk-surface:#FFFFFF;
  --hk-text:#1A1A1A;
  --hk-sub:#6B7280;
  --hk-muted:#9CA3AF;
  --hk-accent:#FF3900;
  --hk-accent-hover:#E31C5F;
  --hk-accent-bg:#FFF1F2;
  --hk-border:#F3F4F6;
  --hk-card-shadow:0 1px 3px rgba(0,0,0,0.04),0 4px 12px rgba(0,0,0,0.04);
}
body{background:var(--hk-bg);font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--hk-text)}
.phone{background:var(--hk-bg);border:0;box-shadow:0 24px 70px rgba(17,24,39,.14)}
.sb{background:var(--hk-surface);color:var(--hk-text);font-weight:700;border-bottom:1px solid var(--hk-border)}
.hero-img{border-radius:0 0 24px 24px}
.hero-name{font-size:21px;font-weight:800;letter-spacing:-.75px}
.hero-cat{font-size:11px;font-weight:700;color:rgba(255,255,255,.78)}
.signal-badge{padding:5px 10px;border-radius:999px;font-size:10px;font-weight:800}
.signal-green{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0}
.signal-yellow{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A}
.signal-red{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}
.section{background:var(--hk-surface);border:0;border-radius:18px;margin:0 14px 24px;padding:15px 14px;box-shadow:var(--hk-card-shadow)}
.section[style*="padding:0"]{overflow:hidden}
.sec-title,.sec-title-blue,.sec-title-red{font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:11px}
.sec-title,.sec-title-blue{color:var(--hk-text)}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, doc, getDoc, deleteDoc, collection, getDocs, query, where, updateDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

window._deleteStore = async function(storeId){
  await deleteDoc(doc(db,"stores",storeId));
};

const firebaseConfig = {
  apiKey: "AIzaSyCmcsC_89TfZUIhgH6hKPaTKLXQn3rRzCo",
  authDomain: "card-store-finder.firebaseapp.com",
  projectId: "card-store-finder",

  messagingSenderId: "340038449458",
  appId: "1:340038449458:web:14c3327a26d0d2892f3f2b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
window._currentUser = undefined; // undefined=아직로딩중, null=비로그인, object=로그인
onAuthStateChanged(auth, function(u){ 
  window._currentUser = u || null; 
  try{ 
    if(u) localStorage.setItem('haeka_uid', u.uid);
  }catch(e){}
});

function cardColor(card) {
  var map = {'VISA':'#1a1f71','MASTER':'#eb001b','JCB':'#007b40','AMEX':'#007bc1','트래블로그':'#FF6B00','트래블월렛':'#b8970a','UnionPay':'#9b7fe8'};
  return map[card] || '#888';
}

function timeAgo(ts) {
  if (!ts) return '방금 전';
  var now = Date.now();
  var t = ts.toMillis ? ts.toMillis() : ts;
  var diff = Math.floor((now - t) / 60000);
  if (diff < 1) return '방금 전';
  if (diff < 60) return diff + '분 전';
  if (diff < 1440) return Math.floor(diff/60) + '시간 전';
  return Math.floor(diff/1440) + '일 전';
}

// 신호등 계산 (등록일 기준 임시)
function getSignal(store) {
  if (!store.createdAt) return { color: 'red', txt: '🔴 정보 없음', cls: 'signal-red' };
  var days = Math.floor((Date.now() - store.createdAt.toMillis()) / 86400000);
  if (days <= 90) return { color: 'green', txt: '🟢 최근 결제 확인', cls: 'signal-green' };
  if (days <= 180) return { color: 'yellow', txt: '🟡 확인 필요', cls: 'signal-yellow' };
  return { color: 'red', txt: '🔴 오래된 정보', cls: 'signal-red' };
}

async function loadStore() {
  // URL 파라미터에서 store ID 가져오기
  var params = new URLSearchParams(window.location.search);
  var storeId = params.get('id');

  // 테스트용 더미 데이터 (실제 사용 시 Firebase에서 불러옴)
  var store = window._storeData || {
    name: '멘자 레스토랑',
    category: '식당',
    address: 'Budapest, Liszt Ferenc tér 2, 1061 헝가리',
    lat: 47.5003,
    lng: 19.0610,
    payOk: ['VISA', 'MASTER', 'AMEX'],
    payNo: ['JCB'],
    review: '분위기 너무 좋고 음식도 맛있어요! 비자카드 결제 잘 됐습니다.',
    images: [],
    createdAt: { toMillis: () => Date.now() - 1000*60*30 }
  };

  if (storeId) {
    try {
      var snap = await getDoc(doc(db, 'stores', storeId));
      if (snap.exists()) { store = { id: snap.id, ...snap.data() }; window._storeLoaded = store; }
    } catch(e) { console.log('Firebase 오류:', e); }
  }

  renderStore(store);
}

async function renderStore(store) {
  // store 데이터 저장 (찜 버튼에서 사용)
  window._currentDpStore = store;
  // 폐업 배지
  if (store.closed) showClosedBadge();
  // 수정 요청 배지 로드
  if (store.id) loadEditRequest(store.id);
  // 찜 상태 복원
  try {
    var list = JSON.parse(localStorage.getItem('haeka_zzim') || '[]');
    if (list.some(function(s){ return s.id === store.id; })) {
      document.getElementById('zzim-btn').classList.add('on');
    }
  } catch(e) {}

  var signal = getSignal(store);

  // 사진 슬라이드
  var heroEl = document.getElementById('hero-img');
  var dotsEl = document.getElementById('hero-dots');
  var images = store.images && store.images.length ? store.images.filter(function(u){ return u !== store.videoUrl; }) : [];
  if(store.videoUrl) images = [store.videoUrl].concat(images); // 동영상 첫번째
  var _slideIdx = 0;

  function renderSlide(){
    heroEl.innerHTML = '';
    heroEl.style.background = '';
    dotsEl.innerHTML = '';
    if(!images.length){
      var catEmojis = {'식당':'🍽️','카페':'☕','펍':'🍺','패스트푸드':'🍔','이자카야':'🍶','편의점':'🏪','마트':'🛒','호텔':'🏨'};
      heroEl.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px">'+(catEmojis[store.category]||'🏬')+'</div>';
      return;
    }
    var src = images[_slideIdx];
    var isVideo = store.videoUrl && src === store.videoUrl;
    if(isVideo){
      heroEl.innerHTML = '<video src="'+src+'" autoplay muted loop playsinline preload="auto" style="width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;pointer-events:none"></video>';
    } else {
      heroEl.innerHTML = '<img src="'+src+'" style="width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;pointer-events:none"/>';
    }
    // 점 인디케이터
    if(images.length > 1){
      dotsEl.innerHTML = images.map(function(_,i){
        return '<div style="width:'+(i===_slideIdx?'16':'6')+'px;height:6px;border-radius:3px;background:'+(i===_slideIdx?'#fff':'rgba(255,255,255,.5)')+';transition:.2s;cursor:pointer" onclick="heroGoTo('+i+')"></div>';
      }).join('');
    }
  }

  window.heroGoTo = function(idx){ _slideIdx=idx; renderSlide(); };

  // 스와이프 - hero 전체에 이벤트 (overlay가 heroEl 터치 막아서)
  var _hStartX=0;
  var heroWrap = document.getElementById('hero');
  heroWrap.addEventListener('touchstart',function(e){_hStartX=e.touches[0].clientX;},{passive:true});
  heroWrap.addEventListener('touchend',function(e){
    var diff=e.changedTouches[0].clientX-_hStartX;
    if(Math.abs(diff)<30)return;
    if(diff<0) _slideIdx=(_slideIdx+1)%images.length;
    else _slideIdx=(_slideIdx-1+images.length)%images.length;
    renderSlide();
  },{passive:true});
  heroWrap.addEventListener('mousedown',function(e){_hStartX=e.clientX;});
  document.addEventListener('mouseup',function(e){
    if(!_hStartX)return;
    var diff=e.clientX-_hStartX; _hStartX=0;
    if(Math.abs(diff)<30||!heroWrap.contains(e.target))return;
    if(diff<0) _slideIdx=(_slideIdx+1)%images.length;
    else _slideIdx=(_slideIdx-1+images.length)%images.length;
    renderSlide();
  });

  renderSlide();

  // 상호명, 업종, 신호등
  document.getElementById('hero-name').textContent = store.name;
  document.getElementById('hero-cat').textContent = store.category || '';
  var sigEl = document.getElementById('signal-badge');
  sigEl.textContent = signal.txt;
  sigEl.className = 'signal-badge ' + signal.cls;

  // 등록일자, 닉네임
  var dateEl = document.getElementById('hero-date');
  var nickEl = document.getElementById('hero-nick');
  if (store.createdAt) {
    var d = new Date(store.createdAt.toMillis ? store.createdAt.toMillis() : store.createdAt);
    dateEl.textContent = d.getFullYear()+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getDate().toString().padStart(2,'0');
  }
  var storeNick = store.nickname || store.nick || '해카마왕';
  nickEl.textContent = '등록자 ' + storeNick;
  // 본인 글이면 삭제 버튼 추가
  var MY_NICK = '해카마왕';
  if(storeNick === MY_NICK && store.id){
    var btns = document.getElementById('bottom-btns');
    if(btns){
      var delBtn = document.createElement('button');
      delBtn.className = 'btn-report';
      delBtn.textContent = '매장 삭제';
      delBtn.onclick = async function(){
        if(!confirm('정말 이 매장을 삭제할까요?')) return;
        try{
          if(window._deleteStore) await window._deleteStore(store.id);
          alert('삭제됐어요!');
          window.location.href = 'heka_home_v5.html';
        }catch(e){ alert('삭제에 실패했어요'); }
      };
      btns.appendChild(delBtn);
    }
  }

function calcIsOpen(hours) {
  try {
    var now = new Date();
    var today = now.getDay();
    var todayIdx = today === 0 ? 6 : today - 1;
    var todayHours = (hours[todayIdx] || '').replace(/^[^:]+:\s*/, '').trim();
    if (!todayHours || todayHours.includes('휴무') || todayHours.toLowerCase().includes('closed')) return false;
    if (todayHours.includes('24시간')) return true;

    // "오전 10:30 ~ 오후 7:30" 형식 파싱
    var parts = todayHours.split('~');
    if (parts.length < 2) return null;

    function parseTime(s) {
      s = s.trim();
      var isPM = s.includes('오후') || s.includes('PM');
      var isAM = s.includes('오전') || s.includes('AM');
      var m = s.match(/(\d{1,2}):(\d{2})/);
      if (!m) return null;
      var h = parseInt(m[1]), min = parseInt(m[2]);
      if (isPM && h < 12) h += 12;
      if (isAM && h === 12) h = 0;
      return h * 60 + min;
    }

    var openMins = parseTime(parts[0]);
    var closeMins = parseTime(parts[1]);
    if (openMins === null || closeMins === null) return null;

    var nowMins = now.getHours() * 60 + now.getMinutes();
    // 자정 넘기는 경우
    if (closeMins <= openMins) closeMins += 24 * 60;
    return nowMins >= openMins && nowMins < closeMins;
  } catch(e) { return null; }
}

  var todayDesc = (hours[todayIdx] || '').replace(/^[^:]+:\s*/, '');
  var todayDayName = dayNames[todayIdx];
  var openBadge = isOpen === true ? '<span class="hours-badge-open">영업중</span>'
    : isOpen === false ? '<span class="hours-badge-close">영업종료</span>' : '';
  document.getElementById('hours-today-txt').innerHTML =
    openBadge + '<span class="hours-today">'+todayDayName+'요일 '+todayDesc+'</span>';
  var allHtml = hours.map(function(h, i) {
    var isToday = i === todayIdx;
    return '<div class="hours-day-row" style="color:'+(isToday?'#FF3900':'#555')+';font-weight:'+(isToday?'700':'400')+'">'
      + '<span>'+dayNames[i]+'요일</span>'
      + '<span>'+h.replace(/^[^:]+:\s*/, '')+'</span>'
      + '</div>';
  }).join('');
  document.getElementById('hours-all-content').innerHTML = allHtml;
}

  try {

    if (!_db || !getDocs) return;
    // resolved 필드 없는 문서도 포함해서 전체 조회 후 필터
    var snap = await getDocs(query(collection(_db, 'editRequests'), where('storeId', '==', storeId)));
    if (snap.empty) return;
    var reqDoc = null;
    snap.docs.forEach(function(d) {

      if (!data.resolved) reqDoc = d;
    });
    if (!reqDoc) return;
    var req = { id: reqDoc.id, ...reqDoc.data() };

      badge.style.display = 'flex';
      badge.onclick = function(){ window.openEditReqPopup && window.openEditReqPopup(); };
      badge.innerHTML = '수정중 <sup style="font-size:8px;font-weight:800">+'+agreeCount+'</sup>';
      heroEl.appendChild(badge);
    }
  } catch(e) { console.error(e); }
}

function openEditReqPopup() {
  if (!_editReqData) return;
  var waited = 0;
  var check = setInterval(function(){
    waited += 100;
    // _currentUser 로드 완료 대기 (undefined=로딩중)
    if (window._currentUser !== undefined || waited >= 5000) {
      clearInterval(check);
      var uid = (window._currentUser && window._currentUser.uid);
      if (uid) {
        // 최신 uid로 localStorage 갱신
        try{ localStorage.setItem('haeka_uid', uid); }catch(e){}
        _doOpenEditReqPopup();
      } else if (localStorage.getItem('haeka_uid')) {
        _doOpenEditReqPopup();
      } else {
        showLoginNeedPopup();
      }
    }
  }, 100);
}
function _doOpenEditReqPopup() {
  var req = _editReqData;
  if (!req) return;
  var agreeCount = (req.agreeUids || []).length;
  var _uid = (window._currentUser && window._currentUser.uid) || localStorage.getItem('haeka_uid');
  var alreadyVoted = (req.agreeUids || []).includes(_uid) || (req.disagreeUids || []).includes(_uid);
  var body = '';
  if (req.payOk && req.payOk.length) body += '<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:700;color:#FF3900;margin-bottom:4px">결제 가능 수단</div><div style="display:flex;flex-wrap:wrap;gap:4px">' + req.payOk.map(function(c){ return '<span style="background:#FFF1F2;color:#FF3900;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px">'+c+'</span>'; }).join('') + '</div></div>';
  if (req.payNo && req.payNo.length) body += '<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:700;color:#e53e3e;margin-bottom:4px">결제 불가 수단</div><div style="display:flex;flex-wrap:wrap;gap:4px">' + req.payNo.map(function(c){ return '<span style="background:#fff0f0;color:#e53e3e;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px">'+c+'</span>'; }).join('') + '</div></div>';
  if (req.memo) body += '<div style="font-size:11px;color:#888;margin-top:4px">메모: '+req.memo+'</div>';
  body += '<div style="font-size:11px;color:#aaa;margin-top:8px">현재 맞아요 ' + agreeCount + '/3</div>';
  document.getElementById('edit-req-body').innerHTML = body;
  var agreeBtn = document.getElementById('edit-agree-btn');
  if (alreadyVoted) {
    agreeBtn.disabled = true;
    agreeBtn.style.opacity = '0.5';
    agreeBtn.textContent = '이미 투표했어요';
  } else {
    agreeBtn.disabled = false;
    agreeBtn.style.opacity = '1';
    agreeBtn.textContent = '맞아요';
  }
  document.getElementById('edit-req-overlay').style.display = 'block';
  document.getElementById('edit-req-popup').style.display = 'block';
}

function showClosedBadge() {
  var heroEl = document.getElementById('hero');
  if (!heroEl || document.getElementById('closed-badge')) return;
  var badge = document.createElement('div');
  badge.id = 'closed-badge';
  badge.className = 'closed-badge';
  badge.textContent = '🚫 폐업';
  heroEl.appendChild(badge);
}

function showLoginNeedPopup() {
  document.getElementById('login-need-overlay').style.display = 'block';
  document.getElementById('login-need-popup').style.display = 'block';
}
function closeLoginNeedPopup() {
  document.getElementById('login-need-overlay').style.display = 'none';
  document.getElementById('login-need-popup').style.display = 'none';
}
function closeEditReqPopup() {
  document.getElementById('edit-req-overlay').style.display = 'none';
  document.getElementById('edit-req-popup').style.display = 'none';
}

window.voteEditRequest = async function(type) {
  var uid = (window._currentUser && window._currentUser.uid) || localStorage.getItem('haeka_uid');
  if (!uid) { showLoginNeedPopup(); return; }
  if (!_editReqData) return;
  var req = _editReqData;
  var alreadyVoted = (req.agreeUids || []).includes(uid) || (req.disagreeUids || []).includes(uid);
  if (alreadyVoted) { showToast('이미 투표했어요'); return; }
  closeEditReqPopup();
  try {
    var doc=window._doc, updateDoc=window._updateDoc, arrayUnion=window._arrayUnion, db=window._db;
  var reqRef = doc(db, 'editRequests', req.id);
    if (type === 'agree') {
      var newAgree = [...(req.agreeUids || []), uid];
      await updateDoc(reqRef, { agreeUids: arrayUnion(uid) });
      _editReqData.agreeUids = newAgree;
      // 배지 업데이트
      var badge = document.getElementById('edit-req-badge');
      if (badge) badge.innerHTML = '수정중 <sup style="font-size:8px;font-weight:800">+'+newAgree.length+'</sup>';
      showToast('맞아요! 투표가 반영됐어요');
      // 3명 달성 시 자동 업데이트
      if (newAgree.length >= 3) {
        var storeRef = doc(db, 'stores', req.storeId);
        var updateData = {};
        if (req.payOk && req.payOk.length) updateData.payOk = req.payOk;
        if (req.payNo && req.payNo.length) updateData.payNo = req.payNo;
        if (req.isClosed) updateData.closed = true;
        await updateDoc(storeRef, updateData);
        // 폐업 처리 시 배지 표시
        if (req.isClosed) showClosedBadge();
        await updateDoc(reqRef, { resolved: true });
        if (badge) badge.remove();
        _editReqData = null;
        showToast('✅ 맞아요 3명 달성! 정보가 자동 업데이트됐어요');
      }
    } else {
      var newDisagree = [...(req.disagreeUids||[]), uid];
      await updateDoc(reqRef, { disagreeUids: arrayUnion(uid) });
      _editReqData.disagreeUids = newDisagree;
      showToast('틀려요! 의견이 반영됐어요');
      if (newDisagree.length >= 3) {
        await updateDoc(reqRef, { resolved: true });
        var badge = document.getElementById('edit-req-badge');
        if (badge) badge.remove();
        _editReqData = null;
        showToast('수정 요청이 취소됐어요');
      }
    }
  } catch(e) { console.error(e); showToast('오류가 발생했어요'); }
};
window.openEditReqPopup = openEditReqPopup;
window.closeEditReqPopup = closeEditReqPopup;

function goReviewAll() {
  var s = window._currentDpStore || {};
  var id = s.id || new URLSearchParams(location.search).get('id') || '';
  var name = encodeURIComponent(s.name || '');
  location.href = 'heka_review_all.html?id=' + id + '&name=' + name;
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
}
</script>
</body>
