<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<meta name="theme-color" content="#FF3900"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="HAEKA"/>
<meta charset="utf-8"/>
<link rel="stylesheet" href="app-mobile.css"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>내가 찜한 여행톡</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('haeka_rebuild_common.css');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
.phone{width:390px;max-width:100vw;background:#fff;min-height:100vh;position:relative;display:flex;flex-direction:column}
.sb{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px;font-size:11px;font-weight:600;color:#111;background:#fff}
.topbar{display:flex;align-items:center;padding:8px 14px;background:#fff;border-bottom:0.5px solid #f0f0f0;position:sticky;top:0;z-index:10}
.topbar-title{flex:1;text-align:center;font-size:15px;font-weight:700;color:#111}
.back-btn{font-size:20px;color:#111;cursor:pointer;background:none;border:none;padding:0;line-height:1;width:28px}
.scroll-wrap{flex:1;overflow-y:auto;padding-bottom:20px}
.post-item{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:0.5px solid #f5f5f5;cursor:pointer;background:#fff;transition:.1s}
.post-item:active{background:#f9f9f9}
.post-thumb{width:44px;height:44px;border-radius:10px;flex-shrink:0;overflow:hidden;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:20px}
.post-thumb img{width:100%;height:100%;object-fit:cover}
.post-body{flex:1;min-width:0}
.post-tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;color:#fff;margin-bottom:4px}
.post-title{font-size:13px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.post-meta{font-size:11px;color:#aaa}
.del-btn{background:none;border:none;font-size:18px;color:#ccc;cursor:pointer;padding:4px;flex-shrink:0}
.del-btn:hover{color:#f87171}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:#bbb;font-size:13px;gap:10px}
.empty-icon{font-size:36px}
/* HAEKA 2.0 common override */
:root{--hk-bg:#FAFAF8;--hk-surface:#fff;--hk-text:#1A1A1A;--hk-sub:#6B7280;--hk-accent:#FF3900;--hk-border:#F3F4F6;--hk-card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
body{background:var(--hk-bg)!important;font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important;color:var(--hk-text)!important}.phone{background:var(--hk-bg)!important;border:0!important;box-shadow:0 24px 70px rgba(17,24,39,.14)!important}.sb,.topbar{background:#fff!important;color:var(--hk-text)!important;border-bottom:1px solid var(--hk-border)!important;box-shadow:0 1px 10px rgba(0,0,0,.035)!important}.topbar-title,.logo{color:var(--hk-text)!important;font-weight:800!important}.btn-green,.btn-primary,.primary,.popup-btn,.send-btn{background:var(--hk-accent)!important;color:#fff!important;border-color:var(--hk-accent)!important;border-radius:12px!important;box-shadow:0 8px 20px rgba(255,56,92,.25)!important}input:focus,textarea:focus,select:focus{border-color:var(--hk-accent)!important}.card,.item,.list-item,.post-card,.store-card,.notice-item{background:#fff!important;border:0!important;border-radius:16px!important;box-shadow:var(--hk-card-shadow)!important}.bnav{background:rgba(255,255,255,.94)!important;border-top:1px solid var(--hk-border)!important}.ni.on,.nplbl{color:var(--hk-accent)!important}.npbtn{background:var(--hk-accent)!important}.toast{background:rgba(26,26,26,.88)!important;backdrop-filter:blur(10px)!important;border-radius:999px!important}button[style*="#FF3900"],[style*="background:#FF3900"]{background:var(--hk-accent)!important;color:#fff!important}[style*="color:#FF3900"],[style*="border-color:#FF3900"]{color:var(--hk-accent)!important;border-color:var(--hk-accent)!important}

.del-btn svg{width:18px;height:18px;stroke:#9CA3AF;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.del-btn:hover svg{stroke:#EF4444}

@media (max-width:480px){
  body{padding:0!important;background:var(--hk-bg)!important}
  .phone{width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important;min-height:100vh!important}
}
</style>
<script src="security.js"></script>
</head>
<body>
<div class="phone">
  <div class="sb"><span>9:41</span><span>해카</span><span style="opacity:0">●●●</span></div>
  <div class="topbar">
    <button class="back-btn" onclick="history.back()">←</button>
    <span class="topbar-title">내가 찜한 여행톡</span>
    <div style="width:28px"></div>
  </div>
  <div class="scroll-wrap" id="post-list"></div>
</div>

<script>
// 로그인 게이트 (페이지 진입) — 미로그인 시 로그인 페이지로
if (window._requireLogin && !window._requireLogin('찜한 여행톡은 로그인 후 볼 수 있어요')) {
  // requireLogin 내부에서 redirect 처리. 스크립트 실행 중단.
  throw new Error('login required');
}
var TAG_COLOR = {'동행':'#16A34A','맛집':'#D97706','날씨':'#0369A1','정보':'#7E22CE'};
var TAG_TEXT = {'동행':'동','맛집':'맛','날씨':'날','정보':'정'};
var TAG_BG = {'동행':'#F0FDF4','맛집':'#FFF7E6','날씨':'#E0F2FE','정보':'#F3E8FF'};

function getSaved(){ try{ return JSON.parse(localStorage.getItem('haeka_saved_posts')||'[]'); }catch(e){ return []; } }
function setSaved(list){ try{ localStorage.setItem('haeka_saved_posts', JSON.stringify(list)); }catch(e){} }

function render(){
  var list = getSaved();
  var el = document.getElementById('post-list');
  if(!list.length){
    el.innerHTML = '<div class="empty"><div>찜한 여행톡이 없어요</div><div style="font-size:11px;color:#ddd">여행톡에서 저장 버튼을 눌러보세요</div></div>';
    return;
  }
  el.innerHTML = list.map(function(p, i){
    var tag = p.tagTxt||'정보';
    var tagColor = TAG_COLOR[tag]||'#FF3900';
    var emoji = TAG_TEXT[tag]||'톡';
    var bg = TAG_BG[tag]||'#f5f5f5';
    var hasImg = p.images && p.images[0] && typeof p.images[0]==='string' && p.images[0].length>10;
    var thumb = hasImg
      ? '<div class="post-thumb"><img src="'+window._safeImg(p.images[0])+'" onerror="this.parentNode.style.background=\''+bg+'\';this.parentNode.innerHTML=\''+emoji+'\'"></div>'
      : '<div class="post-thumb" style="background:'+bg+'">'+emoji+'</div>';
    return '<div class="post-item" onclick="location.href=\'heka_post_detail.html?id='+(p.id||'')+'\'">'
      +thumb
      +'<div class="post-body">'
      +'<span class="post-tag" style="background:'+tagColor+'">'+tag+'</span>'
      +'<div class="post-title">'+(window._esc?window._esc(p.title):String(p.title||''))+'</div>'
      +'<div class="post-meta">'+(window._esc?window._esc(p.user):String(p.user||''))+' · '+p.time+'</div>'
      +'</div>'
      +'<button class="del-btn" onclick="event.stopPropagation();removeSaved('+i+')" aria-label="삭제"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 01-2 2H9a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 012-2h2a2 2 0 012 2v2"/></svg></button>'
      +'</div>';
  }).join('');
}

function removeSaved(idx){
  var list = getSaved();
  list.splice(idx,1);
  setSaved(list);
  render();
}

render();
</script>
</body>
</html>
