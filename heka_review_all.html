<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<meta name="theme-color" content="#FF3900"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="HAEKA"/>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>결제 후기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('haeka_rebuild_common.css');
:root{--hk-bg:#FAFAF8;--hk-surface:#fff;--hk-text:#1A1A1A;--hk-sub:#6B7280;--hk-muted:#9CA3AF;--hk-accent:#FF3900;--hk-accent-bg:#FFF1F2;--hk-border:#F3F4F6;--hk-card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--hk-bg);max-width:480px;margin:0 auto;min-height:100vh;color:var(--hk-text)}

.topbar{position:sticky;top:0;z-index:100;background:#fff;display:flex;align-items:center;padding:0 16px;height:54px;border-bottom:1px solid var(--hk-border);box-shadow:0 1px 10px rgba(0,0,0,.035)}
.back-btn{width:34px;height:34px;border-radius:50%;background:#F5F5F3;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-right:10px;border:none;font-size:17px;color:var(--hk-text);flex-shrink:0}
.topbar-title{font-size:16px;font-weight:800;color:var(--hk-text);flex:1;letter-spacing:-.02em}

/* 매장 헤더 카드 */
.store-header{background:#fff;margin:14px 14px 10px;border-radius:16px;padding:16px 18px;box-shadow:var(--hk-card-shadow)}
.store-name{font-size:16px;font-weight:800;color:var(--hk-text);margin-bottom:8px;letter-spacing:-.02em}
.store-rating{display:flex;align-items:center;gap:8px}
.rating-big{font-size:26px;font-weight:900;color:#F59E0B;letter-spacing:-.03em;line-height:1;display:inline-flex;align-items:center;gap:4px}
.rating-big .star-mark{font-size:22px;color:#F59E0B}
.rating-count{font-size:12.5px;color:var(--hk-sub);font-weight:600}

.section-bar{padding:14px 18px 8px;font-size:11.5px;color:var(--hk-muted);font-weight:700;letter-spacing:.04em}

/* 리뷰 아이템 카드 */
.rev-item{background:#fff;margin:0 14px 10px;padding:16px 16px 14px;border-radius:16px;box-shadow:var(--hk-card-shadow)}
.rev-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rev-av{width:40px;height:40px;border-radius:50%;background:var(--hk-accent-bg);border:2px solid var(--hk-accent-bg);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--hk-accent);flex-shrink:0;overflow:hidden}
.rev-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.rev-info{flex:1;min-width:0}
.rev-name{font-size:14px;font-weight:800;color:var(--hk-text);letter-spacing:-.01em}
.rev-meta{font-size:11.5px;color:var(--hk-muted);margin-top:2px;font-weight:500}
.rev-star{font-size:13px;color:#F59E0B;font-weight:800;letter-spacing:1px;display:inline-block;margin-bottom:8px}
.rev-txt{font-size:14.5px;color:#374151;line-height:1.65;margin-bottom:8px;letter-spacing:-.01em;font-weight:500;word-break:break-word}
.rev-imgs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.rev-img{width:78px;height:78px;border-radius:12px;object-fit:cover;background:#F3F4F6;cursor:pointer}
.rev-cards{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.rev-card-badge{font-size:11px;font-weight:800;padding:3px 7px;border-radius:5px;color:#fff;letter-spacing:.01em}
.cb-visa{background:#1a1f71}
.cb-master{background:#eb001b}
.cb-jcb{background:#007b40}
.cb-amex{background:#007bc1}
.cb-tlog{background:#FF6B00}
.cb-twallet{background:#FFD600;color:#1F2937}
.cb-union{background:#e21836}
.cb-cash{background:#6B7280}
.cb-etc{background:#9CA3AF}

.empty{text-align:center;padding:80px 24px;color:var(--hk-muted);font-size:14px;font-weight:500;line-height:1.7}
.empty .empty-stars{display:inline-flex;gap:4px;margin-bottom:14px}
.empty .empty-stars svg{width:24px;height:24px;fill:#E5E7EB}
.empty .empty-title{font-size:15px;font-weight:700;color:var(--hk-sub);margin-bottom:6px}
.empty .empty-sub{font-size:13px;color:var(--hk-muted);font-weight:500}

/* FAB 후기 쓰기 */
.write-btn{position:fixed;bottom:96px;right:18px;background:var(--hk-accent);color:#fff;border:none;border-radius:999px;padding:13px 20px 13px 16px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(255,57,0,.32);font-family:inherit;display:inline-flex;align-items:center;gap:7px;z-index:50;letter-spacing:-.01em;transition:transform .15s ease}
.write-btn:active{transform:scale(.96)}
.write-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.loading{text-align:center;padding:60px;color:var(--hk-muted);font-size:14px;font-weight:500}

/* 하단 네비 (홈 표준) */
.bnav{display:flex;border-top:1px solid var(--hk-border);background:#FFFFFF;padding:8px 0 10px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40}
.bnav .ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#999;gap:3px;font-weight:600}
.bnav .ni svg{width:22px;height:22px}
.bnav .ni.on{color:var(--hk-accent)}
.bnav .ni.on svg{stroke:var(--hk-accent)}
.bnav .nplus{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.bnav .npbtn{width:36px;height:36px;border-radius:50%;background:var(--hk-accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;border:none;cursor:pointer;margin-bottom:2px;margin-top:-4px;box-shadow:0 8px 16px rgba(255,57,0,.25)}
.bnav .nplbl{font-size:10px;color:var(--hk-accent);font-weight:700}

/* body 하단 네비 가림 방지 */
body{padding-bottom:84px}

/* 모바일 풀폭 */
@media (max-width:480px){
  body{max-width:100%!important;background:var(--hk-bg)!important}
}
</style>
<script src="security.js"></script>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="topbar-title">결제 후기</div>
</div>

<div class="store-header" id="store-header" style="display:none">
  <div class="store-name" id="store-name-txt"></div>
  <div class="store-rating">
    <span class="rating-big" id="rating-big">★-</span>
    <span class="rating-count" id="rating-count"></span>
  </div>
</div>

<div id="review-wrap">
  <div class="loading">불러오는 중...</div>
</div>

<button class="write-btn" onclick="goWrite()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>후기 쓰기</button>

<!-- 하단 네비 (홈 표준) -->
<div class="bnav">
  <div class="ni on" onclick="window.location.href='heka_home_v5.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#FF3900"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H14v-6h-4v6H4a1 1 0 01-1-1V9.5z" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>홈</div>
  <div class="ni" onclick="window.location.href='heka_register.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#999"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>등록</div>
  <div class="nplus" onclick="window.location.href='heka_city.html'"><button class="npbtn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" style="width:18px;height:18px"><circle cx="11" cy="11" r="7" stroke-width="2"/><line x1="16.5" y1="16.5" x2="22" y2="22" stroke-width="2" stroke-linecap="round"/></svg></button><span class="nplbl">검색</span></div>
  <div class="ni" onclick="window.location.href='heka_yeohaengtok_v2.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#999"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>여행톡</div>
  <div class="ni" onclick="window.location.href='heka_mypage.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#999"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="7" r="4" stroke-width="1.6"/></svg>마이페이지</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmcsC_89TfZUIhgH6hKPaTKLXQn3rRzCo",
  authDomain: "card-store-finder.firebaseapp.com",
  projectId: "card-store-finder",
  storageBucket: "card-store-finder.firebasestorage.app",
  appId: "1:340038449458:web:14c3327a26d0d2892f3f2b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

function timeAgo(ts) {
  if (!ts) return '방금 전';
  var now = Date.now();
  var t = ts.toMillis ? ts.toMillis() : ts;
  var diff = Math.floor((now - t) / 60000);
  if (diff < 1) return '방금 전';
  if (diff < 60) return diff + '분 전';
  if (diff < 1440) return Math.floor(diff/60) + '시간 전';
  return Math.floor(diff/1440) + '일 전';
}

function initials(name) {
  if (!name) return '?';
  return name.charAt(0).toUpperCase();
}

const params = new URLSearchParams(location.search);
const storeId = params.get('id');
const storeName = params.get('name') || '';

window._goWrite = function() {
  var id = new URLSearchParams(location.search).get('id') || '';
  var name = new URLSearchParams(location.search).get('name') || '';
  location.href = 'heka_review_write.html?id=' + id + '&name=' + name;
};
window.goWrite = window._goWrite;

async function loadAll() {
  const wrap = document.getElementById('review-wrap');

  // 매장 정보
  if (storeId) {
    try {
      const snap = await getDoc(doc(db, 'stores', storeId));
      if (snap.exists()) {
        const s = snap.data();
        const hdr = document.getElementById('store-header');
        document.getElementById('store-name-txt').textContent = s.name || storeName;
        document.getElementById('rating-big').textContent = s.rating ? '★' + s.rating : '★-';
        hdr.style.display = 'block';

        // store.review (단일 텍스트) 가 있으면 기본 리뷰로 포함
        const items = [];
        if (s.review) {
          items.push({
            nickname: s.nickname || s.nick || '등록자',
            photoURL: s.photoURL || null,
            text: s.review,
            createdAt: s.createdAt,
            cards: s.cards || [],
            rating: null
          });
        }

        // reviews 서브컬렉션이 있으면 추가 로드
        try {
          const rSnap = await getDocs(
            collection(db, 'stores', storeId, 'reviews')
          );
          rSnap.forEach(r => items.push({ id: r.id, ...r.data() }));
        } catch(e) { console.error('reviews 서브컬렉션 로드 실패:', e); }

        renderReviews(wrap, items, s.rating);
      }
    } catch(e) {
      console.error(e);
      wrap.innerHTML = '<div class="empty"><div class="empty-title">불러오기 실패</div><div class="empty-sub">잠시 후 다시 시도해주세요</div></div>';
    }
  } else {
    wrap.innerHTML = '<div class="empty"><div class="empty-title">매장 정보가 없어요</div></div>';
  }
}

function cardBadgeClass(name){
  var map = {'VISA':'cb-visa','MASTER':'cb-master','JCB':'cb-jcb','AMEX':'cb-amex','트래블로그':'cb-tlog','트래블월렛':'cb-twallet','UnionPay':'cb-union','현금':'cb-cash'};
  return map[name] || 'cb-etc';
}

function renderReviews(wrap, items, avgRating) {
  const countEl = document.getElementById('rating-count');
  if (countEl) countEl.textContent = '후기 ' + items.length + '개';

  if (!items.length) {
    wrap.innerHTML = '<div class="empty">'
      + '<div class="empty-stars">'
      +   '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'
      +   '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'
      +   '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'
      + '</div>'
      + '<div class="empty-title">아직 결제 후기가 없어요</div>'
      + '<div class="empty-sub">첫 번째 후기를 남겨보세요</div>'
      + '</div>';
    return;
  }

  wrap.innerHTML = '<div class="section-bar">후기 ' + items.length + '개</div>'
    + items.map(function(r) {
      var avHtml = r.photoURL
        ? '<div class="rev-av"><img src="'+r.photoURL+'" onerror="this.parentNode.textContent=\''+initials(r.nickname || '?')+'\'" /></div>'
        : '<div class="rev-av">'+initials(r.nickname || '등록자')+'</div>';

      var starHtml = r.rating ? '<span class="rev-star">'+'★'.repeat(Math.round(r.rating))+'</span>' : '';

      var imgHtml = '';
      if (r.images && r.images.length) {
        imgHtml = '<div class="rev-imgs">'
          + r.images.slice(0,4).map(function(u){ return '<img class="rev-img" src="'+u+'" onerror="this.style.display=\'none\'">'; }).join('')
          + '</div>';
      }

      var cardHtml = '';
      if (r.cards && r.cards.length) {
        cardHtml = '<div class="rev-cards">'
          + r.cards.map(function(c){ return '<span class="rev-card-badge '+cardBadgeClass(c)+'">'+c+'</span>'; }).join('')
          + '</div>';
      }

      return '<div class="rev-item">'
        + '<div class="rev-top">'
        + avHtml
        + '<div class="rev-info"><div class="rev-name">'+(r.nickname||r.nick||'익명')+'</div>'
        + '<div class="rev-meta">'+timeAgo(r.createdAt)+'</div></div>'
        + '</div>'
        + starHtml
        + '<div class="rev-txt">'+(r.text||r.review||'')+'</div>'
        + imgHtml
        + cardHtml
        + '</div>';
    }).join('');
}

loadAll();
</script>
</body>
</html>
