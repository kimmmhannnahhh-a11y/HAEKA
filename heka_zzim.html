// 사진이 없는 매장은 카테고리 그림으로 대신한다
var CAT_IMAGES = { "ATM": "img/cat-atm.jpg", "기타": "img/cat-etc.jpg", "마트": "img/cat-mart.jpg", "쇼핑": "img/cat-shopping.jpg", "식당": "img/cat-restaurant.jpg", "입장권": "img/cat-ticket.jpg", "카페": "img/cat-cafe.jpg?v=3", "패스트푸드": "img/cat-fastfood.jpg", "술집": "img/cat-sooljip.jpg", "편의점": "img/cat-convenience.jpg", "호텔": "img/cat-hotel.jpg", "코인로커": "img/cat-locker.jpg", "짐 운반": "img/cat-luggage.jpg", "코인세탁소": "img/cat-laundry.jpg", "환전소": "img/cat-exchange.jpg", "온천": "img/cat-bath.jpg", "목욕탕": "img/cat-bath.jpg", "게임센터": "img/cat-arcade.jpg", "노래방": "img/cat-karaoke.jpg", "만화카페": "img/cat-mangacafe.jpg" };
function catImage(cat) { return CAT_IMAGES[cat] || ""; }
// 체인점 기본 사진: 매장 사진이 없을 때 업종 그림 대신 쓴다(직접 찍어 온 간판 사진을 자른 것). 이름이 정확히 같은 매장만
var BRAND_IMAGES = { "루이싱 커피": "img/brand-luckin.jpg?v=6" };
function brandImage(s) { return (s && BRAND_IMAGES[s.name]) || ""; }
function storeThumb(s) { return (s && s.images && s.images[0]) || brandImage(s) || catImage(s && s.cuisine !== '기타' && s.cuisine) || catImage(s && s.category) || ""; }
</script>
<script>
// 카드가 안 되는 가게는 목록에서 바로 보이게 빨간 표시를 붙인다
function payStatePill(s) {
  var no = (s && s.payNo) || [];
  if (no.indexOf("카드불가") < 0) return "";
  return '<span class="cpill" style="background:#DC2626;color:#fff">현금만</span>';
}
</script>
<script>
// 한글로 바꾼 가게는 현지 간판 이름도 작게 같이 보여준다
function localName(s) {
  var v = s && s.nameLocal;
  if (!v) return "";
  var e = window._esc || function(x){ return x==null?"":String(x); };
  return '<span style="font-size:11px;color:#9CA3AF;font-weight:500;margin-left:5px">' + e(v) + '</span>';
}
</script>
<script>
// 카드가 되는지 안 되는지에 따라 목록에 표시를 붙인다
//   현금만       : 카드가 안 된다고 확인된 곳
//   카드 정보 없음 : 아직 아무도 확인하지 않은 곳 (현금만과 헷갈리면 안 된다)
function payStatePill(s) {
  var ok = (s && s.payOk) || [], no = (s && s.payNo) || [];
  if (ok.indexOf("현금만") > -1 || no.indexOf("현금만") > -1 || no.indexOf("카드불가") > -1) return '<span class="cpill" style="background:#DC2626;color:#fff">현금만</span>';
  var hasCard = ok.some(function(c){ return /VISA|MASTER|JCB|AMEX|UnionPay|트래블|알리페이|위챗페이|카드가능/.test(c); });
  if (hasCard) return "";
  return '<span class="cpill" style="background:#E5E7EB;color:#6B7280">카드 정보 없음</span>';
}
</script>

function hkdIcon(key, cls) { return '<svg class="' + (cls || 'hkd-ic') + '" viewBox="0 0 24 24" aria-hidden="true">' + (HKD_IC[key] || HKD_IC._tag) + '</svg>'; }
var HKD_PIN = '<path d="M12 21.5s-7-6.3-7-11.7a7 7 0 0 1 14 0c0 5.4-7 11.7-7 11.7z"/><circle cx="12" cy="9.8" r="2.5"/>';

function _hkdE(t) { return window._esc ? window._esc(t) : (t == null ? '' : String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; })); }
// 결제수단 하나를 배지로. big=true 는 팝업의 큰 배지
function hkdPay(c, big) {
  var k = big ? 'hkd-bp' : 'hkd-pay';
  if (c === '알리페이') return big
    ? '<span class="' + k + ' ali"><span class="ic"><span class="hkd-mask hkd-m-ali"></span></span>알리페이</span>'
    : '<span class="' + k + ' ali"><span class="hkd-mask hkd-m-ali ali-i"></span>Alipay</span>';
  if (c === '위챗페이') return big
    ? '<span class="' + k + ' we"><span class="ic"><span class="hkd-mask hkd-m-we"></span></span>위챗페이</span>'
    : '<span class="' + k + ' we"><span class="we-b"><span class="hkd-mask hkd-m-we"></span></span>WeChat Pay</span>';
  var L = { 'VISA': ['visa-c.svg', 'visa'], 'MASTER': ['mastercard-mark.svg', 'mc'], 'JCB': ['jcb-c.svg', 'jcb'], 'AMEX': ['amex-c.svg', 'amex'], 'UnionPay': ['unionpay-c.svg', 'up'] }[c];
  if (L) return '<span class="' + k + ' logo" title="' + c + '"><img class="' + L[1] + '" src="img/pay/' + L[0] + '" alt="' + c + '"></span>';
  if (c === '트래블로그') return '<span class="' + k + ' t">' + hkdIcon('_card') + c + '</span>';
  if (c === '트래블월렛') return '<span class="' + k + ' t">' + hkdIcon('_wallet') + c + '</span>';
  if (c === '현금가능') return '<span class="' + k + ' t cash">' + hkdIcon('_cash') + c + '</span>';
  if (c === '현금만' || c === '카드불가' || c === '현금불가') return '<span class="' + k + ' t red">' + _hkdE(c) + '</span>';
  if (c === '카드 정보 없음' || c === '모르겠어요' || c === '카드가능(브랜드모름)') return '<span class="' + k + ' t gray">' + _hkdE(c) + '</span>';
  return '<span class="' + k + ' t">' + _hkdE(c) + '</span>';
}
// 매장 결제수단 → 배지 줄 (기존 목록 규칙 그대로: 현금만·카드 정보 없음 표시, 카드 순서)
function hkdPays(store, big, noUnknown) {
  var cardOrder = ['VISA','MASTER','JCB','AMEX','UnionPay','트래블로그','트래블월렛','알리페이','위챗페이'];
  var ok = store.payOk || [], no = store.payNo || [];
  var cards = ok.filter(function (c) { return c !== '현금만' && c !== '카드불가' && !(c === '현금가능' && (no.indexOf('카드불가') > -1 || ok.indexOf('현금만') > -1)); });
  cards.sort(function (a, b) { var ai = cardOrder.indexOf(a), bi = cardOrder.indexOf(b); return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi); });
  var st = '';
  if (ok.indexOf('현금만') > -1 || no.indexOf('현금만') > -1 || no.indexOf('카드불가') > -1) st = hkdPay('현금만', big);
  else if (!noUnknown && !ok.some(function (c) { return /VISA|MASTER|JCB|AMEX|UnionPay|트래블|알리페이|위챗페이|카드가능/.test(c); })) st = hkdPay('카드 정보 없음', big);
  var h = st + cards.map(function (c) { return hkdPay(c, big); }).join('');
  if (window.haekaBook && haekaBook(store)) h += '<span class="' + (big ? 'hkd-bp' : 'hkd-pay') + ' t book">온라인 예매</span>';
  return h;
}
// 별점 줄: 후기가 없으면 "리뷰 없음 (0)", 있으면 평균 (개수). 뒤에 대표메뉴(없으면 세부 업종)
function hkdMenu(s) { return (Array.isArray(s.menus) && s.menus.length) ? s.menus.join(', ') : ((s.cuisine && s.cuisine !== s.category) ? s.cuisine : ''); }
function hkdRate(s) {
  var n = +s.ratingCnt || 0;
  var avg = (n > 0 && s.ratingSum) ? (s.ratingSum / n).toFixed(1) : '0';
  var menu = hkdMenu(s);
  return '<div class="hkd-row"><svg class="star" viewBox="0 0 24 24">' + HKD_STAR + '</svg><span>'
    + (n > 0 ? '<b class="avg">' + avg + '</b> (' + n.toLocaleString() + ')' : '리뷰 없음 (0)')
    + (menu ? ' · ' + _hkdE(menu) : '') + '</span></div>';
}

  var city=s&&s.city&&String(s.city).trim();
  return (city&&_zzCityToCountry[city])||'기타';
}

var _selCats=[];          // 업종 여러 개 (비어 있으면 전체)
var _selCountry='전체';   // 나라 하나
var _selCity='전체';      // 고른 나라 안의 도시 하나
function zzCity(s){return (s&&s.city&&String(s.city).trim())||'기타';}

function renderChips(){
  // 업종 칩: 찜한 매장에 있는 업종만
  var have={};
  _allStores.forEach(function(s){ have[zzCat(s)]=1; });
  var known=ZZ_CATS.filter(function(c){ return have[c] && c!=='기타'; });
  var extra=Object.keys(have).filter(function(c){ return ZZ_CATS.indexOf(c)<0; });
  var cats=known.concat(extra, have['기타']?['기타']:[]);
  _selCats=_selCats.filter(function(c){ return have[c]; });
  var h='';
  if(cats.length){
    h='<div class="zz-chip all'+(_selCats.length?'':' on')+'" onclick="selectCat(null)">전체</div>';
    cats.forEach(function(c){
      h+='<div class="zz-chip'+(_selCats.indexOf(c)>-1?' on':'')+'" data-cat="'+_hkdE(c)+'" onclick="selectCat(this.getAttribute(\'data-cat\'))">'+hkdIcon(c)+'<span>'+_hkdE(zzCatLbl(c))+'</span></div>';
    });
    h+='<span class="zz-chip-gap"></span>';
  }
  document.getElementById('cat-row').innerHTML=h;

  // 나라 칩: 국기 + 이름 + 개수, 많은 순 (기타는 맨 뒤)
  var cnt={};
  _allStores.forEach(function(s){ var c=zzCountry(s); cnt[c]=(cnt[c]||0)+1; });
  if(_selCountry!=='전체'&&!cnt[_selCountry]) _selCountry='전체';
  var order=ZZ_COUNTRIES.map(function(c){ return c[0]; });
  var names=Object.keys(cnt).sort(function(a,b){
    if(a==='기타') return 1; if(b==='기타') return -1;
    if(cnt[b]!==cnt[a]) return cnt[b]-cnt[a];
    var ai=order.indexOf(a), bi=order.indexOf(b); return (ai<0?999:ai)-(bi<0?999:bi);
  });
  var g='';
  if(_allStores.length){
    g='<div class="zz-chip all'+(_selCountry==='전체'?' on':'')+'" onclick="selectCountry(null)">전체 <span class="n">'+_allStores.length+'</span></div>';
    names.forEach(function(n){
      var code=_zzFlag[n];
      g+='<div class="zz-chip'+(_selCountry===n?' on':'')+'" data-country="'+_hkdE(n)+'" onclick="selectCountry(this.getAttribute(\'data-country\'))">'
        +(code?'<img class="flag" src="img/flags/'+code+'.png" alt="" onerror="this.style.display=\'none\'">':'')
        +'<span>'+_hkdE(n)+'</span><span class="n">'+cnt[n]+'</span></div>';
    });
    g+='<span class="zz-chip-gap"></span>';
  }
  document.getElementById('country-row').innerHTML=g;

  // 도시 칩: 나라를 고르면 그 나라의 도시들(개수 많은 순, 기타는 맨 뒤). 나라 전체면 숨김
  var ch='';
  if(_selCountry==='전체') _selCity='전체';
  else {
    var cc={}, inC=0;
    _allStores.forEach(function(s){ if(zzCountry(s)!==_selCountry) return; inC++; var c=zzCity(s); cc[c]=(cc[c]||0)+1; });
    if(_selCity!=='전체'&&!cc[_selCity]) _selCity='전체';
    var cities=Object.keys(cc).sort(function(a,b){ if(a==='기타') return 1; if(b==='기타') return -1; return (cc[b]-cc[a])||a.localeCompare(b,'ko'); });
    ch='<div class="zz-chip all'+(_selCity==='전체'?' on':'')+'" onclick="selectCity(null)">전체 <span class="n">'+inC+'</span></div>';
    cities.forEach(function(c){ ch+='<div class="zz-chip'+(_selCity===c?' on':'')+'" data-city="'+_hkdE(c)+'" onclick="selectCity(this.getAttribute(\'data-city\'))"><span>'+_hkdE(c)+'</span><span class="n">'+cc[c]+'</span></div>'; });
    ch+='<span class="zz-chip-gap"></span>';
  }
  document.getElementById('city-row').innerHTML=ch;
  document.getElementById('zz-total').textContent=_allStores.length?_allStores.length:'';
}
function selectCat(c){
  if(c==null) _selCats=[];
  else { var i=_selCats.indexOf(c); if(i>-1) _selCats.splice(i,1); else _selCats.push(c); }
  doFilter();
}
function selectCountry(n){ _selCountry=(n==null||_selCountry===n)?'전체':n; _selCity='전체'; doFilter(); }
function selectCity(c){ _selCity=(c==null||_selCity===c)?'전체':c; doFilter(); }

// 드래그 스크롤 (PC 마우스)
document.addEventListener('DOMContentLoaded', function(){
  ['cat-row','country-row','city-row'].forEach(function(id){
    var el=document.getElementById(id), isDown=false, moved=false, startX, scrollLeft;
    el.addEventListener('mousedown', function(e){ isDown=true; moved=false; el.classList.add('dragging'); startX=e.pageX; scrollLeft=el.scrollLeft; });
    el.addEventListener('mouseleave', function(){ isDown=false; el.classList.remove('dragging'); });
    el.addEventListener('mouseup', function(){ isDown=false; el.classList.remove('dragging'); });
    el.addEventListener('mousemove', function(e){ if(!isDown)return; var dx=e.pageX-startX; if(Math.abs(dx)>4) moved=true; if(!moved)return; e.preventDefault(); el.scrollLeft=scrollLeft-dx; });
    el.addEventListener('click', function(e){ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } }, true);
  });
});

function getZzimList(){
  if(window._currentUser&&window._zzimStores)return window._zzimStores.slice();
  try{return JSON.parse(localStorage.getItem('haeka_zzim')||'[]');}catch(e){return[];}
}
async function saveZzimList(list){
  if(window._currentUser&&window._db){
    window._zzimStores=list;
    try{await window._setDoc(window._doc(window._db,'zzim',window._currentUser.uid),{stores:list},{merge:true});}catch(e){console.error(e);}
  } else {
    try{localStorage.setItem('haeka_zzim',JSON.stringify(list));}catch(e){}
  }
}

async function removeZzim(id){
  var list=getZzimList().filter(function(s){return s.id!==id;});
  // window._zzimStores 즉시 업데이트 (홈 복귀 시 참조하는 값)
  window._zzimStores = list;
  await saveZzimList(list); _allStores=list;
  // 홈화면에 찜 변경 알림
  try { sessionStorage.setItem('haeka_zzim_changed','1'); } catch(e){}
  doFilter();
  showToast('찜 목록에서 삭제됐어요');
}

// 한글 발음 → 영어 매칭
var _CHO2=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
var _JUNG2=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
var _JONG2=['','g','kk','gs','n','nj','nh','d','l','lg','lm','lb','ls','lt','lp','lh','m','b','bs','s','ss','ng','j','ch','k','t','p','h'];
var _EQUIV={'p':['f','b'],'f':['p','b'],'b':['p','v'],'k':['c','g','q'],'c':['k','g'],'g':['k'],'r':['l'],'l':['r'],'t':['d'],'d':['t'],'s':['z'],'n':['ng'],'w':[''],'':['w']};
function _getSyllPron(str){var r='';for(var i=0;i<str.length;i++){var code=str.charCodeAt(i)-0xAC00;if(code<0||code>11171){r+=str[i];continue;}var cho=Math.floor(code/588),jung=Math.floor((code%588)/28),jong=code%28;var p=_CHO2[cho]+_JUNG2[jung]+_JONG2[jong];p=p.replace(/eu/g,'').replace(/eo/g,'o').replace(/ae/g,'e');r+=p;}return r.toLowerCase();}
function _cons(s){return s.replace(/[aeiou]/g,'');}
function _consMatch(ec,kc){if(ec===kc)return true;var e1=_EQUIV[ec]||[];for(var i=0;i<e1.length;i++)if(e1[i]===kc)return true;var e2=_EQUIV[kc]||[];for(var i=0;i<e2.length;i++)if(e2[i]===ec)return true;return false;}
function _korMatchEng(kor,eng){var korCons=_cons(_getSyllPron(kor));if(!korCons||korCons.length<2)return false;var engClean=eng.toLowerCase().replace(/['\s\-.,!?]/g,'');var engCons=_cons(engClean);var ki=0;for(var ei=0;ei<engCons.length&&ki<korCons.length;ei++){if(_consMatch(engCons[ei],korCons[ki]))ki++;}if(ki>=korCons.length)return true;var words=eng.toLowerCase().split(/[\s'\-]+/);for(var w=0;w<words.length;w++){var wc=_cons(words[w]);ki=0;for(var ei=0;ei<wc.length&&ki<korCons.length;ei++){if(_consMatch(wc[ei],korCons[ki]))ki++;}if(ki>=korCons.length)return true;}return false;}

function zzimSearchMatch(s, kw){
  var name=(s.name||'').toLowerCase();
  var addr=(s.address||'').toLowerCase();
  if(name.indexOf(kw)>-1||addr.indexOf(kw)>-1)return true;
  if(/[가-힣]/.test(kw)){
    if(_korMatchEng(kw,s.name||''))return true;
    if(_korMatchEng(kw,s.address||''))return true;
  }
  return false;
}

function doFilter(){
  renderChips();
  var kw=(document.getElementById('search-input').value||'').trim().toLowerCase();
  var list=_allStores.filter(function(s){
    var catOk=!_selCats.length||_selCats.indexOf(zzCat(s))>-1;
    var cOk=_selCountry==='전체'||zzCountry(s)===_selCountry;
    var cityOk=_selCity==='전체'||zzCity(s)===_selCity;
    var kOk=!kw||zzimSearchMatch(s,kw);
    return catOk&&cOk&&cityOk&&kOk;
  });
  renderList(list);
}

function renderList(list){
  var el=document.getElementById('store-list');
  var cb=document.getElementById('count-bar');
  if(!_allStores.length){
    cb.textContent='';
    el.innerHTML='<div class="empty-state">'
      +'<div class="empty-emoji">🤍</div>'
      +'<div class="empty-txt">아직 찜한 매장이 없어요</div>'
      +'<div class="empty-sub">마음에 드는 매장을<br>하트를 눌러 저장해보세요!</div>'
      +'<button class="empty-btn" onclick="location.href=\'heka_nearby_all.html\'">주변 매장 보러가기</button>'
      +'</div>';
    return;
  }
  cb.textContent='전체 '+list.length+'개';
  if(!list.length){ el.innerHTML='<div class="zz-none">조건에 맞는 찜한 매장이 없어요</div>'; return; }
  var _e=_hkdE;
  var _u=window._safeImg||function(x){return x==null?'':(/^https:\/\//i.test(x)?x:'');};
  el.innerHTML=list.map(function(s){
    var pills=hkdPays(s,false,true);
    var dist='';
    if(userLat&&userLng&&s.lat&&s.lng){dist=_e(distLbl(calcDist(userLat,userLng,s.lat,s.lng)));}
    var _ci=brandImage(s)||catImage(s.cuisine!=='기타'&&s.cuisine)||catImage(s.category); var _t=storeThumb(s); var imgSrc=(_t&&_t===_ci)?_ci:(_t?_u(_t):'');
    var thumb=imgSrc?'<img src="'+imgSrc+'" alt="" onerror="this.style.display=\'none\'">':'<div class="hkd-ph-emo" style="background:'+catBg(s.category)+'">'+_e(catEmoji(s.category))+'</div>';
    var meta=[dist,_e(s.city||''),_e(s.category==='호텔'?'숙소':(s.category||''))].filter(Boolean).join(' · ');
    var realIdx=_allStores.indexOf(s);
    return'<div class="hkd-card" onclick="openDetail('+realIdx+')">'
      +'<div class="hkd-ph">'+thumb+'</div>'
      +'<div class="hkd-bd"><div class="hkd-nm"><b>'+_e(s.name)+'</b>'+(s.nameLocal?'<span class="ln">'+_e(s.nameLocal)+'</span>':'')+(s.closed?'<span class="cl">폐업</span>':'')+'</div>'
      +(meta?'<div class="hkd-row"><svg class="pin" viewBox="0 0 24 24">'+HKD_PIN+'</svg><span>'+meta+'</span></div>':'')
      +hkdRate(s)
      +'<div class="hkd-pays store-cards">'+pills+'</div></div>'
      +'<button class="store-zzim hkd-heart on" data-store-id="'+_e(s.id||'')+'" onclick="event.stopPropagation();removeZzim(this.getAttribute(\'data-store-id\'))" aria-label="찜 해제"><svg viewBox="0 0 24 24">'+HKD_HEART+'</svg></button>'
      +'<svg class="hkd-chev" viewBox="0 0 24 24"><path d="M9 5.5l6.5 6.5L9 18.5"/></svg></div>';
  }).join('');
}

function openDetail(idx){
  var store=_allStores[idx];
  if(!store)return;
  window._currentStoreId=store.id||null;
  document.getElementById('dp-name').textContent=store.name;
  document.getElementById('dp-cat').textContent=(((store.category==='호텔'||store.cuisine===store.category)&&store.cuisine)?store.cuisine:[store.cuisine, (store.category==='호텔'?'숙소':store.category)].filter(Boolean).join(' · '));
  document.getElementById('detail-overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
  var distHtml='';
  if(userLat&&userLng&&store.lat&&store.lng){var dm=calcDist(userLat,userLng,store.lat,store.lng);distHtml='<div class="zz-dp-dist">📍 '+distLbl(dm)+' 거리</div>';}
  var mapHtml='';
  if(store.lat&&store.lng){window._mapStore=store; window.haekaFindPlace&&haekaFindPlace(store);mapHtml='<div class="zz-dp-map" onclick="haekaOpenMap(window._mapStore)"><div id="dp-gmap"></div></div>'+(window.haekaAmapBtn?haekaAmapBtn(store):'');}
  document.getElementById('dp-scroll').innerHTML=
    distHtml
    +'<div class="hkd-payrow"><div class="hkd-payrow-l"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M14 14.5h3.5"/></svg><i></i>'+(store.category==='ATM'?'출금 가능':'결제 가능')+'</div><div class="hkd-payrow-r">'+hkdPays(store,true)+'</div></div>'
    +(store.address?'<div class="zz-dp-addr">'+_hkdE(store.address)+'</div>':'')
    +mapHtml;
  if(store.lat&&store.lng&&typeof google!=='undefined'){
    setTimeout(function(){var el=document.getElementById('dp-gmap');if(!el)return;haekaMiniMap(el, store);},0);
  }
}
function closeDetail(){document.getElementById('detail-overlay').classList.remove('open');document.getElementById('detail-panel').classList.remove('open');}
function toggleDpZzim(){var id=window._currentStoreId;if(!id)return;removeZzim(id);closeDetail();}
function goToDetail(){var id=window._currentStoreId;window.location.href='heka_store_detail.html'+(id?'?id='+id:'');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

function init(){
  try{var cached=sessionStorage.getItem('haeka_gps');if(cached){var cv=JSON.parse(cached);userLat=cv.lat;userLng=cv.lng;}}catch(e){}
  // Firestore에서 로드된 찜 목록 우선 사용
  if(window._currentUser && window._zzimStores) {
    _allStores = window._zzimStores.slice();
  } else {
    _allStores = getZzimList();
  }
  doFilter();
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(
    function(p){userLat=p.coords.latitude;userLng=p.coords.longitude;try{sessionStorage.setItem('haeka_gps',JSON.stringify({lat:userLat,lng:userLng}));}catch(e){}doFilter();},
    function(){},{timeout:5000,maximumAge:60000}
  );
}
window.addEventListener('DOMContentLoaded', function(){
  // Firebase 로드 대기 (최대 1.5초) 후 init
  var waited = 0;
  var checkFb = setInterval(function(){
    waited += 100;
    if(window._fbReady || waited >= 3000){
      clearInterval(checkFb);
      init();
    }
  }, 100);
});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyCmcsC_89TfZUIhgH6hKPaTKlXQn3rRzCo",
  authDomain: "card-store-finder.firebaseapp.com",
  projectId: "card-store-finder",
  storageBucket: "card-store-finder.firebasestorage.app",
  messagingSenderId: "340038449458",
  appId: "1:340038449458:web:14c3327a26d0d2892f3f2b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
window._db = db;
window._setDoc = setDoc;
window._doc = doc;
onAuthStateChanged(auth, async u => {
  window._currentUser = u;
  if (u) {
    try {
      var snap = await getDoc(doc(db, 'zzim', u.uid));
      var local = JSON.parse(localStorage.getItem('haeka_zzim') || '[]');
      if (local.length > 0) {
        var existing = (snap.exists() && snap.data().stores) ? snap.data().stores : [];
        var existIds = existing.map(function(s){ return s.id; });
        var merged = existing.slice();
        local.forEach(function(s){ if(existIds.indexOf(s.id)===-1) merged.unshift(s); });
        await setDoc(doc(db,'zzim',u.uid), { stores: merged }, { merge: true });
        localStorage.removeItem('haeka_zzim');
        window._zzimStores = merged;
      } else {
        window._zzimStores = snap.exists() ? (snap.data().stores || []) : [];
      }
    } catch(e) { console.error('zzim load:', e); }
  } else {
    // 비로그인 상태도 ready
    window._fbReady = true;
    return;
  }
  window._fbReady = true;
});
</script>
