<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="app-mobile.css"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>공지사항</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('haeka_rebuild_common.css');
@media not all{
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;justify-content:center}
.phone{width:390px;max-width:100vw;background:#fff;min-height:100vh;display:flex;flex-direction:column}
.sb{display:flex;justify-content:space-between;padding:10px 16px 4px;font-size:11px;font-weight:600;color:#111}
.topbar{display:flex;align-items:center;padding:8px 14px;background:#fff;border-bottom:0.5px solid #f0f0f0;position:sticky;top:0;z-index:10}
.topbar-title{flex:1;text-align:center;font-size:15px;font-weight:700;color:#111}
.back-btn{font-size:20px;color:#111;cursor:pointer;background:none;border:none;padding:0;line-height:1;width:28px}
.scroll-wrap{flex:1;overflow-y:auto}
.notice-item{padding:16px;border-bottom:0.5px solid #f5f5f5;cursor:pointer}
.notice-item:active{background:#f9f9f9}
.notice-tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:4px;font-weight:700;color:#fff;margin-bottom:7px}
.notice-title{font-size:14px;font-weight:700;color:#111;margin-bottom:5px}
.notice-body{font-size:12px;color:#666;line-height:1.6;display:none}
.notice-item.open .notice-body{display:block}
.notice-date{font-size:11px;color:#bbb;margin-top:6px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:#bbb;font-size:13px;gap:10px}
/* HAEKA 2.0 common override */
:root{--hk-bg:#FAFAF8;--hk-surface:#fff;--hk-text:#1A1A1A;--hk-sub:#6B7280;--hk-accent:#FF4D3E;--hk-border:#F3F4F6;--hk-card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
body{background:var(--hk-bg)!important;font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important;color:var(--hk-text)!important}.phone{background:var(--hk-bg)!important;border:0!important;box-shadow:0 24px 70px rgba(17,24,39,.14)!important}.sb,.topbar{background:#fff!important;color:var(--hk-text)!important;border-bottom:1px solid var(--hk-border)!important;box-shadow:0 1px 10px rgba(0,0,0,.035)!important}.topbar-title,.logo{color:var(--hk-text)!important;font-weight:800!important}.btn-green,.btn-primary,.primary,.popup-btn,.send-btn{background:var(--hk-accent)!important;color:#fff!important;border-color:var(--hk-accent)!important;border-radius:12px!important;box-shadow:0 8px 20px rgba(255,56,92,.25)!important}input:focus,textarea:focus,select:focus{border-color:var(--hk-accent)!important}.card,.item,.list-item,.post-card,.store-card,.notice-item{background:#fff!important;border:0!important;border-radius:16px!important;box-shadow:var(--hk-card-shadow)!important}.bnav{background:rgba(255,255,255,.94)!important;border-top:1px solid var(--hk-border)!important}.ni.on,.nplbl{color:var(--hk-accent)!important}.npbtn{background:var(--hk-accent)!important}.toast{background:rgba(26,26,26,.88)!important;backdrop-filter:blur(10px)!important;border-radius:999px!important}button[style*="#FF4D3E"],[style*="background:#FF4D3E"]{background:var(--hk-accent)!important;color:#fff!important}[style*="color:#FF4D3E"],[style*="border-color:#FF4D3E"]{color:var(--hk-accent)!important;border-color:var(--hk-accent)!important}
}
</style>
<script src="security.js"></script>
</head>
<body>
<div class="phone">
  <div class="sb"><span>9:41</span><span>해카</span><span style="opacity:0">●●●</span></div>
  <div class="topbar">
    <button class="back-btn" onclick="history.back()">←</button>
    <span class="topbar-title">공지사항</span>
    <div style="width:28px"></div>
  </div>
  <div class="scroll-wrap" id="notice-list">
    <div class="empty"><div style="font-size:36px">📢</div><div>불러오는 중...</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyCmcsC_89TfZUIhgH6hKPaTKlXQn3rRzCo",
  authDomain:"card-store-finder.firebaseapp.com",
  projectId:"card-store-finder",
  storageBucket:"card-store-finder.firebasestorage.app"
});
const db = getFirestore(app);

var TAG_COLOR = {'업데이트':'#FF4D3E','점검':'#f59e0b','이벤트':'#6366f1','공지':'#888'};

function formatDate(ts) {
  if (!ts) return '';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.getFullYear()+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getDate().toString().padStart(2,'0');
}

async function load() {
  var el = document.getElementById('notice-list');
  try {
    var snap = await getDocs(query(collection(db,'notices'), orderBy('createdAt','desc'), limit(30)));
    if (snap.empty) {
      el.innerHTML = '<div class="empty"><div style="font-size:36px">📢</div><div>공지사항이 없어요</div></div>';
      return;
    }
    el.innerHTML = '';
    snap.forEach(function(d) {
      var n = d.data();
      var tag = n.tag || '공지';
      var color = TAG_COLOR[tag] || '#888';
      var div = document.createElement('div');
      div.className = 'notice-item';
      div.innerHTML =
        '<span class="notice-tag" style="background:'+color+'">'+tag+'</span>'
        +'<div class="notice-title">'+n.title+'</div>'
        +'<div class="notice-body">'+n.content+'</div>'
        +'<div class="notice-date">'+formatDate(n.createdAt)+'</div>';
      div.onclick = function(){ this.classList.toggle('open'); };
      el.appendChild(div);
    });
  } catch(e) {
    el.innerHTML = '<div class="empty"><div style="font-size:36px">📢</div><div>불러오기 실패</div></div>';
  }
}
load();
</script>
</body>
</html>
