@import url('haeka_rebuild_common.css');
@media all{
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f0f0;display:flex;justify-content:center;padding:30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.phone-wrap{position:relative;width:300px}
.phone{width:300px;background:#fff;border-radius:26px;border:1px solid #e0e0e0;overflow:visible;color:#111;position:relative}

.topbar-title{font-size:15px;font-weight:600;color:#fff}

.live-txt{font-size:11px;color:#4ADE80;font-weight:500}
.search-wrap{padding:6px 16px 0}

.city-chip{display:flex;align-items:center;gap:3px;background:#fff;border:1px solid #ddd;border-radius:20px;padding:3px 8px 3px 6px;font-size:10px;font-weight:600;color:#333;cursor:pointer;flex-shrink:0;white-space:nowrap;transition:.12s}

.search-input,.search-input:focus{border:0!important;box-shadow:none!important;outline:0!important;background:transparent!important}
.search-btn{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#FF3900;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}

.search-result-bar.show{display:block}
.search-result-bar span{color:#FF3900;font-weight:600}
.filt{display:flex;align-items:center;gap:6px;padding:6px 16px 0;overflow-x:auto;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.fb{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid #ddd;font-size:11px;font-weight:500;color:#555;background:#fff;cursor:pointer;white-space:nowrap;transition:.15s;font-family:inherit}
.fb:hover{border-color:#FF3900;color:#FF3900}
.fb.on{background:#FF3900;color:#fff;border-color:#FF3900;font-weight:600}
.post-list{padding:8px 12px 80px;display:flex;flex-direction:column;gap:10px}
.fpost{padding:14px;background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);cursor:pointer;display:flex;flex-direction:row;gap:12px;align-items:flex-start;transition:.15s;position:relative}
.fpleft{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}

.new-dot{width:6px;height:6px;border-radius:50%;background:#FF3900;display:inline-block;vertical-align:middle;margin-right:4px;flex-shrink:0}
.fpav{width:28px;height:28px;border-radius:50%;background:#FFF1F2;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;font-size:14px}
.fpmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.fphead{display:flex;align-items:center;gap:6px}
.fpu{font-size:12px;color:#1A1A1A;font-weight:700}
.fpd{font-size:11px;color:#9CA3AF;flex-shrink:0}
.fptitle{font-size:15px;font-weight:800;line-height:1.35;color:#1A1A1A;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fpbody{font-size:13px;color:#6B7280;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fpbottom{display:flex;align-items:center;gap:10px;font-size:11px;color:#9CA3AF}
.fpbottom .meta{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.fpbottom .meta svg{width:13px;height:13px;stroke:#9CA3AF;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fpbottom .meta.liked svg{fill:#FF3900;stroke:#FF3900}
.fptitle{margin-top:0!important}
.fptitle .fptag{display:inline-flex;vertical-align:2px;margin-right:6px}
.fptitle .new-dot{display:inline-block;vertical-align:4px;margin-right:6px}
.fptitle .fpflag{vertical-align:-2px;margin-right:5px}
.fpbottom .fpwho{display:inline-flex!important;align-items:center;gap:5px!important;height:auto!important;min-width:0;overflow:hidden}
.fpbottom .fpwho .fpav{width:18px!important;height:18px!important;flex-shrink:0}
.fpbottom .fpwho .fpu{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fpbottom .fpwho .fpd{white-space:nowrap}
.fptag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;flex-shrink:0;letter-spacing:.02em}
.fptag-mate{background:#F0FDF4;color:#16A34A}
.fptag-food{background:#FFF7E6;color:#D97706}
.fptag-weather{background:#E0F2FE;color:#0369A1}
.fptag-info{background:#F3E8FF;color:#7E22CE}
.fptag-success{background:#DCFCE7;color:#15803D}
.fptag-fail{background:#FEE2E2;color:#B91C1C}
.fpfooter-info{display:flex;align-items:center;gap:6px;font-size:10px;color:#bbb}
.fpthumb{flex-shrink:0;width:80px;height:80px;border-radius:12px;overflow:hidden;background:#F3F4F6;align-self:center}
.fpthumb img{width:80px;height:80px;object-fit:cover;display:block}
.write-fab{position:fixed;right:18px;bottom:78px;width:54px;height:54px;border-radius:50%;background:#FF3900;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px rgba(255,57,0,.35),0 2px 6px rgba(0,0,0,.12);z-index:30;transition:transform .15s,box-shadow .15s}
.write-fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,57,0,.45),0 4px 10px rgba(0,0,0,.15)}
.write-fab:active{transform:translateY(0)}
.write-fab svg{width:22px;height:22px}
@media (min-width:481px){.write-fab{position:absolute;right:18px;bottom:78px}}
.bnav{display:flex;border-top:0.5px solid #eee;background:#fff;padding:8px 0 10px}
.ni{flex:1;text-align:center;font-size:9px;color:#999;cursor:pointer;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.ni.on{color:#FF3900;font-weight:600}
.ni svg{width:17px;height:17px}
.nplus{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.npbtn{width:36px;height:36px;border-radius:50%;background:#FF3900;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;border:none;cursor:pointer;margin-bottom:2px;margin-top:-4px}
.nplbl{font-size:9px;color:#FF3900;font-weight:600}
.side-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);z-index:20;display:none;border-radius:26px}
.side-overlay.open{display:block}
.side-panel{position:absolute;top:0;right:0;width:200px;height:100%;background:#fff;border-left:0.5px solid #eee;z-index:21;display:flex;flex-direction:column;border-radius:0 26px 26px 0;overflow:hidden;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.side-panel.open{transform:translateX(0)}
.panel-header{padding:14px 14px 10px;border-bottom:0.5px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:13px;font-weight:700}
.panel-close{font-size:16px;color:#999;cursor:pointer;background:none;border:none;line-height:1}
.panel-searchbar{margin:9px 12px;background:#f5f5f5;border-radius:20px;padding:7px 11px;font-size:11px;color:#aaa;display:flex;align-items:center;gap:5px}
.panel-searchbar svg{width:12px;height:12px;stroke:#aaa;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.panel-list{flex:1;overflow-y:auto}
.panel-item{padding:10px 14px;font-size:12px;color:#333;border-bottom:0.5px solid #f5f5f5;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.panel-item:hover{background:#f9f9f9}
.panel-flag{font-size:14px;margin-right:6px}
.panel-arr{font-size:10px;color:#ccc}
.panel-back{padding:9px 14px;font-size:11px;color:#555;cursor:pointer;display:flex;align-items:center;gap:4px;border-bottom:0.5px solid #f0f0f0;background:#f9f9f9}
/* HAEKA 2.0 common override */

}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmcsC_89TfZUIhgH6hKPaTKlXQn3rRzCo",
  authDomain: "card-store-finder.firebaseapp.com",
  projectId: "card-store-finder",

const catTagMap = {'동행':'mate','맛집':'food','날씨':'weather','정보':'info'};
const catBgMap = {'동행':'#F0FDF4','맛집':'#FFF7E6','날씨':'#E0F2FE','정보':'#F3E8FF'};
const catEmojiMap = {'동행':'동','맛집':'맛','날씨':'날','정보':'정'};
// 카드성공/카드거절 → 정보로 강제 변환 (지원 종료된 카테고리)
function normalizeCategory(c){ if(c==='카드성공'||c==='카드거절') return '정보'; return c||'정보'; }

function timeAgo(ts){
  if(!ts) return '방금 전';
  var t=ts.toMillis?ts.toMillis():(ts.seconds?ts.seconds*1000:(typeof ts==='number'?ts:Date.now()));
  var now=Date.now();
  var diff=Math.floor((now-t)/60000);
  if(diff<1) return '방금 전';
  var today=new Date(); today.setHours(0,0,0,0);
  if(t>=today.getTime()){
    if(diff<60) return diff+'분 전';
    return Math.floor(diff/60)+'시간 전';
  }
  var days=Math.floor((now-t)/86400000);
  if(days<=14) return days+'일 전';
  var d=new Date(t);
  var curYear=new Date().getFullYear();
  var mm=String(d.getMonth()+1).padStart(2,'0');
  var dd=String(d.getDate()).padStart(2,'0');
  var hh=String(d.getHours()).padStart(2,'0');
  var min=String(d.getMinutes()).padStart(2,'0');
  if(d.getFullYear()===curYear) return mm+'.'+dd+' '+hh+':'+min;
  return String(d.getFullYear()).slice(2)+'.'+mm+'.'+dd+' '+hh+':'+min;
}

const q = query(collection(db,'posts'), orderBy('createdAt','desc'), limit(50));
onSnapshot(q, function(snapshot){
  var fbPosts = [];
  snapshot.forEach(function(doc){
    var d = doc.data();
    var normCat = normalizeCategory(d.category);
    var tag = catTagMap[normCat] || 'info';
    fbPosts.push({
      id: doc.id,
      av: catEmojiMap[normCat]||'톡',
      user: d.nickname || '여행자',
      uid: d.uid || '',
      date: d.createdAt ? new Date(d.createdAt.toMillis()).toLocaleDateString('ko',{month:'2-digit',day:'2-digit'}).replace(/\./g,'').replace(' ','') : '',
      city: d.city || '',
      title: d.title || '',
      body: d.body || '',
      tag: tag,
      tagTxt: normCat,
      images: d.images || [],
      thumb: d.images&&d.images[0] ? '<img src="'+d.images[0]+'" style="width:100%;height:auto;object-fit:contain;border-radius:8px;display:block">' : (catEmojiMap[normCat]||'톡'),
      thumbBg: catBgMap[normCat]||'#f5f5f5',
      time: timeAgo(d.createdAt),
      cmts: d.commentCount||0,
      likes: d.likeCount||0,
      fromFirebase: true,
    });
  });
  // Firebase 글 + 더미 데이터 합치기
  window._fbPosts = fbPosts;
  window.posts = fbPosts;
  if(window.renderPosts) window.renderPosts(window.posts); if(typeof applyMyAvatar==="function") applyMyAvatar();
});
</script>

<script>
var posts = [];

function getReadSet(){ try{ return new Set(JSON.parse(localStorage.getItem('haeka_read_posts')||'[]')); }catch(e){ return new Set(); } }
function markRead(id){ try{ var s=getReadSet(); s.add(id); localStorage.setItem('haeka_read_posts',JSON.stringify([...s])); }catch(e){} }

function renderPosts(list){
  var el = document.getElementById('post-list');
  if(!list.length){ el.innerHTML='<div style="padding:48px 16px;text-align:center;font-size:13px;color:#9CA3AF">아직 글이 없어요<br><span style="font-size:11px;color:#bbb">첫 번째 여행톡을 남겨보세요</span></div>'; return; }
  var readSet = getReadSet();
  var likedSet; try{ likedSet = new Set(JSON.parse(localStorage.getItem('haeka_liked_posts')||'[]')); }catch(e){ likedSet = new Set(); }
  var heartSvg = '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>';
  var commentSvg = '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>';
  el.innerHTML = list.map(function(p){
    var tagClassMap = {'mate':'fptag-mate','food':'fptag-food','weather':'fptag-weather','info':'fptag-info','success':'fptag-success','fail':'fptag-fail'};
    var tagClass = tagClassMap[p.tag] || 'fptag-info';
    var hasImg = p.images && p.images[0] && typeof p.images[0]==='string' && p.images[0].length > 10;
    var thumbHtml = hasImg
      ? '<div class="fpthumb"><img src="'+p.images[0]+'" loading="lazy" decoding="async" onerror="this.parentNode.style.display=\'none\'"/></div>'
      : '';
    var isNew = p.id && !readSet.has(p.id);
    var dotHtml = isNew ? '<span class="new-dot"></span>' : '';
    var detailUrl = p.id ? 'heka_post_detail.html?id='+p.id : 'heka_post_detail.html';
    var onclickFn = p.id ? "markRead('"+p.id+"');location.href='"+detailUrl+"'" : "location.href='"+detailUrl+"'";
    var fl = postFlag(p);
    var titleTxt = fl ? fl.title : String(p.title||'');
    var flagHtml = fl ? '<img class="fpflag" src="img/flags/'+fl.code+'.png" alt="" onerror="this.style.display=\'none\'"/>' : '';
    return '<div class="fpost" onclick="'+onclickFn+'">'
      + '<div class="fpleft">'
        + '<div class="fpmain">'
          + '<div class="fptitle"><span class="fptag '+tagClass+'">'+(window._esc?window._esc(p.tagTxt):String(p.tagTxt||''))+'</span>'+dotHtml+flagHtml+(window._esc?window._esc(titleTxt):titleTxt)+'</div>'
          + (p.body ? '<div class="fpbody">'+p.body+'</div>' : '')
          + '<div class="fpbottom">'
            + '<span class="meta'+(p.id&&likedSet.has(p.id)?' liked':'')+'">'+heartSvg+(p.likes||0)+'</span>'
            + '<span class="meta">'+commentSvg+(p.cmts||0)+'</span>'
            + '<span class="fphead fpwho"><span class="fpav" data-uid="'+(p.uid||'')+'">'+DEFAULT_AV+'</span><span class="fpu">'+p.user+'</span><span class="fpd">·</span><span class="fpd">'+p.time+'</span></span>'
          + '</div>'
        + '</div>'
      + '</div>'
      + thumbHtml
    + '</div>';
  }).join('');
  if(typeof applyMyAvatar==='function') applyMyAvatar();
}
window.renderPosts = renderPosts;

// 기본 아바타(시안: 연한 살구 동그라미 + 빨간 선 아이콘)
var DEFAULT_AV = '<svg viewBox="0 0 24 24" fill="none" stroke="#F0574A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17s5.5-4.6 5.5-9A5.5 5.5 0 006.5 8c0 4.4 5.5 9 5.5 9z"/><circle cx="12" cy="8" r="2"/><path d="M7.5 18.5c-1.6.4-2.5 1-2.5 1.7 0 1.3 3.1 2.3 7 2.3s7-1 7-2.3c0-.7-.9-1.3-2.5-1.7"/></svg>';

// 국기: 글의 도시/나라 → 나라 → img/flags/xx.png. 도시→나라 자료는 글쓰기 화면(heka_write.html)·도시 화면의 COUNTRIES 를 그대로 읽어 쓴다
var _cityFlag = {}, _countryFlag = {};
function _emojiCode(e){ var cps=Array.from(e||''); if(cps.length<2) return ''; var a=cps[0].codePointAt(0), b=cps[1].codePointAt(0); if(a<0x1F1E6||a>0x1F1FF||b<0x1F1E6||b>0x1F1FF) return ''; return String.fromCharCode(a-0x1F1E6+97)+String.fromCharCode(b-0x1F1E6+97); }
var _FLAG_RE = /^\s*([\u{1F1E6}-\u{1F1FF}]{2})\s*/u;
function postFlag(p){
  var city = String(p.city||'').trim(), code = '';
  if(city){
    var cn = city.replace(/\s*전체$/,'');
    code = _countryFlag[cn] || _cityFlag[city] || _cityFlag[cn] || '';
  }
  var t = String(p.title||''), m = t.match(_FLAG_RE);
  if(!code && m) code = _emojiCode(m[1]);
  if(!code) return null;
  return { code: code, title: m ? t.slice(m[0].length) : t };
}
(function loadFlags(){
  var re = /\{flag:'([^']+)',\s*name:'([^']+)',\s*cities:\[([^\]]*)\]/g;
  Promise.all(['heka_write.html','heka_city.html'].map(function(u){ return fetch(u).then(function(r){ return r.ok?r.text():''; }).catch(function(){ return ''; }); }))
    .then(function(txts){
      txts.forEach(function(txt){
        var m; re.lastIndex=0;
        while((m=re.exec(txt))){
          var code=_emojiCode(m[1]); if(!code) continue;
          if(!_countryFlag[m[2]]) _countryFlag[m[2]]=code;
          (m[3].match(/'([^']+)'/g)||[]).forEach(function(c){ c=c.slice(1,-1); if(!_cityFlag[c]) _cityFlag[c]=code; });
        }
      });
      if(window.posts && window.posts.length){ if(document.getElementById('search-result-bar').classList.contains('show')) doSearch(); else applyCityFilter(); }
    });
})();

function getSavedPosts(){ try{ return JSON.parse(localStorage.getItem('haeka_saved_posts')||'[]'); }catch(e){ return []; } }
function isSaved(id){ return getSavedPosts().some(function(p){ return p.id===id; }); }
function toggleSave(id, btn) {
  var uid = localStorage.getItem('haeka_uid');
  if (!uid) { alert('로그인 후 저장할 수 있어요'); return; }
  var list = getSavedPosts();
  var idx = list.findIndex(function(p){ return p.id===id; });
  if (idx > -1) {
    list.splice(idx, 1);
    btn.classList.remove('on');
    btn.style.opacity = '0.4';
  } else {
    var post = (window.posts||[]).find(function(p){ return p.id===id; });
    if (post) list.unshift(post);
    btn.classList.add('on');
    btn.style.opacity = '1';
  }
  try{ localStorage.setItem('haeka_saved_posts', JSON.stringify(list)); }catch(e){}
}

function openAvatarDB(cb){var req=indexedDB.open('haeka_db',1);req.onupgradeneeded=function(e){e.target.result.createObjectStore('avatar');};req.onsuccess=function(e){cb(e.target.result);};req.onerror=function(){cb(null);};}
function applyMyAvatar(){
  openAvatarDB(function(db){
    if(!db){setDefaultAv();return;}
    var tx=db.transaction('avatar','readonly');
    var r=tx.objectStore('avatar').get('profile');
    r.onsuccess=function(e){
      var src=e.target.result;
      // 내 사진은 내가 쓴 글에만 (예전엔 모든 글에 내 사진이 붙었다)
      var me=''; try{ me=localStorage.getItem('haeka_uid')||''; }catch(e){}
      document.querySelectorAll('.fpav').forEach(function(el){
        if(src && me && el.getAttribute('data-uid')===me) el.innerHTML='<img src="'+src+'" style="width:100%;height:100%;object-fit:cover"/>';
        else el.innerHTML=DEFAULT_AV;
      });
    };
    r.onerror=function(){setDefaultAv();};
  });
}
function setDefaultAv(){document.querySelectorAll('.fpav').forEach(function(el){el.innerHTML=DEFAULT_AV;});}

function doSearch(){
  var kw=document.getElementById('search-input').value.trim();
  var bar=document.getElementById('search-result-bar');
  if(kw){
    document.getElementById('search-keyword').textContent=kw;
    bar.classList.add('show');
    var lower=kw.toLowerCase();
    renderPosts(posts.filter(function(p){ return p.title.toLowerCase().indexOf(lower)>-1||p.body.toLowerCase().indexOf(lower)>-1||p.city.toLowerCase().indexOf(lower)>-1; }));
  } else { bar.classList.remove('show'); renderPosts(posts); }
  document.getElementById('search-input').blur();
}

var _selectedTags = new Set();

function toggleF(el){
  var tag = el.textContent.trim();
  if(tag === '전체'){
    _selectedTags.clear();
    document.querySelectorAll('.fb').forEach(function(b){ b.classList.remove('on'); });
    el.classList.add('on');
  } else {
    document.querySelector('.fb').classList.remove('on'); // 전체 버튼 off
    if(el.classList.contains('on')){
      el.classList.remove('on');
      _selectedTags.delete(tag);
      if(_selectedTags.size === 0){
        document.querySelector('.fb').classList.add('on'); // 다 해제되면 전체로
      }
    } else {
      el.classList.add('on');
      _selectedTags.add(tag);
    }
  }
  filterByTag();
}

function filterByTag(){
  // 태그 변경 시에도 현재 도시 필터를 함께 적용
  applyCityFilter();
}

var countries=[{flag:'🌍',name:'전 세계'},{flag:'🇯🇵',name:'일본'},{flag:'🇫🇷',name:'프랑스'},{flag:'🇺🇸',name:'미국'},{flag:'🇹🇭',name:'태국'},{flag:'🇻🇳',name:'베트남'},{flag:'🇪🇸',name:'스페인'},{flag:'🇮🇹',name:'이탈리아'},{flag:'🇩🇪',name:'독일'},{flag:'🇭🇷',name:'크로아티아'}];
var cities={'일본':[{name:'도쿄'},{name:'오사카'},{name:'교토'},{name:'삿포로'},{name:'후쿠오카'}],'프랑스':[{name:'파리'},{name:'리옹'},{name:'니스'}],'미국':[{name:'뉴욕'},{name:'로스앤젤레스'},{name:'라스베가스'}],'태국':[{name:'방콕'},{name:'치앙마이'},{name:'푸켓'}],'베트남':[{name:'하노이'},{name:'호치민'},{name:'다낭'}],'스페인':[{name:'바르셀로나'},{name:'마드리드'},{name:'세비야'}],'이탈리아':[{name:'로마'},{name:'밀라노'},{name:'베네치아'}],'독일':[{name:'베를린'},{name:'뮌헨'},{name:'함부르크'}],'크로아티아':[{name:'자그레브'},{name:'두브로브니크'},{name:'스플리트'}]};

function openPanel(){ renderCountries(); document.getElementById('side-overlay').classList.add('open'); document.getElementById('side-panel').classList.add('open'); }
function closePanel(){ document.getElementById('side-overlay').classList.remove('open'); document.getElementById('side-panel').classList.remove('open'); }
function renderCountries(){
  document.getElementById('panel-title').textContent='나라 선택';
  document.getElementById('panel-ph').textContent='나라를 검색해보세요';
  var list=document.getElementById('panel-list'); list.innerHTML='';
  countries.forEach(function(c){ var div=document.createElement('div'); div.className='panel-item'; div.innerHTML='<div>'+c.name+'</div><span class="panel-arr">›</span>'; div.onclick=function(){ if(c.name==='전 세계') select('전 세계',''); else if(cities[c.name]) renderCities(c.name,''); else select(c.name,''); }; list.appendChild(div); });
}
function renderCities(country,flag){
  document.getElementById('panel-title').textContent=country;
  document.getElementById('panel-ph').textContent='도시를 검색해보세요';
  var list=document.getElementById('panel-list'); list.innerHTML='';
  var back=document.createElement('div'); back.className='panel-back'; back.innerHTML='‹ 나라 선택으로'; back.onclick=renderCountries; list.appendChild(back);
  // 나라 전체보기 버튼
  var allDiv=document.createElement('div'); allDiv.className='panel-item'; allDiv.style.cssText='background:#FFF1F3;font-weight:700;color:#FF3900';
  allDiv.innerHTML='<div>'+country+' 전체보기</div><span class="panel-arr" style="color:#FF3900">›</span>';
  allDiv.onclick=function(){ select(country+' 전체',''); }; list.appendChild(allDiv);
  (cities[country]||[]).forEach(function(c){ var div=document.createElement('div'); div.className='panel-item'; div.innerHTML='<div>'+c.name+'</div><span class="panel-arr">›</span>'; div.onclick=function(){ select(c.name,''); }; list.appendChild(div); });
}
var _selectedCity = null; // null = 전 세계 (전체)
function select(name,flag){
  document.getElementById('city-chip-txt').textContent=name;
  // 도시 필터 갱신
  if(name === '전 세계') {
    _selectedCity = null;
  } else if(name.endsWith(' 전체')) {
    // "{나라이름} 전체" → 해당 나라 전체 도시
    var countryName = name.slice(0, -' 전체'.length);
    var cityList = (cities[countryName] || []).map(function(c){ return c.name; });
    _selectedCity = { country: countryName, cityNames: cityList };
  } else {
    // 단일 도시
    _selectedCity = { city: name };
  }
  applyCityFilter();
  closePanel();
}

function applyCityFilter(){
  var base = window.posts || [];
  var filtered;
  if(!_selectedCity){
    filtered = base;
  } else if(_selectedCity.city){
    // 그 도시 글 + 그 도시가 속한 나라의 '나라 전체' 글
    var ctry = Object.keys(cities).find(function(k){ return (cities[k]||[]).some(function(c){ return c.name===_selectedCity.city; }); });
    filtered = base.filter(function(p){ var pc=p.city||''; return pc === _selectedCity.city || (ctry && pc === ctry+' 전체'); });
  } else if(_selectedCity.cityNames){
    var set = _selectedCity.cityNames;
    var whole = _selectedCity.country + ' 전체';
    filtered = base.filter(function(p){ var pc=p.city||''; return set.indexOf(pc) > -1 || pc === whole; });
  } else {
    filtered = base;
  }
  // 태그 필터도 같이 적용
  if(typeof _selectedTags !== 'undefined' && _selectedTags.size > 0){
    filtered = filtered.filter(function(p){ return _selectedTags.has(p.tagTxt); });
  }
  renderPosts(filtered);
}
