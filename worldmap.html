<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>해카 세계지도</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;color:#1A1A1A;background:#CFE3F1}
#map{position:absolute;inset:0;background:#CFE3F1}
.panel{position:absolute;z-index:1000;top:12px;left:12px;width:250px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(17,24,39,.16);overflow:hidden}
.panel-head{padding:14px 16px 12px;border-bottom:1px solid #F0EFEA}
.panel-title{font-size:15px;font-weight:800;letter-spacing:-.02em}
.panel-title b{color:#FF3900}
.panel-sum{margin-top:6px;font-size:12px;color:#6B7280;line-height:1.6}
.panel-sum strong{color:#1A1A1A;font-variant-numeric:tabular-nums}
.list{overflow-y:auto;padding:6px 8px 10px}
.list-h{font-size:11px;font-weight:800;color:#9CA3AF;padding:10px 8px 4px;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.list-h button{border:0;background:none;color:#DC2626;font-size:11px;font-weight:700;cursor:pointer;padding:0}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.row:hover{background:#F7F6F3}
.row .nm{flex:1;font-weight:700}
.row .ct{font-size:11.5px;color:#9CA3AF}
.nat-row{font-size:14px;padding:8px 8px}.nat-row .nm{font-weight:800}.nat-row .arr{width:12px;color:#9CA3AF;font-size:11px;flex-shrink:0}.nat-row .ct{background:#F3F4F6;color:#4B5563;border-radius:10px;padding:1px 8px;font-weight:700}.sub-row{padding-left:28px}
.sq{width:12px;height:12px;border-radius:3px;background:#FACC15;box-shadow:0 0 0 1px rgba(0,0,0,.18);flex-shrink:0}
.empty{font-size:12px;color:#9CA3AF;padding:6px 8px}
.toggle{display:none;position:absolute;z-index:1001;top:8px;left:8px;border:0;background:#fff;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 6px 20px rgba(17,24,39,.16);cursor:pointer}
.hint{font-size:11px;color:#9CA3AF;padding:8px 16px 12px;border-top:1px solid #F0EFEA;line-height:1.5}
/* 지도 위에 늘 보이는 이름 */
.lbl{pointer-events:none;white-space:nowrap;display:inline-block;transform:translate(-50%,-50%);font-weight:700;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.lbl.nat{color:#111827;font-weight:800;letter-spacing:.04em}
.lbl.nat.t1{font-size:16px}.lbl.nat.t2{font-size:14px}.lbl.nat.t3{font-size:12.5px}.lbl.nat.t4{font-size:11.5px}.lbl.nat.t5{font-size:11px}
.lbl.reg{font-size:11px;color:#4B5563}
.lbl.reg.on{color:#111;font-weight:800}
@media (max-width:640px){
  .panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:44%}
  .panel.closed{display:none}
  .toggle{display:block}
}
</style>
</head>
<body>
<div id="map"></div>
<button class="toggle" id="toggle" onclick="document.getElementById('panel').classList.toggle('closed')">목록</button>
<div class="panel" id="panel">
  <div class="panel-head">
    <div class="panel-title"><b>해카</b> 세계지도</div>
    <div class="panel-sum" id="sum">불러오는 중...</div>
  </div>
  <div class="list" id="list"></div>

</div>

function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function load(key, def){ try{ var v=JSON.parse(localStorage.getItem(key)||'null'); return v==null?def:v; }catch(e){ return def; } }
function save(key, v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }

var SHIFT_AT = -25;
var map = L.map('map', {
  preferCanvas:true, zoomControl:false, minZoom:2, maxZoom:10, zoomSnap:.5, worldCopyJump:false,

}).setView([28, 128], 4);
L.control.zoom({ position:'bottomright' }).addTo(map);
map.attributionControl.setPrefix(false).addAttribution('Natural Earth');
map.createPane('nat');   map.getPane('nat').style.zIndex = 420;  map.getPane('nat').style.pointerEvents = 'none';
map.createPane('names'); map.getPane('names').style.zIndex = 470; map.getPane('names').style.pointerEvents = 'none';
var natRenderer = L.canvas({ pane:'nat' });
var labelLayer = L.layerGroup().addTo(map);
// 파리·런던처럼 조각이 작아서 멀리서는 안 보이는 곳은, 칠해졌다는 걸 알 수 있게 노란 점을 같이 찍는다
map.createPane('marks'); map.getPane('marks').style.zIndex = 440; map.getPane('marks').style.pointerEvents = 'none';
var markRenderer = L.svg({ pane:'marks' });
var markLayer = L.layerGroup().addTo(map);
function showMarks(){
  markLayer.clearLayers();
  return;   // 동그라미 표시는 끈다(정신없다는 요청). 조각 색칠만 남긴다
  var pxPerDeg = 256 * Math.pow(2, map.getZoom()) / 360;
  Object.keys(pieces).forEach(function(k){
    if(!isOn(k)) return;
    var p = pieces[k];
    if(Math.sqrt(p.area) * pxPerDeg >= 26) return;   // 화면에서 충분히 크게 보이면 점은 필요 없다
    markLayer.addLayer(L.circleMarker(p.center, { renderer:markRenderer, interactive:false, radius:7, weight:1.5, color:'#8A6D00', fillColor:YELLOW, fillOpacity:1 }));
  });
}

function ringInfo(ring){
  var a=0, sx=0, sy=0, n=ring.length;
  for(var i=0;i<n-1;i++){ a += ring[i][0]*ring[i+1][1] - ring[i+1][0]*ring[i][1]; sx += ring[i][0]; sy += ring[i][1]; }
  return { area: Math.abs(a/2), cx: sx/Math.max(1,n-1), cy: sy/Math.max(1,n-1) };
}
// GeoJSON 도형을 태평양 중심 좌표로 옮기고, 넓이와 가장 큰 덩어리의 중심을 구한다
function prep(geom){
  var polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
  var area = 0, best = null;
  polys = polys.map(function(poly){
    var mean = poly[0].reduce(function(s,p){ return s+p[0]; }, 0) / poly[0].length;
    var shifted = mean < SHIFT_AT ? poly.map(function(r){ return r.map(function(p){ return [p[0]+360, p[1]]; }); }) : poly;
    var info = ringInfo(shifted[0]); area += info.area;
    if(!best || info.area > best.area) best = info;
    return shifted;
  });
  return { polys:polys, area:area, best:best };
}
var auto = {};   // 해카에 매장이 등록된 도시가 들어 있는 조각: { 조각 키: [도시 이름] } — 자동으로 노란색
function isOn(key){ return !!(paint[key] || auto[key]); }
function styleOf(key){ return { color: LINE, weight: .7, fillColor: isOn(key) ? YELLOW : LAND, fillOpacity: 1 }; }
function clickPiece(key){
  if(auto[key]) return;   // 해카 등록 지역은 자동으로 칠해지고 지워지지 않는다
  if(paint[key]) delete paint[key]; else paint[key] = 1;
  save('haeka_worldmap_pieces', paint);
  var p = pieces[key];
  p.layers.forEach(function(l){ l.setStyle(styleOf(key)); });
  showLabels(true);
  renderList();
}

// 같은 땅을 서쪽으로 360도 옮긴 사본을 붙인다 → 왼쪽으로 끌어도 지도가 이어진다
function withCopy(polys){
  return polys.concat(polys.map(function(poly){ return poly.map(function(r){ return r.map(function(p){ return [p[0]-360, p[1]]; }); }); }));
}
function drawPieces(topo){
  var fc = topojson.feature(topo, topo.objects.r);
  // 나라별 넓이·조각 수: 조각이 지나치게 잘게 나뉜 작은 나라(몰타·싱가포르·홍콩 등)는 나라 전체를 한 조각으로 묶는다
  var nat = {};
  var prepped = fc.features.map(function(f){
    var q = prep(f.geometry), a = f.properties.a;
    (nat[a] = nat[a] || { area:0, n:0 }); nat[a].area += q.area; nat[a].n++;
    return q;
  });
  fc.features.forEach(function(f, i){
    var p = f.properties, q = prepped[i], N = nat[p.a];
    var whole = N.n > 1 && (N.area / N.n) < 0.1;        // 나라 전체를 한 조각으로
    var key = whole ? p.a : (p.g ? p.a + '|' + p.g : p.k);
    var name = whole ? (KO[p.a] || p.a) : (p.g || p.n || p.a);
    var piece = pieces[key];
    if(!piece) piece = pieces[key] = { key:key, name:name, nat:(KO[p.a] || p.a), layers:[], area:0, best:null, whole:whole || N.n === 1 };
    piece.area += q.area;
    if(!piece.best || q.best.area > piece.best.area) piece.best = q.best;
    var layer = L.geoJSON({ type:'Feature', properties:{}, geometry:{ type:'MultiPolygon', coordinates:withCopy(q.polys) } }, { style: styleOf(key) });
    layer.on('click', function(e){ L.DomEvent.stopPropagation(e); clickPiece(key); });
    layer.addTo(map);
    piece.layers.push(layer);
    piece.polys = (piece.polys || []).concat(q.polys);
  });
  Object.keys(pieces).forEach(function(key){
    var p = pieces[key];
    p.center = [p.best.cy, p.best.cx];
    // 큰 조각은 일찍, 작은 조각은 확대해야 이름이 나온다. 나라 전체가 한 조각이면 나라 이름이 이미 있으니 조각 이름은 뺀다
    if(p.whole) return;
    var z = p.area > 40 ? 3.5 : p.area > 10 ? 4.5 : p.area > 2.5 ? 5 : p.area > .6 ? 6 : p.area > .12 ? 7 : 8;
    [0, -360].forEach(function(dx){
      var c = [p.center[0], p.center[1] + dx];
      var lb = { z:z, key:key, c:c, on:false, painted:null,
        m: null, make:function(painted){ return L.marker(c, { pane:'names', interactive:false, keyboard:false,
          icon: L.divIcon({ className:'', iconSize:[0,0], html:'<span class="lbl reg'+(painted?' on':'')+'">'+esc(p.name)+'</span>' }) }); } };
      if(!dx) p.label = lb;
      labels.push(lb);
    });
  });
}

// 나라 경계선(굵게)과 나라 이름
function drawNations(world, extra){
  var fc = topojson.feature(world, world.objects.countries);
  fc.features.concat((extra && extra.features) || []).forEach(function(f){
    var name = f.properties && f.properties.name; if(!name || !f.geometry) return;
    var q = prep(f.geometry);
    L.geoJSON({ type:'Feature', properties:{}, geometry:{ type:'MultiPolygon', coordinates:withCopy(q.polys) } },
      { renderer:natRenderer, interactive:false, style:{ color:NATLINE, weight:1.2, fill:false } }).addTo(map);
    var tier = q.area > 250 ? 1 : q.area > 60 ? 2 : q.area > 15 ? 3 : q.area > 3 ? 4 : 5;
    [0, -360].forEach(function(dx){
      labels.push({ z:[2, 3, 3.5, 4.5, 5.5][tier-1], zMax: tier <= 2 ? 5 : 99, on:false, nat:true,
        m: L.marker([q.best.cy, q.best.cx + dx], { pane:'names', interactive:false, keyboard:false,
          icon: L.divIcon({ className:'', iconSize:[0,0], html:'<span class="lbl nat t'+tier+'">'+esc(KO[name]||name)+'</span>' }) }) });
    });
  });
}

function showLabels(force){
  showMarks();
  var z = map.getZoom(), b = map.getBounds().pad(.2);
  labels.forEach(function(l){
    var painted = !l.nat && isOn(l.key);
    // 칠한 조각 이름은 조금 일찍부터 보인다
    var want = z >= (painted ? Math.min(l.z, 4.5) : l.z) && z <= (l.zMax || 99);
    if(!l.nat){
      if(want && !b.contains(l.c)) want = false;
      if(l.on && (!want || l.painted !== painted)){ labelLayer.removeLayer(l.m); l.on = false; }
      if(want && !l.on){ l.m = l.make(painted); l.painted = painted; labelLayer.addLayer(l.m); l.on = true; }
    } else {
      if(want && !l.on){ labelLayer.addLayer(l.m); l.on = true; }
      else if(!want && l.on){ labelLayer.removeLayer(l.m); l.on = false; }
    }
  });
}
map.on('moveend zoomend', function(){ showLabels(); });

var openNat = {};   // 펼쳐 둔 나라
function jsq(v){ return esc(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function renderList(){
  var keys = Object.keys(pieces).filter(isOn);
  var byNat = {};
  keys.forEach(function(k){ var n = pieces[k].nat; (byNat[n] = byNat[n] || []).push(k); });
  var nats = Object.keys(byNat).sort(function(x, y){ return byNat[y].length - byNat[x].length || x.localeCompare(y, 'ko'); });
  var manual = Object.keys(paint).filter(function(k){ return pieces[k] && !auto[k]; }).length;
  document.getElementById('sum').innerHTML = '칠한 나라 <strong>'+nats.length+'</strong>곳 · 지역 <strong>'+keys.length+'</strong>곳';
  var html = '';
  if(!nats.length) html += '<div class="empty">아직 칠한 곳이 없어요</div>';
  nats.forEach(function(n){
    var open = !!openNat[n];
    html += '<div class="row nat-row" onclick="toggleNat(\''+jsq(n)+'\')"><span class="arr">'+(open?'▾':'▸')+'</span><span class="nm">'+esc(n)+'</span><span class="ct">'+byNat[n].length+'</span></div>';
    if(!open) return;
    byNat[n].map(function(k){
      var p = pieces[k], cs = auto[k] || [];
      // 해카 도시 이름을 앞에, 조각 이름이 다르면 옆에 작게
      var main = cs.length ? cs.join(', ') : p.name;
      var sub = (cs.length && cs.indexOf(p.name) < 0) ? p.name : '';
      return { k:k, main:main, sub:sub, mine:!auto[k] };
    }).sort(function(x, y){ return x.main.localeCompare(y.main, 'ko'); }).forEach(function(r){
      html += '<div class="row sub-row" onclick="focusPiece(\''+jsq(r.k)+'\')"><i class="sq"></i><span class="nm">'+esc(r.main)+'</span>'
        + (r.sub ? '<span class="ct">'+esc(r.sub)+'</span>' : '') + (r.mine ? '<span class="ct">직접</span>' : '') + '</div>';
    });
  });
  if(manual) html += '<div class="list-h"><span>직접 칠한 곳 '+manual+'곳</span><button onclick="clearAll()">모두 지우기</button></div>';
  document.getElementById('list').innerHTML = html;
}
window.toggleNat = function(n){ openNat[n] = !openNat[n]; renderList(); };
window.clearAll = function(){
  if(!confirm('칠한 곳을 모두 지울까요?')) return;
  var keys = Object.keys(paint); paint = {}; save('haeka_worldmap_pieces', paint);
  keys.forEach(function(k){ if(pieces[k]) pieces[k].layers.forEach(function(l){ l.setStyle(styleOf(k)); }); });
  showLabels(true); renderList();
};
window.focusPiece = function(key){
  var p = pieces[key]; if(!p) return;
  map.flyTo(p.center, Math.max(map.getZoom(), p.area > 10 ? 5 : p.area > 1 ? 6 : 7.5), { duration:.6 });
};

// ── 해카 등록 도시가 들어 있는 조각을 찾아 자동으로 칠한다 ──
function inRing(x, y, ring){
  var inside = false;
  for(var i=0, j=ring.length-1; i<ring.length; j=i++){
    var xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if(((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
function pieceAt(lat, lng, name){
  var x = lng < SHIFT_AT ? lng + 360 : lng, best = null, bd = 1e9;
  // 도시와 이름이 같은 조각이 바로 근처에 있으면 그 조각을 쓴다(타이베이·프라하처럼 작은 조각은 옆 조각으로 잘못 잡히기 쉽다)
  if(name){
    var nb = null, nd = 1e9;
    for(var k0 in pieces){
      var p0 = pieces[k0]; if(p0.name !== name) continue;
      p0.polys.forEach(function(poly){ poly[0].forEach(function(pt){ var d = Math.abs(pt[0]-x) + Math.abs(pt[1]-lat); if(d < nd){ nd = d; nb = k0; } }); });
    }
    if(nb && nd < .6) return nb;
  }
  for(var k in pieces){
    var p = pieces[k];
    for(var i=0;i<p.polys.length;i++){
      if(inRing(x, lat, p.polys[i][0])) return k;
      // 해안 도시는 단순화된 경계 밖에 찍힐 수 있어서, 가장 가까운 조각도 기억해 둔다
      var r = p.polys[i][0];
      for(var j=0;j<r.length;j+=3){ var d = Math.abs(r[j][0]-x) + Math.abs(r[j][1]-lat); if(d < bd){ bd = d; best = k; } }
    }
  }
  return bd < .4 ? best : null;
}
function paintRegistered(list){
  list.forEach(function(c){
    var k = pieceAt(c.lat, c.lng, c.name); if(!k) return;
    (auto[k] = auto[k] || []).push(c.name);
  });
  Object.keys(auto).forEach(function(k){ pieces[k].layers.forEach(function(l){ l.setStyle(styleOf(k)); }); });
  showLabels(true); renderList();
}

renderList();
Promise.all([
  fetch('data/world-regions.json').then(function(r){ return r.json(); }),
  fetch('data/world-50m.json').then(function(r){ return r.json(); }),
  fetch('data/world-extra.json').then(function(r){ return r.json(); }).catch(function(){ return null; })
]).then(function(r){
  drawPieces(r[0]);
  drawNations(r[1], r[2]);
  showLabels(true);
  renderList();
  return fetch('data/cities.json?t=' + Date.now()).then(function(x){ return x.json(); }).then(paintRegistered);
}).catch(function(e){ console.error(e); document.getElementById('sum').textContent = '지도를 불러오지 못했어요'; });
</script>
</body>
</html>
