<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>해카 세계지도</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;color:#1A1A1A;background:#DCE9F2}
#map{position:absolute;inset:0;background:#DCE9F2}
.panel{position:absolute;z-index:1000;top:12px;left:12px;width:264px;max-height:calc(100% - 24px);display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(17,24,39,.16);overflow:hidden}
.panel-head{padding:14px 16px 12px;border-bottom:1px solid #F0EFEA}
.panel-title{font-size:15px;font-weight:800;letter-spacing:-.02em}
.panel-title b{color:#FF3900}
.panel-sum{margin-top:6px;font-size:12px;color:#6B7280;line-height:1.6}
.panel-sum strong{color:#1A1A1A;font-variant-numeric:tabular-nums}
.tools{padding:12px 16px;border-bottom:1px solid #F0EFEA}
.tools-h{font-size:11px;font-weight:800;color:#9CA3AF;margin-bottom:8px;letter-spacing:.04em}
.sw{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 3px #1A1A1A}
.sw .erase{width:auto;border-radius:14px;padding:0 11px;font-size:11px;font-weight:800;background:#F3F4F6;color:#4B5563;border:0;box-shadow:none}
.sw .erase.on{box-shadow:0 0 0 2px #1A1A1A}
.list{overflow-y:auto;padding:6px 8px 10px}
.list-h{font-size:11px;font-weight:800;color:#9CA3AF;padding:10px 8px 4px;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.list-h button{border:0;background:none;color:#DC2626;font-size:11px;font-weight:700;cursor:pointer;padding:0}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.row:hover{background:#F7F6F3}
.row .nm{flex:1;font-weight:700}
.row .ct{font-size:12px;color:#6B7280;font-variant-numeric:tabular-nums}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);display:inline-block;flex-shrink:0}
.empty{font-size:12px;color:#9CA3AF;padding:6px 8px}
.toggle{display:none;position:absolute;z-index:1001;top:8px;left:8px;border:0;background:#fff;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:800;box-shadow:0 6px 20px rgba(17,24,39,.16);cursor:pointer}
.hint{font-size:11px;color:#9CA3AF;padding:8px 16px 12px;border-top:1px solid #F0EFEA;line-height:1.5}
.leaflet-tooltip{font-family:inherit;font-size:12px;font-weight:700}
@media (max-width:640px){
  .panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:48%}
  .panel.closed{display:none}
  .toggle{display:block}
}
</style>
</head>
<body>
<div id="map"></div>
<button class="toggle" id="toggle" onclick="document.getElementById('panel').classList.toggle('closed')">목록</button>
<div class="panel" id="panel">
  <div class="panel-head">
    <div class="panel-title"><b>해카</b> 세계지도</div>
    <div class="panel-sum" id="sum">불러오는 중...</div>
  </div>
  <div class="tools">
    <div class="tools-h">칠할 색</div>
    <div class="sw" id="palette"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="hint">색을 고르고 나라를 누르면 칠해져요. 같은 색으로 한 번 더 누르면 지워져요. 작은 섬나라는 동그란 점을 누르세요. 칠한 내용은 이 브라우저에만 저장돼요.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
// 세계 모든 나라·섬을 그리고, 누르면 고른 색으로 칠한다(이 브라우저에만 저장).
// 해카에 매장이 등록된 도시는 서버에서 받아 검은 점으로 같이 보여준다.
var PROJECT = 'card-store-finder';
var LAND = '#F4F2EC', LINE = '#B9B4A7';
var PALETTE = [
  { c:'#FF3900', n:'주황' }, { c:'#2563EB', n:'파랑' }, { c:'#16A34A', n:'초록' },
  { c:'#F59E0B', n:'노랑' }, { c:'#9333EA', n:'보라' }, { c:'#DC2626', n:'빨강' }
];
// 지도 자료의 영문 이름 → 한글 이름
var KO = {"Afghanistan":"아프가니스탄","Albania":"알바니아","Algeria":"알제리","American Samoa":"아메리칸사모아","Andorra":"안도라","Angola":"앙골라","Anguilla":"앵귈라","Antarctica":"남극","Antigua and Barb.":"앤티가 바부다","Argentina":"아르헨티나","Armenia":"아르메니아","Aruba":"아루바","Ashmore and Cartier Is.":"애슈모어 카르티에 제도","Australia":"호주","Austria":"오스트리아","Azerbaijan":"아제르바이잔","Bahamas":"바하마","Bahrain":"바레인","Bangladesh":"방글라데시","Barbados":"바베이도스","Belarus":"벨라루스","Belgium":"벨기에","Belize":"벨리즈","Benin":"베냉","Bermuda":"버뮤다","Bhutan":"부탄","Bolivia":"볼리비아","Bosnia and Herz.":"보스니아 헤르체고비나","Botswana":"보츠와나","Br. Indian Ocean Ter.":"영국령 인도양 지역","Brazil":"브라질","British Virgin Is.":"영국령 버진아일랜드","Brunei":"브루나이","Bulgaria":"불가리아","Burkina Faso":"부르키나파소","Burundi":"부룬디","Cabo Verde":"카보베르데","Cambodia":"캄보디아","Cameroon":"카메룬","Canada":"캐나다","Cayman Is.":"케이맨 제도","Central African Rep.":"중앙아프리카공화국","Chad":"차드","Chile":"칠레","China":"중국","Colombia":"콜롬비아","Comoros":"코모로","Congo":"콩고","Cook Is.":"쿡 제도","Costa Rica":"코스타리카","Croatia":"크로아티아","Cuba":"쿠바","Curaçao":"퀴라소","Cyprus":"키프로스","Czechia":"체코","Côte d'Ivoire":"코트디부아르","Dem. Rep. Congo":"콩고민주공화국","Denmark":"덴마크","Djibouti":"지부티","Dominica":"도미니카 연방","Dominican Rep.":"도미니카공화국","Ecuador":"에콰도르","Egypt":"이집트","El Salvador":"엘살바도르","Eq. Guinea":"적도기니","Eritrea":"에리트레아","Estonia":"에스토니아","Ethiopia":"에티오피아","Faeroe Is.":"페로 제도","Falkland Is.":"포클랜드 제도","Fiji":"피지","Finland":"핀란드","Fr. Polynesia":"프랑스령 폴리네시아","Fr. S. Antarctic Lands":"프랑스령 남방 지역","France":"프랑스","Gabon":"가봉","Gambia":"감비아","Georgia":"조지아","Germany":"독일","Ghana":"가나","Greece":"그리스","Greenland":"그린란드","Grenada":"그레나다","Guam":"괌","Guatemala":"과테말라","Guernsey":"건지섬","Guinea":"기니","Guinea-Bissau":"기니비사우","Guyana":"가이아나","Haiti":"아이티","Heard I. and McDonald Is.":"허드 맥도널드 제도","Honduras":"온두라스","Hong Kong":"홍콩","Hungary":"헝가리","Iceland":"아이슬란드","India":"인도","Indian Ocean Ter.":"호주령 인도양 지역","Indonesia":"인도네시아","Iran":"이란","Iraq":"이라크","Ireland":"아일랜드","Isle of Man":"맨섬","Israel":"이스라엘","Italy":"이탈리아","Jamaica":"자메이카","Japan":"일본","Jersey":"저지섬","Jordan":"요르단","Kazakhstan":"카자흐스탄","Kenya":"케냐","Kiribati":"키리바시","Kosovo":"코소보","Kuwait":"쿠웨이트","Kyrgyzstan":"키르기스스탄","Laos":"라오스","Latvia":"라트비아","Lebanon":"레바논","Lesotho":"레소토","Liberia":"라이베리아","Libya":"리비아","Liechtenstein":"리히텐슈타인","Lithuania":"리투아니아","Luxembourg":"룩셈부르크","Macao":"마카오","Macedonia":"북마케도니아","Madagascar":"마다가스카르","Malawi":"말라위","Malaysia":"말레이시아","Maldives":"몰디브","Mali":"말리","Malta":"몰타","Marshall Is.":"마셜 제도","Mauritania":"모리타니","Mauritius":"모리셔스","Mexico":"멕시코","Micronesia":"미크로네시아","Moldova":"몰도바","Monaco":"모나코","Mongolia":"몽골","Montenegro":"몬테네그로","Montserrat":"몬트세랫","Morocco":"모로코","Mozambique":"모잠비크","Myanmar":"미얀마","N. Cyprus":"북키프로스","N. Mariana Is.":"북마리아나 제도(사이판)","Namibia":"나미비아","Nauru":"나우루","Nepal":"네팔","Netherlands":"네덜란드","New Caledonia":"누벨칼레도니","New Zealand":"뉴질랜드","Nicaragua":"니카라과","Niger":"니제르","Nigeria":"나이지리아","Niue":"니우에","Norfolk Island":"노퍽섬","North Korea":"북한","Norway":"노르웨이","Oman":"오만","Pakistan":"파키스탄","Palau":"팔라우","Palestine":"팔레스타인","Panama":"파나마","Papua New Guinea":"파푸아뉴기니","Paraguay":"파라과이","Peru":"페루","Philippines":"필리핀","Pitcairn Is.":"핏케언 제도","Poland":"폴란드","Portugal":"포르투갈","Puerto Rico":"푸에르토리코","Qatar":"카타르","Romania":"루마니아","Russia":"러시아","Rwanda":"르완다","S. Geo. and the Is.":"사우스조지아 사우스샌드위치 제도","S. Sudan":"남수단","Saint Helena":"세인트헬레나","Saint Lucia":"세인트루시아","Samoa":"사모아","San Marino":"산마리노","Saudi Arabia":"사우디아라비아","Senegal":"세네갈","Serbia":"세르비아","Seychelles":"세이셸","Siachen Glacier":"시아첸 빙하","Sierra Leone":"시에라리온","Singapore":"싱가포르","Sint Maarten":"신트마르턴","Slovakia":"슬로바키아","Slovenia":"슬로베니아","Solomon Is.":"솔로몬 제도","Somalia":"소말리아","Somaliland":"소말릴란드","South Africa":"남아프리카공화국","South Korea":"대한민국","Spain":"스페인","Sri Lanka":"스리랑카","St-Barthélemy":"생바르텔레미","St-Martin":"생마르탱","St. Kitts and Nevis":"세인트키츠 네비스","St. Pierre and Miquelon":"생피에르 미클롱","St. Vin. and Gren.":"세인트빈센트 그레나딘","Sudan":"수단","Suriname":"수리남","Sweden":"스웨덴","Switzerland":"스위스","Syria":"시리아","São Tomé and Principe":"상투메 프린시페","Taiwan":"대만","Tajikistan":"타지키스탄","Tanzania":"탄자니아","Thailand":"태국","Timor-Leste":"동티모르","Togo":"토고","Tonga":"통가","Trinidad and Tobago":"트리니다드 토바고","Tunisia":"튀니지","Turkey":"튀르키예","Turkmenistan":"투르크메니스탄","Turks and Caicos Is.":"터크스 케이커스 제도","U.S. Virgin Is.":"미국령 버진아일랜드","Uganda":"우간다","Ukraine":"우크라이나","United Arab Emirates":"아랍에미리트","United Kingdom":"영국","United States of America":"미국","Uruguay":"우루과이","Uzbekistan":"우즈베키스탄","Vanuatu":"바누아투","Vatican":"바티칸","Venezuela":"베네수엘라","Vietnam":"베트남","W. Sahara":"서사하라","Wallis and Futuna Is.":"왈리스 푸투나","Yemen":"예멘","Zambia":"잠비아","Zimbabwe":"짐바브웨","eSwatini":"에스와티니","Åland":"올란드 제도","Tuvalu":"투발루","Gibraltar":"지브롤터","Dhekelia":"데켈리아(영국 기지)","Akrotiri":"아크로티리(영국 기지)","USNB Guantanamo Bay":"관타나모 미 해군기지","Cyprus U.N. Buffer Zone":"키프로스 유엔 완충지대","Baikonur":"바이코누르","U.S. Minor Outlying Is.":"미국령 군소 제도","Coral Sea Is.":"코럴해 제도","Spratly Is.":"스프래틀리 군도","Clipperton I.":"클리퍼턴섬","Bajo Nuevo Bank":"바호누에보 뱅크","Serranilla Bank":"세라니야 뱅크","Scarborough Reef":"스카버러 암초"};

function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function load(key, def){ try{ var v=JSON.parse(localStorage.getItem(key)||'null'); return v==null?def:v; }catch(e){ return def; } }
function save(key, v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }

var paint = load('haeka_worldmap_paint', {});   // { 영문 나라 이름: 색 }
var cur = load('haeka_worldmap_cur', PALETTE[0].c);   // 지금 고른 색 ('' = 지우개)
var shapes = {};   // 영문 이름 → { layers:[...], center:[lat,lng], ko }
var cities = [];

// 태평양이 가운데 오도록 서경 쪽(아메리카)을 오른쪽으로 옮겨 그린다
var SHIFT_AT = -25;
function shiftLng(lng){ return lng < SHIFT_AT ? lng + 360 : lng; }

var map = L.map('map', {
  preferCanvas:true, zoomControl:false, minZoom:2, maxZoom:9, zoomSnap:.5, worldCopyJump:false,
  maxBounds:[[-85,-40],[88,345]], maxBoundsViscosity:.8
}).setView([22, 150], 2.5);
L.control.zoom({ position:'bottomright' }).addTo(map);
map.attributionControl.setPrefix(false).addAttribution('Natural Earth');
map.createPane('dots'); map.getPane('dots').style.zIndex = 450;
map.createPane('cities'); map.getPane('cities').style.zIndex = 460;
var dotRenderer = L.svg({ pane:'dots' }), cityRenderer = L.svg({ pane:'cities' });

function styleOf(name){
  var c = paint[name];
  return { color: LINE, weight: .7, fillColor: c || LAND, fillOpacity: 1 };
}
function repaint(name){
  var s = shapes[name]; if(!s) return;
  s.layers.forEach(function(l){
    if(l._isDot) l.setStyle({ fillColor: paint[name] || '#fff', color: paint[name] ? '#fff' : '#6B7280' });
    else l.setStyle(styleOf(name));
  });
}
function clickCountry(name){
  if(!cur || paint[name] === cur) delete paint[name];
  else paint[name] = cur;
  save('haeka_worldmap_paint', paint);
  repaint(name);
  renderList();
}

function renderPalette(){
  document.getElementById('palette').innerHTML = PALETTE.map(function(p){
    return '<button title="'+p.n+'" class="'+(cur===p.c?'on':'')+'" style="background:'+p.c+'" onclick="pick(\''+p.c+'\')"></button>';
  }).join('') + '<button class="erase'+(cur===''?' on':'')+'" onclick="pick(\'\')">지우개</button>';
}
window.pick = function(c){ cur = c; save('haeka_worldmap_cur', cur); renderPalette(); };

function renderList(){
  var names = Object.keys(paint).filter(function(n){ return shapes[n]; });
  var total = cities.reduce(function(s,c){ return s+(c.count||0); }, 0);
  document.getElementById('sum').innerHTML =
    '칠한 나라 <strong>'+names.length+'</strong>곳'
    + (cities.length ? '<br>해카 등록 도시 <strong>'+cities.length+'</strong>곳 · 매장 <strong>'+total.toLocaleString()+'</strong>곳' : '');
  var html = '<div class="list-h"><span>칠한 나라</span>'+(names.length?'<button onclick="clearAll()">모두 지우기</button>':'')+'</div>';
  if(!names.length) html += '<div class="empty">아직 칠한 나라가 없어요</div>';
  PALETTE.forEach(function(p){
    names.filter(function(n){ return paint[n]===p.c; }).sort(function(a,b){ return shapes[a].ko.localeCompare(shapes[b].ko,'ko'); }).forEach(function(n){
      html += '<div class="row" onclick="focusCountry(\''+esc(n).replace(/'/g,"\\'")+'\')"><i class="dot" style="background:'+p.c+'"></i><span class="nm">'+esc(shapes[n].ko)+'</span></div>';
    });
  });
  if(cities.length){
    html += '<div class="list-h"><span>해카 등록 도시</span></div>';
    cities.slice().sort(function(a,b){ return (b.count||0)-(a.count||0); }).forEach(function(c){
      html += '<div class="row" onclick="focusCity(\''+esc(c.name).replace(/'/g,"\\'")+'\')"><i class="dot" style="background:#1A1A1A"></i><span class="nm">'+esc(c.name)+'</span><span class="ct">'+(c.count!=null?Number(c.count).toLocaleString()+'곳':'')+'</span></div>';
    });
  }
  document.getElementById('list').innerHTML = html;
}
window.clearAll = function(){
  if(!confirm('칠한 색을 모두 지울까요?')) return;
  var names = Object.keys(paint); paint = {}; save('haeka_worldmap_paint', paint);
  names.forEach(repaint); renderList();
};
window.focusCountry = function(name){
  var s = shapes[name]; if(!s) return;
  map.flyTo(s.center, Math.max(map.getZoom(), s.small ? 6 : 4), { duration:.6 });
};
window.focusCity = function(name){
  var c = cities.filter(function(x){ return x.name===name; })[0]; if(!c) return;
  map.flyTo([c.lat, shiftLng(c.lng)], Math.max(map.getZoom(), 6), { duration:.6 });
};

// 폴리곤 하나의 바깥 테두리로 넓이·중심을 어림한다
function ringInfo(ring){
  var a=0, sx=0, sy=0, n=ring.length;
  for(var i=0;i<n-1;i++){ a += ring[i][0]*ring[i+1][1] - ring[i+1][0]*ring[i][1]; sx += ring[i][0]; sy += ring[i][1]; }
  return { area: Math.abs(a/2), cx: sx/Math.max(1,n-1), cy: sy/Math.max(1,n-1) };
}

function drawWorld(world, extra){
  var fc = topojson.feature(world, world.objects.countries);
  // 기본 자료에 없는 아주 작은 섬·지역(투발루, 지브롤터 등)을 더 자세한 자료에서 가져와 붙인다
  fc.features.concat((extra && extra.features) || []).forEach(function(f){
    var name = f.properties && f.properties.name; if(!name || !f.geometry) return;
    var polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    var area = 0, best = null;
    polys = polys.map(function(poly){
      var mean = poly[0].reduce(function(s,p){ return s+p[0]; }, 0) / poly[0].length;
      var shifted = mean < SHIFT_AT ? poly.map(function(r){ return r.map(function(p){ return [p[0]+360, p[1]]; }); }) : poly;
      var info = ringInfo(shifted[0]); area += info.area;
      if(!best || info.area > best.area) best = info;
      return shifted;
    });
    var ko = KO[name] || name;
    var layer = L.geoJSON({ type:'Feature', properties:{}, geometry:{ type:'MultiPolygon', coordinates:polys } }, { style: styleOf(name) });
    layer.bindTooltip(ko, { sticky:true, direction:'top', offset:[0,-4] });
    layer.on('click', function(e){ L.DomEvent.stopPropagation(e); clickCountry(name); });
    layer.addTo(map);
    var entry = { layers:[layer], center:[best.cy, best.cx], ko:ko, small: area < 1.2 };
    // 작은 섬나라는 누르기 쉽게 동그란 점을 같이 찍는다
    if(entry.small){
      var dot = L.circleMarker(entry.center, { renderer:dotRenderer, radius:5, weight:1.5, color: paint[name] ? '#fff' : '#6B7280', fillColor: paint[name] || '#fff', fillOpacity:1 });
      dot._isDot = true;
      dot.bindTooltip(ko, { direction:'top', offset:[0,-5] });
      dot.on('click', function(e){ L.DomEvent.stopPropagation(e); clickCountry(name); });
      dot.addTo(map);
      entry.layers.push(dot);
    }
    shapes[name] = entry;
  });
  renderList();
}

function countCity(name){
  return fetch('https://firestore.googleapis.com/v1/projects/'+PROJECT+'/databases/(default)/documents:runAggregationQuery', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ structuredAggregationQuery:{ structuredQuery:{ from:[{ collectionId:'stores' }],
      where:{ fieldFilter:{ field:{ fieldPath:'city' }, op:'EQUAL', value:{ stringValue:name } } } }, aggregations:[{ alias:'n', count:{} }] } })
  }).then(function(r){ return r.json(); }).then(function(d){
    return Number((((d[0]||{}).result||{}).aggregateFields||{}).n.integerValue || 0);
  }).catch(function(){ return null; });
}
function drawCities(list){
  return Promise.all(list.map(function(c){
    return countCity(c.name).then(function(n){
      if(n === 0) return;   // 좌표만 있고 매장이 없는 도시는 표시하지 않는다
      c.count = n; cities.push(c);
      L.circleMarker([c.lat, shiftLng(c.lng)], { renderer:cityRenderer, radius:3.5, weight:1.5, color:'#fff', fillColor:'#1A1A1A', fillOpacity:1, interactive:false }).addTo(map);
    });
  })).then(renderList);
}

renderPalette();
renderList();
Promise.all([
  fetch('data/world-50m.json').then(function(r){ return r.json(); }),
  fetch('data/world-extra.json').then(function(r){ return r.json(); }).catch(function(){ return null; })
]).then(function(r){ drawWorld(r[0], r[1]); }).then(function(){
  return fetch('data/cities.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(drawCities);
}).catch(function(){ document.getElementById('sum').textContent = '지도를 불러오지 못했어요'; });
</script>
