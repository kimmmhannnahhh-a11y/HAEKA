<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HAEKA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#1A5D1A;overflow:hidden}

.splash{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:24px;
}

/* 심볼 */
.symbol{
  opacity:0;
  transform:scale(0.7);
  animation:symbolIn .5s cubic-bezier(0.34,1.56,0.64,1) .1s forwards;
}
@keyframes symbolIn{
  to{opacity:1;transform:scale(1)}
}

/* 워드마크 */
.wordmark{
  opacity:0;
  transform:translateY(10px);
  animation:wordIn .4s ease .5s forwards;
  font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;
  font-size:28px;
  font-weight:700;
  color:#ffffff;
  letter-spacing:8px;
}
@keyframes wordIn{
  to{opacity:1;transform:translateY(0)}
}

/* 서브텍스트 */
.sub{
  opacity:0;
  animation:fadeIn .35s ease .75s forwards;
  font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;
  font-size:11px;
  color:rgba(255,255,255,0.55);
  letter-spacing:2px;
}
@keyframes fadeIn{
  to{opacity:1}
}

/* 전체 페이드아웃 */
.splash.out{
  animation:splashOut .35s ease forwards;
}
@keyframes splashOut{
  to{opacity:0;transform:scale(1.04)}
}
</style>
</head>
<body>
<div class="splash" id="splash">

  <!-- 심볼 SVG -->
  <div class="symbol">
    <svg width="100" height="100" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <circle cx="170" cy="200" r="130" fill="rgba(255,255,255,0.9)"/>
      <circle cx="250" cy="200" r="130" fill="rgba(0,0,0,0.75)"/>
      <path d="M 210 70 A 130 130 0 0 1 210 330 A 130 130 0 0 1 210 70" fill="rgba(255,255,255,0.15)"/>
      <rect x="130" y="148" width="18" height="108" rx="3" fill="#1A5D1A"/>
      <rect x="252" y="148" width="18" height="108" rx="3" fill="#1A5D1A"/>
      <rect x="130" y="193" width="140" height="18" rx="3" fill="#1A5D1A"/>
    </svg>
  </div>

  <div class="wordmark">HAEKA</div>
  <div class="sub">해외에서 카드결제하자</div>

</div>

<script>
setTimeout(function() {
  var splash = document.getElementById('splash');
  splash.classList.add('out');
  setTimeout(function() {
    // 연결할 페이지로 이동
    window.location.href = 'heka_home_v5.html';
  }, 350);
}, 1000);
</script>
</body>
</html>
