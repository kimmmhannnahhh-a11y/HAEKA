<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="app-mobile.css"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HAEKA</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet"/>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('haeka_rebuild_common.css');
@media not all{
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#fff;overflow:hidden}

.splash{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:22px;
  font-family:'Gowun Dodum','Pretendard',-apple-system,sans-serif;
}

/* 비행기 */
.plane{
  opacity:0;
  transform:translateY(20px) scale(0.85);
  animation:planeIn .6s cubic-bezier(0.34,1.56,0.64,1) .15s forwards;
}
@keyframes planeIn{
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* 텍스트 */
.txt{
  text-align:center;
  line-height:1.2;
  letter-spacing:-1.2px;
  opacity:0;
  transform:translateY(10px);
  animation:txtIn .5s ease .55s forwards;
}
@keyframes txtIn{
  to{opacity:1;transform:translateY(0)}
}
.txt .line{margin-top:4px}
.green{font-size:32px;font-weight:700;color:#FF385C}
.black{font-size:31px;font-weight:700;color:#222}

.splash.out{animation:splashOut .35s ease forwards}
@keyframes splashOut{to{opacity:0}}
/* HAEKA 2.0 common override */
:root{--hk-bg:#FAFAF8;--hk-surface:#fff;--hk-text:#1A1A1A;--hk-sub:#6B7280;--hk-accent:#FF385C;--hk-border:#F3F4F6;--hk-card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
body{background:var(--hk-bg)!important;font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important;color:var(--hk-text)!important}.phone{background:var(--hk-bg)!important;border:0!important;box-shadow:0 24px 70px rgba(17,24,39,.14)!important}.sb,.topbar{background:#fff!important;color:var(--hk-text)!important;border-bottom:1px solid var(--hk-border)!important;box-shadow:0 1px 10px rgba(0,0,0,.035)!important}.topbar-title,.logo{color:var(--hk-text)!important;font-weight:800!important}.btn-green,.btn-primary,.primary,.popup-btn,.send-btn{background:var(--hk-accent)!important;color:#fff!important;border-color:var(--hk-accent)!important;border-radius:12px!important;box-shadow:0 8px 20px rgba(255,56,92,.25)!important}input:focus,textarea:focus,select:focus{border-color:var(--hk-accent)!important}.card,.item,.list-item,.post-card,.store-card,.notice-item{background:#fff!important;border:0!important;border-radius:16px!important;box-shadow:var(--hk-card-shadow)!important}.bnav{background:rgba(255,255,255,.94)!important;border-top:1px solid var(--hk-border)!important}.ni.on,.nplbl{color:var(--hk-accent)!important}.npbtn{background:var(--hk-accent)!important}.toast{background:rgba(26,26,26,.88)!important;backdrop-filter:blur(10px)!important;border-radius:999px!important}button[style*="#FF385C"],[style*="background:#FF385C"]{background:var(--hk-accent)!important;color:#fff!important}[style*="color:#FF385C"],[style*="border-color:#FF385C"]{color:var(--hk-accent)!important;border-color:var(--hk-accent)!important}
}
</style>
<script src="security.js"></script>
</head>
<body>
<div class="splash" id="splash">

  <!-- 통통하고 귀여운 하늘색 비행기 -->
  <div class="plane">
    <svg width="110" height="110" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="20" cy="84" rx="13" ry="3.5" fill="#E0F2FE" opacity="0.9"/>
      <ellipse cx="80" cy="86" rx="10" ry="3" fill="#E0F2FE" opacity="0.9"/>
      <g transform="rotate(-18 50 50)">
        <ellipse cx="44" cy="68" rx="14" ry="7" fill="#38BDF8"/>
        <ellipse cx="44" cy="66" rx="13" ry="5" fill="#7DD3FC"/>
        <ellipse cx="50" cy="50" rx="34" ry="14" fill="#7DD3FC"/>
        <ellipse cx="48" cy="46" rx="28" ry="5" fill="#BAE6FD" opacity="0.7"/>
        <ellipse cx="78" cy="50" rx="9" ry="10" fill="#38BDF8"/>
        <circle cx="82" cy="50" r="3" fill="#0EA5E9"/>
        <circle cx="38" cy="48" r="3" fill="#fff"/>
        <circle cx="50" cy="48" r="3" fill="#fff"/>
        <circle cx="62" cy="48" r="3" fill="#fff"/>
        <circle cx="38" cy="48" r="2" fill="#BAE6FD"/>
        <circle cx="50" cy="48" r="2" fill="#BAE6FD"/>
        <circle cx="62" cy="48" r="2" fill="#BAE6FD"/>
        <ellipse cx="44" cy="34" rx="16" ry="8" fill="#38BDF8"/>
        <ellipse cx="44" cy="34" rx="14" ry="6" fill="#7DD3FC"/>
        <path d="M 20 50 Q 10 38 12 48 Q 8 50 12 52 Q 10 62 20 50 Z" fill="#38BDF8"/>
      </g>
    </svg>
  </div>

  <!-- 텍스트 -->
  <div class="txt">
    <div><span class="green">해</span><span class="black">외에서</span></div>
    <div class="line"><span class="green">카</span><span class="black">드결제하자</span></div>
  </div>

</div>

<script>
setTimeout(function() {
  var splash = document.getElementById('splash');
  splash.classList.add('out');
  setTimeout(function() {
    window.location.href = 'heka_home_v5.html';
  }, 350);
}, 1500);
</script>
</body>
</html>
