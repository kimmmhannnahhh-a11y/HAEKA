<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>수정 요청</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('haeka_rebuild_common.css');
@media not all{
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:100px}
.topbar{position:sticky;top:0;z-index:100;background:#FF385C;display:flex;align-items:center;padding:0 16px;height:52px}
.back-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:none;font-size:18px;color:#fff;margin-right:8px}
.topbar-title{font-size:16px;font-weight:700;color:#fff;flex:1}
.store-info{background:#fff;padding:14px 16px;border-bottom:1px solid #f0f0f0;margin-bottom:8px}
.store-name{font-size:14px;font-weight:700;color:#111}
.store-sub{font-size:11px;color:#aaa;margin-top:2px}
.section{background:#fff;padding:14px 16px;margin-bottom:8px}
.block-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.label-blue{color:#FF385C}
.label-red{color:#e53e3e}
.chk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chk-item{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:8px;border:1.5px solid #e0e0e0;background:#f8f8f8;cursor:pointer;transition:.15s;user-select:none}
.chk-item.on{border-color:#FF385C;background:#FFF1F2}
.chk-item.on.red{border-color:#e53e3e;background:#fff5f5}
.chk-box{width:15px;height:15px;border-radius:3px;border:1.5px solid #d0d0d0;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;transition:.15s}
.chk-item.on .chk-box{background:#FF385C;border-color:#FF385C}
.chk-item.on.red .chk-box{background:#e53e3e;border-color:#e53e3e}
.chk-item.on .chk-box::after,.chk-item.on.red .chk-box::after{content:"✓";color:#fff;font-size:9px;font-weight:800}
.chk-txt{font-size:11px;font-weight:600;color:#333}
.memo-box{width:100%;border:1.5px solid #eee;border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;resize:none;height:80px;outline:none;color:#222;margin-top:4px}
.memo-box:focus{border-color:#FF385C}
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.submit-btn{width:100%;background:#FF385C;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.submit-btn:disabled{background:#ccc;cursor:not-allowed}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:50px;font-size:13px;font-weight:600;white-space:nowrap;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.req-note{font-size:11px;color:#aaa;margin-top:8px}
/* HAEKA 2.0 common override */
:root{--hk-bg:#FAFAF8;--hk-surface:#fff;--hk-text:#1A1A1A;--hk-sub:#6B7280;--hk-accent:#FF385C;--hk-border:#F3F4F6;--hk-card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
body{background:var(--hk-bg)!important;font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important;color:var(--hk-text)!important}.phone{background:var(--hk-bg)!important;border:0!important;box-shadow:0 24px 70px rgba(17,24,39,.14)!important}.sb,.topbar{background:#fff!important;color:var(--hk-text)!important;border-bottom:1px solid var(--hk-border)!important;box-shadow:0 1px 10px rgba(0,0,0,.035)!important}.topbar-title,.logo{color:var(--hk-text)!important;font-weight:800!important}.btn-green,.btn-primary,.primary,.popup-btn,.send-btn{background:var(--hk-accent)!important;color:#fff!important;border-color:var(--hk-accent)!important;border-radius:12px!important;box-shadow:0 8px 20px rgba(255,56,92,.25)!important}input:focus,textarea:focus,select:focus{border-color:var(--hk-accent)!important}.card,.item,.list-item,.post-card,.store-card,.notice-item{background:#fff!important;border:0!important;border-radius:16px!important;box-shadow:var(--hk-card-shadow)!important}.bnav{background:rgba(255,255,255,.94)!important;border-top:1px solid var(--hk-border)!important}.ni.on,.nplbl{color:var(--hk-accent)!important}.npbtn{background:var(--hk-accent)!important}.toast{background:rgba(26,26,26,.88)!important;backdrop-filter:blur(10px)!important;border-radius:999px!important}button[style*="#FF385C"],[style*="background:#FF385C"]{background:var(--hk-accent)!important;color:#fff!important}[style*="color:#FF385C"],[style*="border-color:#FF385C"]{color:var(--hk-accent)!important;border-color:var(--hk-accent)!important}
}
</style>
<script src="security.js"></script>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="topbar-title">수정 요청</div>
</div>

<div class="store-info">
  <div class="store-name" id="store-name-txt">매장 정보 불러오는 중...</div>
  <div class="store-sub">결제 수단 정보 수정 요청</div>
</div>

<div class="section">
  <div class="block-label" style="color:#e53e3e">매장 상태</div>
  <div onclick="toggleClosed(this)" id="closed-btn" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1.5px solid #eee;background:#f8f8f8;cursor:pointer;transition:.15s">
    <div id="closed-chk" style="width:18px;height:18px;border-radius:4px;border:1.5px solid #ddd;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px"></div>
    <div>
      <div style="font-size:13px;font-weight:700;color:#333">폐업한 매장이에요</div>
      <div style="font-size:10px;color:#aaa;margin-top:1px">선택 시 폐업 정보가 전달돼요</div>
    </div>
  </div>
</div>

<div id="pay-sections">
<div class="section">
  <div class="block-label label-blue">결제 가능 수단<span style="color:#e53e3e">*</span></div>
  <div class="chk-grid" id="grid-ok"></div>
</div>
<div class="section">
  <div class="block-label label-red">결제 불가 수단<span style="color:#e53e3e">*</span></div>
  <div class="chk-grid" id="grid-no"></div>
</div>
</div>

<div class="bottom-bar">
  <button class="submit-btn" id="submit-btn" onclick="submitRequest()">수정 요청 보내기</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmcsC_89TfZUIhgH6hKPaTKLXQn3rRzCo",
  authDomain: "card-store-finder.firebaseapp.com",
  projectId: "card-store-finder",
  storageBucket: "card-store-finder.firebasestorage.app",
  appId: "1:340038449458:web:14c3327a26d0d2892f3f2b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(location.search);
const storeId = params.get('id') || '';
const storeName = decodeURIComponent(params.get('name') || '');

let currentUser = null;
let payOkList = [], payNoList = [];
let submitting = false;

onAuthStateChanged(auth, u => { currentUser = u; });

// cardOptions 단일 소스 로드
var _baseOk = [];
var _baseNo = [];

function renderPayGrid(type, existingSelected) {
  var cards = type === 'ok' ? _baseOk : _baseNo;
  var gridId = type === 'ok' ? 'grid-ok' : 'grid-no';
  var el = document.getElementById(gridId);
  if (!el) return;
  if (!cards.length) {
    el.innerHTML = '<div style="color:#bbb;font-size:12px;padding:12px;text-align:center;grid-column:1/-1">불러오는 중...</div>';
    return;
  }
  el.innerHTML = cards.map(function(card) {
    var isOn = existingSelected && existingSelected.indexOf(card) > -1;
    var onClass = isOn ? (type==='no' ? ' on red' : ' on') : '';
    return '<div class="chk-item'+onClass+'" onclick="togglePay(this,\''+type+'\',\''+card+'\')">' + '<div class="chk-box"></div><span class="chk-txt">'+card+'</span></div>';
  }).join('');
  if (existingSelected) {
    existingSelected.forEach(function(v) {
      if (type === 'ok' && payOkList.indexOf(v) === -1 && cards.indexOf(v) > -1) payOkList.push(v);
      if (type === 'no' && payNoList.indexOf(v) === -1 && cards.indexOf(v) > -1) payNoList.push(v);
    });
  }
}

getDocs(collection(db, 'cardOptions')).then(function(snap) {
  _baseOk = []; _baseNo = [];
  snap.forEach(function(d) {
    var data = d.data();
    if (data.type === 'ok') _baseOk.push(data.name);
    if (data.type === 'no') _baseNo.push(data.name);
  });
  renderPayGrid('ok', null);
  renderPayGrid('no', null);
}).catch(function() {
  renderPayGrid('ok', null);
  renderPayGrid('no', null);
});

// 매장 정보 불러와서 이름 + 기존 payOk/payNo 미리 선택
if (storeId) {
  getDoc(doc(db, 'stores', storeId)).then(s => {
    if (!s.exists()) return;
    var data = s.data();
    if (data.name) document.getElementById('store-name-txt').textContent = data.name;
    // 기존 결제가능 항목 미리 선택 (그리드 재렌더링)
    var existingOk = data.payOk || [];
    var existingNo = data.payNo || [];
    payOkList = []; payNoList = [];
    renderPayGrid('ok', existingOk);
    renderPayGrid('no', existingNo);
  }).catch(()=>{});
} else if (storeName) {
  document.getElementById('store-name-txt').textContent = storeName;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

var isClosed = false;
window.toggleClosed = function(el) {
  isClosed = !isClosed;
  var chk = document.getElementById('closed-chk');
  var paySections = document.getElementById('pay-sections');
  if (isClosed) {
    el.style.borderColor = '#e53e3e'; el.style.background = '#fff5f5';
    chk.style.background = '#e53e3e'; chk.style.borderColor = '#e53e3e'; chk.textContent = '✓';
    paySections.style.opacity = '0.4'; paySections.style.pointerEvents = 'none';
  } else {
    el.style.borderColor = '#eee'; el.style.background = '#f8f8f8';
    chk.style.background = '#fff'; chk.style.borderColor = '#ddd'; chk.textContent = '';
    paySections.style.opacity = '1'; paySections.style.pointerEvents = '';
  }
};

window.togglePay = function(el, type, val) {
  var list = type === 'ok' ? payOkList : payNoList;
  var idx = list.indexOf(val);
  if (idx > -1) {
    list.splice(idx, 1);
    el.classList.remove('on');
    if (type === 'no') el.classList.remove('red');
  } else {
    list.push(val);
    el.classList.add('on');
    if (type === 'no') el.classList.add('red');
  }
};

window.submitRequest = async function() {
  if (submitting) return;
  if (!isClosed && !payOkList.length && !payNoList.length) {
    showToast('결제 가능/불가 수단을 선택하거나 폐업 여부를 선택해주세요');
    return;
  }
  submitting = true;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '전송 중...';

  try {
    await addDoc(collection(db, 'editRequests'), {
      storeId: storeId,
      storeName: storeName,
      isClosed: isClosed,
      payOk: payOkList,
      payNo: payNoList,
      uid: currentUser ? currentUser.uid : 'anonymous',
      nickname: currentUser ? (currentUser.displayName || currentUser.email?.split('@')[0] || '익명') : '익명',
      createdAt: serverTimestamp()
    });
    showToast('수정 요청이 전송됐어요!');
    setTimeout(() => history.back(), 1400);
  } catch(e) {
    console.error(e);
    showToast('오류가 발생했어요. 다시 시도해주세요');
    submitting = false;
    btn.disabled = false;
    btn.textContent = '수정 요청 보내기';
  }
};
</script>
</body>
</html>
