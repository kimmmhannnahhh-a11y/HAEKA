<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="app-mobile.css"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('haeka_rebuild_common.css');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f0f0;display:flex;justify-content:center;padding:30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.phone{width:300px;background:#fff;border-radius:26px;border:1px solid #e0e0e0;overflow:hidden;color:#111;position:relative;display:flex;flex-direction:column;height:680px}
.sb{background:#FF3900;color:#fff;font-size:10px;padding:10px 16px 6px;display:flex;justify-content:space-between;flex-shrink:0}
.topbar{background:#FF3900;padding:10px 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.back-btn{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600;color:#fff;flex:1}

/* 필터바 */
.filterbar{padding:6px 0 6px 14px;border-bottom:0.5px solid #f0f0f0;display:flex;flex-direction:column;gap:5px;flex-shrink:0;overflow:hidden}
.filter-label{font-size:9px;font-weight:700;color:#bbb;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.chip-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;align-items:center;padding-right:20px;cursor:grab}
.chip-row::-webkit-scrollbar{display:none}
.cat-wrap{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;align-items:center;padding-right:20px;cursor:grab}
.cat-wrap::-webkit-scrollbar{display:none}
.sq-chip{flex-shrink:0;padding:4px 9px;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer;border:1.5px solid #e0e0e0;background:#fff;color:#555;white-space:nowrap;transition:.12s;user-select:none}
.sq-chip.on{background:#FF3900;color:#fff;border-color:#FF3900}
.sq-chip-all{flex-shrink:0;padding:4px 9px;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;border:1.5px solid #FF3900;background:#fff;color:#FF3900;white-space:nowrap;transition:.12s;user-select:none}
.sq-chip-all.on{background:#FF3900;color:#fff}
.cc-visa.on{background:#1a1f71;border-color:#1a1f71}
.cc-master.on{background:#eb001b;border-color:#eb001b}
.cc-jcb.on{background:#007b40;border-color:#007b40}
.cc-amex.on{background:#007bc1;border-color:#007bc1}
.cc-tlog.on{background:#FF6B00;border-color:#FF6B00}
.cc-twallet.on{background:#FFD600;border-color:#FFD600;color:#333}
.cc-union.on{background:#e21836;border-color:#e21836}

/* 검색 + 정렬 바 */
.search-sort-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:.5px solid #f0f0f0;flex-shrink:0}
.search-box{flex:1;display:flex;align-items:center;background:#f5f5f5;border:1.5px solid #e0e0e0;border-radius:20px;padding:6px 10px;gap:6px;transition:.15s}
.search-box:focus-within{border-color:#FF3900;background:#fff}
.search-input{flex:1;border:none;background:transparent;font-size:12px;color:#333;outline:none;font-family:inherit}
.search-input::placeholder{color:#bbb}
.search-icon-btn{background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;flex-shrink:0}
.search-icon-btn svg{width:14px;height:14px;stroke:#999;fill:none;stroke-width:2;stroke-linecap:round}
.sort-btn{flex-shrink:0;font-size:11px;color:#FF3900;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;white-space:nowrap}

/* 매장 수 */
.count-bar{padding:6px 14px;font-size:11px;color:#999;flex-shrink:0}

/* 매장 리스트 */
.store-list{flex:1;overflow-y:auto}
.store-list::-webkit-scrollbar{display:none}
.store-item{display:flex;gap:10px;padding:10px 14px;border-bottom:.5px solid #f5f5f5;cursor:pointer;transition:.12s;align-items:flex-start}
.store-item:hover{background:#fafafa}
.store-item:last-child{border-bottom:none}
.store-thumb{width:62px;height:62px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.store-thumb img{width:100%;height:100%;object-fit:cover}
.store-info{flex:1;min-width:0}
.store-name{font-size:13px;font-weight:700;color:#111;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store-meta{display:flex;align-items:center;gap:4px;margin-bottom:4px;flex-wrap:wrap}
.store-cat{font-size:10px;color:#999}
.store-time{font-size:10px;color:#bbb}
.store-dist{font-size:10px;color:#FF3900;font-weight:600}
.store-cards{display:flex;gap:4px;flex-wrap:nowrap;align-items:center;overflow-x:auto;scrollbar-width:none}
.store-cards::-webkit-scrollbar{display:none}
.cpill{font-size:8px;padding:2px 5px;border-radius:3px;font-weight:600;color:#fff;white-space:nowrap;flex-shrink:0}
.store-zzim{flex-shrink:0;background:none;border:none;cursor:pointer;padding:4px;align-self:center}
.store-zzim svg{width:16px;height:16px;fill:none;stroke:#ccc;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.15s}
.store-zzim.on svg{fill:#e53935;stroke:#e53935}

/* 빈 상태 */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px 20px;text-align:center}
.empty-emoji{font-size:36px;margin-bottom:12px}
.empty-txt{font-size:13px;color:#bbb}

/* 바텀시트 */
.sheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);z-index:20;display:none;border-radius:26px}
.sheet-overlay.open{display:block}
.bottom-sheet{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;z-index:21;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;max-height:55%}
.bottom-sheet.open{transform:translateY(0)}
.sheet-handle{width:34px;height:4px;border-radius:2px;background:#e0e0e0;margin:10px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;border-bottom:.5px solid #f0f0f0}
.sheet-title{font-size:13px;font-weight:700}
.sheet-reset{font-size:11px;color:#999;cursor:pointer;padding:2px 6px;border:.5px solid #ddd;border-radius:4px;background:none;font-family:inherit}
.sheet-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 18px;overflow-y:auto}
.sheet-chip{padding:5px 11px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid #e0e0e0;background:#fff;color:#555;white-space:nowrap;transition:.12s;user-select:none}
.sheet-chip.on{background:#FF3900;color:#fff;border-color:#FF3900}
.sheet-done{margin:0 14px 14px;padding:10px;border-radius:8px;background:#FF3900;color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;width:calc(100% - 28px);font-family:inherit}
.sort-item{padding:13px 16px;font-size:13px;color:#333;border-bottom:.5px solid #f5f5f5;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.sort-item:last-child{border-bottom:none}
.sort-item.on{color:#FF3900;font-weight:700}
.sort-check{font-size:14px;color:#FF3900;display:none}
.sort-item.on .sort-check{display:block}

/* 하단 네비 */
.bnav{display:flex;border-top:0.5px solid #eee;background:#fff;padding:8px 0 10px;flex-shrink:0}
.ni{flex:1;text-align:center;font-size:9px;color:#999;cursor:pointer;padding:3px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.ni.on{color:#FF3900;font-weight:600}
.ni svg{width:17px;height:17px}
.nplus{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.npbtn{width:36px;height:36px;border-radius:50%;background:#FF3900;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;border:none;cursor:pointer;margin-bottom:2px;margin-top:-4px}
.nplbl{font-size:9px;color:#FF3900;font-weight:600}

/* 매장 상세 슬라이드 패널 (홈화면과 동일) */
.detail-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.45);z-index:30;display:none;border-radius:26px}
.detail-overlay.open{display:block}
.detail-panel{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;z-index:31;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;max-height:88%}
.detail-panel.open{transform:translateY(0)}
.dp-handle{width:36px;height:4px;border-radius:2px;background:#e0e0e0;margin:10px auto 0;flex-shrink:0}
.dp-topbar{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 15px 4px;flex-shrink:0}
.dp-name{font-size:15px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.dp-cat{font-size:11px;color:#999;white-space:nowrap;flex-shrink:0}
.dp-close{background:none;border:none;font-size:20px;color:#bbb;cursor:pointer;padding:0;line-height:1;flex-shrink:0}
.dp-scroll{overflow-y:auto;flex:1;padding:0 15px 6px}
.dpill{font-size:10px;padding:3px 9px;border-radius:4px;font-weight:700}
.dp-section{font-size:10px;font-weight:700;color:#bbb;letter-spacing:.08em;text-transform:uppercase;margin:12px 0 6px}
.dp-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#444;margin-bottom:6px;line-height:1.5}
.dp-ico{font-size:12px;width:16px;text-align:center;flex-shrink:0;margin-top:1px}
.dp-divider{height:1px;background:#f0f0f0;margin:10px 0}
.dp-btn-row{display:flex;gap:8px;padding:8px 15px 14px;flex-shrink:0;border-top:.5px solid #f0f0f0}
.dp-btn-report{flex:1;padding:11px;border-radius:10px;background:#FFF1F2;color:#FF3900;font-size:12px;font-weight:700;border:1.5px solid #FF3900;cursor:pointer;font-family:inherit}
.dp-btn-more{flex:1;padding:11px;border-radius:10px;background:#FF3900;color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:inherit}
#dp-zzim.on #dp-zzim-svg{fill:#e53935;stroke:#e53935}
/* HAEKA 2.0 common override */
:root{--hk-bg:#FAFAF8;--hk-surface:#fff;--hk-text:#1A1A1A;--hk-sub:#6B7280;--hk-muted:#9CA3AF;--hk-accent:#FF3900;--hk-accent-bg:#FFF1F2;--hk-border:#F3F4F6;--hk-card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
body{background:var(--hk-bg)!important;font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important;color:var(--hk-text)!important}.phone{background:var(--hk-bg)!important;border:0!important;box-shadow:0 24px 70px rgba(17,24,39,.14)!important}.sb{background:#fff!important;color:var(--hk-text)!important;border-bottom:1px solid var(--hk-border)!important}.topbar{background:#fff!important;border-bottom:1px solid var(--hk-border)!important;box-shadow:0 1px 10px rgba(0,0,0,.035)!important}.topbar-title,.logo{color:var(--hk-text)!important;font-weight:800!important}.btn-green,.btn-primary,.primary,.popup-btn,.send-btn{background:var(--hk-accent)!important;color:#fff!important;border-color:var(--hk-accent)!important;border-radius:12px!important;box-shadow:0 8px 20px rgba(255,56,92,.25)!important}.btn-outline,.btn-secondary{background:transparent!important;color:var(--hk-text)!important;border:1.5px solid #E5E7EB!important;border-radius:12px!important}input:focus,textarea:focus,select:focus{border-color:var(--hk-accent)!important;box-shadow:0 0 0 3px rgba(255,56,92,.10)!important}.card,.item,.list-item,.post-card,.store-card,.notice-item,.review-card{background:#fff!important;border:0!important;border-radius:16px!important;box-shadow:var(--hk-card-shadow)!important}.bnav{background:rgba(255,255,255,.94)!important;border-top:1px solid var(--hk-border)!important}.ni.on,.nplbl{color:var(--hk-accent)!important}.npbtn{background:var(--hk-accent)!important;box-shadow:0 8px 20px rgba(255,56,92,.25)!important}.toast{background:rgba(26,26,26,.88)!important;backdrop-filter:blur(10px)!important;border-radius:999px!important}button[style*="#FF3900"],[style*="background:#FF3900"]{background:var(--hk-accent)!important;color:#fff!important}[style*="color:#FF3900"],[style*="border-color:#FF3900"]{color:var(--hk-accent)!important;border-color:var(--hk-accent)!important}

/* HAEKA Immediate Pay List */
body{background:var(--hk-bg)!important;font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important;color:var(--hk-text)!important}
.phone{background:var(--hk-bg)!important;border:0!important;box-shadow:0 24px 70px rgba(17,24,39,.14)!important}
.sb{background:#fff!important;color:var(--hk-text)!important;border-bottom:1px solid var(--hk-border)!important}
.topbar{background:#fff!important;color:var(--hk-text)!important;border-bottom:1px solid var(--hk-border)!important;box-shadow:0 1px 10px rgba(0,0,0,.035)!important}
.back-btn{color:var(--hk-text)!important}
.topbar-title{font-size:16px!important;font-weight:800!important;color:var(--hk-text)!important}
.filterbar{background:rgba(255,255,255,.96)!important;border-bottom:1px solid var(--hk-border)!important;padding:10px 0 8px 14px!important;gap:8px!important}
.chip-row,.cat-wrap{gap:7px!important;padding-right:18px!important}
.sq-chip,.sq-chip-all,.sheet-chip{border:0!important;border-radius:999px!important;background:#F3F4F6!important;color:var(--hk-sub)!important;font-size:11px!important;font-weight:800!important;padding:8px 12px!important;letter-spacing:-.02em!important}
.sq-chip.on,.sq-chip-all.on,.sheet-chip.on{background:var(--hk-text)!important;color:#fff!important;box-shadow:0 8px 18px rgba(0,0,0,.12)!important}
.search-sort-bar{background:rgba(255,255,255,.96)!important;border-bottom:1px solid var(--hk-border)!important;padding:10px 14px!important;gap:10px!important}
.search-box{background:#fff!important;border:1.5px solid #E5E7EB!important;border-radius:12px!important;padding:9px 12px!important}
.search-box:focus-within{border-color:var(--hk-accent)!important;box-shadow:0 0 0 3px rgba(255,57,0,.10)!important}
.search-input{font-size:13px!important;color:var(--hk-text)!important}
.sort-btn{background:#F3F4F6!important;color:var(--hk-text)!important;border-radius:999px!important;padding:9px 12px!important;font-size:11px!important;font-weight:800!important}
.count-bar{padding:10px 14px 4px!important;font-size:11px!important;font-weight:800!important;color:var(--hk-muted)!important;background:var(--hk-bg)!important}
.store-list{background:var(--hk-bg)!important;padding:6px 14px 14px!important}
.store-item{display:flex!important;gap:12px!important;align-items:flex-start!important;margin:0 0 10px!important;padding:12px!important;border:0!important;border-radius:16px!important;background:#fff!important;box-shadow:var(--hk-card-shadow)!important}
.store-item:hover{background:#fff!important;transform:translateY(-1px)}
.store-thumb{width:96px!important;height:96px!important;border-radius:12px!important;font-size:22px!important;font-weight:900!important;color:var(--hk-text)!important;letter-spacing:-.04em!important;background:#F3F4F6!important}
.store-thumb img{width:100%!important;height:100%!important;object-fit:cover!important}
.store-info{min-width:0!important;min-height:96px!important;display:flex!important;flex-direction:column!important;justify-content:space-between!important;flex:1!important;padding:2px 0!important}
.store-name{font-size:16px!important;font-weight:800!important;line-height:1.3!important;color:var(--hk-text)!important;margin:0 28px 4px 0!important;white-space:normal!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
.store-meta{display:flex!important;align-items:center!important;gap:5px!important;margin:0!important;flex-wrap:wrap!important;font-size:12px!important}
.store-dist{order:-1!important;color:#A3E635!important;font-size:12px!important;font-weight:900!important;text-shadow:0 0 1px rgba(0,0,0,.12)!important}
.store-cat{font-size:12px!important;font-weight:700!important;color:var(--hk-sub)!important}
.store-time{font-size:11px!important;font-weight:600!important;color:var(--hk-muted)!important}
.store-status{display:inline-flex!important;align-items:center!important;gap:4px!important;font-size:10px!important;font-weight:800!important}
.store-status i{width:6px!important;height:6px!important;border-radius:50%!important;display:inline-block!important}
.store-status-open{color:#5DA82F!important}
.store-status-open i{background:#A3E635!important}
.store-status-close{color:#9CA3AF!important}
.store-status-close i{background:#9CA3AF!important}
.store-cards{gap:4px!important;margin-top:8px!important;overflow:hidden!important;flex-wrap:wrap!important}
.cpill{color:#fff!important;border:0!important;border-radius:999px!important;font-size:9px!important;font-weight:900!important;padding:3px 7px!important}
.store-zzim{position:absolute!important;right:10px!important;top:10px!important;background:#fff!important;border-radius:999px!important;box-shadow:0 4px 12px rgba(0,0,0,.08)!important}
.store-zzim svg{width:17px!important;height:17px!important}
.empty-state{height:auto!important;min-height:260px!important;margin:12px 14px!important;border-radius:18px!important;background:#fff!important;box-shadow:var(--hk-card-shadow)!important;padding:42px 22px!important}
.empty-emoji{display:none!important}
.empty-state::before{content:'';width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--hk-accent),#FFB199);display:block;margin-bottom:14px}
.empty-txt{font-size:15px!important;font-weight:800!important;color:var(--hk-text)!important}
.empty-txt::after{content:'\A 필터를 줄이거나 새 매장을 제보해주세요';white-space:pre;display:block;margin-top:7px;font-size:12px;font-weight:700;color:var(--hk-sub)}
.bottom-sheet{border-radius:22px 22px 0 0!important}
.sheet-title{font-size:14px!important;font-weight:800!important;color:var(--hk-text)!important}
.sheet-done{background:var(--hk-accent)!important;border-radius:12px!important;font-size:13px!important;font-weight:800!important}

/* HAEKA no-photo abstract illustration */
.store-thumb:not(:has(img)){
  position:relative!important;
  align-items:flex-end!important;
  justify-content:flex-end!important;
  padding:8px!important;
  overflow:hidden!important;
  background:linear-gradient(135deg,#FFF7F3,#FFE4D8)!important;
  border:1px solid rgba(255,57,0,.10)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.70),inset 0 -18px 36px rgba(255,57,0,.06)!important;
  color:rgba(255,57,0,.60)!important;
  font-size:11px!important;
  font-weight:900!important;
  line-height:1!important;
}
.store-thumb:not(:has(img))::before{
  content:'';position:absolute;left:50%;top:48%;width:42px;height:28px;
  transform:translate(-50%,-50%) rotate(-8deg);
  border:2px solid rgba(255,57,0,.38);border-radius:8px;
  background:rgba(255,255,255,.24);box-shadow:0 8px 18px rgba(255,57,0,.10);
}
.store-thumb:not(:has(img))::after{
  content:'';position:absolute;left:50%;top:48%;width:18px;height:18px;
  transform:translate(4px,-8px) rotate(18deg);
  border-radius:50%;border:2px solid rgba(255,57,0,.30);
  box-shadow:12px 14px 0 -8px rgba(255,57,0,.42),-18px 15px 0 -7px rgba(255,57,0,.18);
}
</style>

<body>
<div class="phone">
  <div class="sb"><span>9:41</span><span>해카</span><span style="opacity:0">●●●</span></div>

  <div class="topbar">
    <button class="back-btn" onclick="history.back()">←</button>
    <span class="topbar-title">내 주변 카드 결제 매장</span>
  </div>

  <!-- 필터바 -->
  <div class="filterbar">
    <div>
      <div class="chip-row">
        <div class="sq-chip-all on" id="card-all-btn" onclick="toggleCardSheet()">카드 ▾</div>
        <div class="sq-chip cc-visa" onclick="toggleCardMain(this,'VISA')">VISA</div>
        <div class="sq-chip cc-master" onclick="toggleCardMain(this,'MASTER')">MASTER</div>
        <div class="sq-chip cc-jcb" onclick="toggleCardMain(this,'JCB')">JCB</div>
        <div class="sq-chip cc-amex" onclick="toggleCardMain(this,'AMEX')">AMEX</div>
        <div class="sq-chip cc-tlog" onclick="toggleCardMain(this,'트래블로그')">트래블로그</div>
        <div class="sq-chip cc-twallet" onclick="toggleCardMain(this,'트래블월렛')">트래블월렛</div>
        <div class="sq-chip cc-union" onclick="toggleCardMain(this,'UnionPay')">UnionPay</div>
      </div>
    </div>
    <div>
      <div class="cat-wrap" id="cat-wrap">
        <div class="sq-chip-all on" id="cat-all-btn" onclick="toggleCatSheet()">업종 ▾</div>
      </div>
    </div>
  </div>

  <!-- 검색 + 정렬 한 줄 -->

<script>
function calcIsOpenSlide(hours, todayIdx) {
  try {
    var todayHours = (hours[todayIdx] || '').replace(/^[^:]+:\s*/, '').trim();
    if (!todayHours || todayHours.includes('휴무') || todayHours.toLowerCase().includes('closed')) return false;
    if (todayHours.includes('24시간')) return true;
    var parts = todayHours.split('~');
    if (parts.length < 2) return null;
    function parseTime(s) {
      s = s.trim();
      var isPM = s.includes('오후') || s.includes('PM');
      var isAM = s.includes('오전') || s.includes('AM');
      var m = s.match(/(\d{1,2}):(\d{2})/);
      if (!m) return null;
      var h = parseInt(m[1]), min = parseInt(m[2]);
      if (isPM && h < 12) h += 12;
      if (isAM && h === 12) h = 0;
      return h * 60 + min;
    }
    var now = new Date();
    var nowMins = now.getHours() * 60 + now.getMinutes();
    var openMins = parseTime(parts[0]);
    var closeMins = parseTime(parts[1]);
    if (openMins === null || closeMins === null) return null;
    if (closeMins <= openMins) closeMins += 24 * 60;
    return nowMins >= openMins && nowMins < closeMins;
  } catch(e) { return null; }
}
function closeDetail(){document.getElementById('detail-overlay').classList.remove('open');document.getElementById('detail-panel').classList.remove('open');}
function getZzimList(){
  if(window._currentUser && window._zzimStores) return window._zzimStores.slice();
  try{ return JSON.parse(localStorage.getItem('haeka_zzim')||'[]'); }catch(e){ return []; }
}
async function saveZzimList(list){
  if(window._currentUser){
    window._zzimStores = list;
    try { await window._setDoc(window._doc(window._db, 'zzim', window._currentUser.uid), { stores: list }, { merge: true }); }
    catch(e){ console.error('zzim save:', e); }
  } else {
    try{ localStorage.setItem('haeka_zzim', JSON.stringify(list)); }catch(e){}
  }
}

async function _doZzimToggle(store){
  // 로그인 상태인데 _zzimStores 아직 안 로드면 Firestore 먼저
  if (window._currentUser && !window._zzimStores && window._getDoc && window._doc && window._db) {
    try {
      var snap = await window._getDoc(window._doc(window._db, 'zzim', window._currentUser.uid));
      window._zzimStores = snap.exists() ? (snap.data().stores || []) : [];
    } catch(err) { window._zzimStores = []; }
  }
  var list = getZzimList();
  var idx = list.findIndex(function(s){ return s.id === store.id; });
  var nowOn;
  if(idx > -1){ list.splice(idx,1); nowOn=false; }
  else { list.unshift(store); nowOn=true; }
  await saveZzimList(list);
  _syncAllZzimUI(store.id, nowOn);
  try { sessionStorage.setItem('haeka_zzim_changed', '1'); } catch(e2) {}
  return nowOn;
}

// 인증 핸들러가 다 로드 후 한 번에 UI 동기화
window._renderZzimUIAll = function(){
  if(!window._zzimStores) return;
  document.querySelectorAll('.store-zzim').forEach(function(b){ b.classList.remove('on'); });
  window._zzimStores.forEach(function(s){ _syncAllZzimUI(s.id, true); });
};

function _syncAllZzimUI(storeId, isOn){
  // 리스트 아이템 하트
  document.querySelectorAll('.store-zzim[data-store-id="'+storeId+'"]').forEach(function(btn){
    if(isOn) btn.classList.add('on'); else btn.classList.remove('on');
  });
  // 슬라이드 패널 하트
  var dpZzim = document.getElementById('dp-zzim');
  if(dpZzim && window._currentStoreId === storeId){
    if(isOn) dpZzim.classList.add('on'); else dpZzim.classList.remove('on');
  }
}

function toggleZzimStore(e, btn, idx){
  e.stopPropagation();
  if(!window._getCurrentUser || !window._getCurrentUser()){
    showNearbyLoginPopup('찜','찜 기능은 로그인 후 이용할 수 있어요');
    return;
  }
  var store = _renderedStores[idx];
  if(!store) return;
  _doZzimToggle(store);
}
async function toggleDpZzim(){
  if(!window._getCurrentUser || !window._getCurrentUser()){
    showNearbyLoginPopup('찜','찜 기능은 로그인 후 이용할 수 있어요');

  }
  var id = window._currentStoreId;
  var store = _renderedStores.find(function(s){ return s.id===id; });

  showToast(nowOn ? '찜 목록에 추가됐어요!' : '찜 목록에서 제거됐어요');
}

</script>

  try {
    if (typeof google !== 'undefined' && store.lat && store.lng) {
      const { Place } = await google.maps.importLibrary('places');
      const { places } = await Place.searchByText({

      });
      if (places && places[0]) {
        var p = places[0];
        placesInfo.phone = p.nationalPhoneNumber || null;
        if (p.regularOpeningHours) {
          placesInfo.hours = p.regularOpeningHours.weekdayDescriptions || null;
          try { placesInfo.isOpen = p.regularOpeningHours.isOpen(); } catch(e) { placesInfo.isOpen = null; }
        }
      }
    }
  } catch(e) { console.log('Places 오류:', e); }

  var mapHtml = '';

      + '<div id="dp-gmap" style="width:100%;height:100%"></div>'

  var hoursHtml = '';

    }, 150);
  }
};

function cardColor(c){var m={'VISA':'#1a1f71','MASTER':'#eb001b','JCB':'#007b40','AMEX':'#007bc1','트래블로그':'#FF6B00','트래블월렛':'#b8970a','UnionPay':'#9b7fe8','카드가능':'#FF3900','현금가능':'#2e7d32','모르겠어요':'#9e9e9e'};return m[c]||'#888';}

function catBg(c){var m={'식당':'#FFF0E0','카페':'#FFF8E8','펍':'#F0F8FF','패스트푸드':'#FFF4E8','이자카야':'#FFF0F4','편의점':'#EEF4FF','마트':'#EDFFF4','호텔':'#F4F0FF','입장권':'#FEFEE8','전철 티켓':'#EEF0FF','버스':'#EEFFFA','ATM기':'#FFF0FA'};return m[c]||'#F4F4F8';}
function timeAgo(ts){if(!ts)return'방금 전';var t=ts.toMillis?ts.toMillis():(ts.seconds?ts.seconds*1000:ts),d=Math.floor((Date.now()-t)/60000);if(d<1)return'방금 전';if(d<60)return d+'분 전';if(d<1440)return Math.floor(d/60)+'시간 전';return Math.floor(d/1440)+'일 전';}
function calcDist(a,b,c,d){var R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180,x=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)*Math.sin(dG/2);return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));}
function distLbl(m){return m<1000?m+'M':(m/1000).toFixed(1)+'km';}

// ── 한글→로마자 변환 (검색용) ──
var KO_CONSONANTS='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
var KO_VOWELS='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
var ROMAJA_CHO=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
var ROMAJA_JUNG=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
var ROMAJA_JONG=['','g','kk','gs','n','nj','nh','d','r','rg','rm','rb','rs','rt','rp','rh','m','b','bs','s','ss','ng','j','ch','k','t','p','h'];

function korToRomaja(str){
  var result='';
  for(var i=0;i<str.length;i++){
    var code=str.charCodeAt(i);
    if(code>=0xAC00&&code<=0xD7A3){
      var idx=code-0xAC00;
      var cho=Math.floor(idx/588);
      var jung=Math.floor((idx%588)/28);
      var jong=idx%28;
      result+=ROMAJA_CHO[cho]+ROMAJA_JUNG[jung]+ROMAJA_JONG[jong];
    } else {
      result+=str[i];
    }
  }
  return result.toLowerCase();
}

// 한글 초성 추출
function getChosung(str){
  var result='';
  for(var i=0;i<str.length;i++){
    var code=str.charCodeAt(i);
    if(code>=0xAC00&&code<=0xD7A3){
      result+=KO_CONSONANTS[Math.floor((code-0xAC00)/588)];
    }
  }
  return result;
}

// 검색 매칭: 한글 입력 → 영어 상호명도 매칭
// ── 한글 발음 → 영어 자음 매칭 ──
var _CHO2=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
var _JUNG2=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
var _JONG2=['','g','kk','gs','n','nj','nh','d','l','lg','lm','lb','ls','lt','lp','lh','m','b','bs','s','ss','ng','j','ch','k','t','p','h'];
var _EQUIV={'p':['f','b'],'f':['p','b'],'b':['p','v'],'k':['c','g','q'],'c':['k','g'],'g':['k'],'r':['l'],'l':['r'],'t':['d'],'d':['t'],'s':['z'],'n':['ng'],'w':[''],'':['w']};

function _getSyllPron(str){
  var r='';
  for(var i=0;i<str.length;i++){
    var code=str.charCodeAt(i)-0xAC00;
    if(code<0||code>11171){r+=str[i];continue;}
    var cho=Math.floor(code/588),jung=Math.floor((code%588)/28),jong=code%28;
    var p=_CHO2[cho]+_JUNG2[jung]+_JONG2[jong];
    p=p.replace(/eu/g,'').replace(/eo/g,'o').replace(/ae/g,'e');
    r+=p;
  }
  return r.toLowerCase();
}
function _cons(s){return s.replace(/[aeiou]/g,'');}
function _consMatch(ec,kc){
  if(ec===kc)return true;
  var e1=_EQUIV[ec]||[];for(var i=0;i<e1.length;i++)if(e1[i]===kc)return true;
  var e2=_EQUIV[kc]||[];for(var i=0;i<e2.length;i++)if(e2[i]===ec)return true;
  return false;
}
function _korMatchEng(kor,eng){
  var korCons=_cons(_getSyllPron(kor));
  if(!korCons)return false;
  // 전체 붙여서 비교
  var engClean=eng.toLowerCase().replace(/['\s\-.,!?]/g,'');
  var engCons=_cons(engClean);
  var ki=0;
  for(var ei=0;ei<engCons.length&&ki<korCons.length;ei++){if(_consMatch(engCons[ei],korCons[ki]))ki++;}
  if(ki>=korCons.length)return true;
  if(ki>=Math.ceil(korCons.length*0.6)&&korCons.length>=2)return true;
  // 단어별 비교
  var words=eng.toLowerCase().split(/[\s'\-]+/);
  for(var w=0;w<words.length;w++){
    var wc=_cons(words[w]);ki=0;
    for(var ei=0;ei<wc.length&&ki<korCons.length;ei++){if(_consMatch(wc[ei],korCons[ki]))ki++;}
    if(ki>=korCons.length)return true;
    if(ki>=Math.ceil(korCons.length*0.6)&&korCons.length>=2)return true;
  }
  return false;
}

function searchMatch(name, addr, kw, nameEn){
  var nameLow=(name||'').toLowerCase();
  var nameEnLow=(nameEn||'').toLowerCase();
  var addrLow=(addr||'').toLowerCase();
  var nameClean=nameLow.replace(/['\-_.,!?\s]/g,'');
  var kwClean=kw.replace(/['\-_.,!?\s]/g,'');
  // 1) 직접 포함
  if(nameLow.indexOf(kw)>-1)return true;
  if(nameEnLow.indexOf(kw)>-1)return true;
  if(addrLow.indexOf(kw)>-1)return true;
  if(nameClean.indexOf(kwClean)>-1)return true;
  // 2) 한글이면 발음 매칭
  if(/[가-힣]/.test(kw)){
    if(_korMatchEng(kw, name))return true;
    if(_korMatchEng(kw, nameEn||''))return true;
    // 로마자 변환도 시도
    var romaja=korToRomaja(kw);
    if(romaja&&nameLow.indexOf(romaja)>-1)return true;
  }
  return false;
}

function doFilter(){
  var kw=(document.getElementById('search-input-el').value||'').trim().toLowerCase();

    var tOk=catSel.size===0?true:catSel.has(s.category);
    var kOk=!kw?true:searchMatch(s.name, s.address, kw, s.nameEn);
    return cOk&&tOk&&kOk;
  });
  if(sortOrder==='distance'&&userLat&&userLng) list.sort(function(a,b){return(a.lat&&a.lng?calcDist(userLat,userLng,a.lat,a.lng):99999)-(b.lat&&b.lng?calcDist(userLat,userLng,b.lat,b.lng):99999);});
  else if(sortOrder==='latest') list.sort(function(a,b){return(b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0)-(a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0);});
  else if(sortOrder==='rating') list.sort(function(a,b){return(b.rating||0)-(a.rating||0);});
  renderList(list);
}

<script>
var _nearbyEditMap = {};
var _nearbyEditCurrent = null;

async function loadNearbyEditRequests(storeIds) {
  var db=window._db, getDocs=window._getDocs, collection=window._collection, query=window._query, where=window._where;
  if (!db||!getDocs) return;
  try {
    var snap = await getDocs(query(collection(db,'editRequests'), where('storeId','in',storeIds.slice(0,10))));
    snap.forEach(function(d){ var r={id:d.id,...d.data()}; if(!r.resolved) _nearbyEditMap[r.storeId]=r; });
    document.querySelectorAll('[data-edit-store-id]').forEach(function(el){
      var sid=el.getAttribute('data-edit-store-id');
      if(_nearbyEditMap[sid]) el.style.display='inline-block';
    });
  } catch(e){ console.error(e); }
}

function openNearbyEditPopup(el) {
  var sid = el.getAttribute('data-edit-store-id');
  var req = _nearbyEditMap[sid];
  if (!req) return;
  var cu = window._getCurrentUser ? window._getCurrentUser() : null;
  if (!cu) { alert('로그인 후 투표할 수 있어요'); return; }
  _nearbyEditCurrent = req;
  var agreeCount = (req.agreeUids||[]).length;
  var alreadyVoted = (req.agreeUids||[]).includes(cu.uid)||(req.disagreeUids||[]).includes(cu.uid);
  var body = '';
  if (req.payOk&&req.payOk.length) body+='<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:700;color:#FF3900;margin-bottom:4px">결제 가능</div><div style="display:flex;flex-wrap:wrap;gap:4px">'+req.payOk.map(function(c){return'<span style="background:#FFF1F3;color:#FF3900;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px">'+c+'</span>';}).join('')+'</div></div>';
  if (req.payNo&&req.payNo.length) body+='<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:700;color:#e53e3e;margin-bottom:4px">결제 불가</div><div style="display:flex;flex-wrap:wrap;gap:4px">'+req.payNo.map(function(c){return'<span style="background:#fff0f0;color:#e53e3e;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px">'+c+'</span>';}).join('')+'</div></div>';
  body+='<div style="font-size:11px;color:#aaa;margin-top:4px">현재 맞아요 '+agreeCount+'/3</div>';
  document.getElementById('nearby-edit-body').innerHTML=body;
  var agreeBtn=document.getElementById('nearby-agree-btn');

  else{agreeBtn.disabled=false;agreeBtn.style.opacity='1';agreeBtn.textContent='맞아요 👍';}
  document.getElementById('nearby-edit-overlay').style.display='block';
  document.getElementById('nearby-edit-popup').style.display='block';
}

  document.getElementById('nearby-edit-overlay').style.display='none';
  document.getElementById('nearby-edit-popup').style.display='none';
}

window.nearbyVote = async function(type){
  var cu=window._getCurrentUser?window._getCurrentUser():null;
  if(!cu||!_nearbyEditCurrent) return;
  var req=_nearbyEditCurrent, uid=cu.uid;
  var alreadyVoted=(req.agreeUids||[]).includes(uid)||(req.disagreeUids||[]).includes(uid);
  if(alreadyVoted){closeNearbyEditPopup();return;}
  closeNearbyEditPopup();
  var db=window._db,doc=window._doc,updateDoc=window._updateDoc,arrayUnion=window._arrayUnion;
  try{
    var reqRef=doc(db,'editRequests',req.id);
    if(type==='agree'){
      var newAgree=[...(req.agreeUids||[]),uid];
      await updateDoc(reqRef,{agreeUids:arrayUnion(uid)});
      _nearbyEditMap[req.storeId].agreeUids=newAgree;
      if(newAgree.length>=3){
        var upd={resolved:true};
        if(req.payOk&&req.payOk.length) upd.payOk=req.payOk;
        if(req.payNo&&req.payNo.length) upd.payNo=req.payNo;
        await updateDoc(doc(db,'stores',req.storeId),upd);
        await updateDoc(reqRef,{resolved:true});
        delete _nearbyEditMap[req.storeId];
        var badge=document.querySelector('[data-edit-store-id="'+req.storeId+'"]');
        if(badge) badge.style.display='none';
        alert('맞아요 3명 달성! 정보가 자동 업데이트됐어요');
      }
    } else {
      var newDisagree=[...(req.disagreeUids||[]),uid];
      await updateDoc(reqRef,{disagreeUids:arrayUnion(uid)});
      _nearbyEditMap[req.storeId].disagreeUids=newDisagree;
      if(newDisagree.length>=3){
        await updateDoc(reqRef,{resolved:true});
        delete _nearbyEditMap[req.storeId];
        var badge2=document.querySelector('[data-edit-store-id="'+req.storeId+'"]');
        if(badge2) badge2.style.display='none';
      }
    }
  }catch(e){console.error(e);}
};
</script>

  <button onclick="location.href='heka_login_v5.html?redirect='+encodeURIComponent(location.href)" style="width:100%;background:#FF3900;color:#fff;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px">로그인하기</button>
  <button onclick="closeNearbyLoginPopup()" style="width:100%;background:#f5f5f5;color:#555;border:none;border-radius:12px;padding:10px;font-size:13px;cursor:pointer;font-family:inherit">취소</button>
</div>
<script>
function showNearbyLoginPopup(title, desc){
  document.getElementById('nearby-login-title').textContent = (title||'')+'하려면 로그인이 필요해요';
  document.getElementById('nearby-login-desc').textContent = desc||'이 기능은 로그인 후 이용할 수 있어요';
  document.getElementById('nearby-login-overlay').style.display='block';
  document.getElementById('nearby-login-popup').style.display='block';
}
function closeNearbyLoginPopup(){
  document.getElementById('nearby-login-overlay').style.display='none';
  document.getElementById('nearby-login-popup').style.display='none';
}
</script>
