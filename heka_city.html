<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f0f0;display:flex;justify-content:center;padding:30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.phone{width:300px;background:#fff;border-radius:26px;border:1px solid #e0e0e0;overflow:hidden;color:#111;position:relative;min-height:620px;display:flex;flex-direction:column}
.sb{background:#1A5D1A;color:#fff;font-size:10px;padding:10px 16px 6px;display:flex;justify-content:space-between;flex-shrink:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:.5px solid #f0f0f0;background:#fff;flex-shrink:0}
.back-btn{width:30px;height:30px;border-radius:50%;background:#f5f5f5;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#111}

/* 검색창 */
.search-wrap{padding:10px 14px 6px;flex-shrink:0}
.search-box{display:flex;align-items:center;background:#f5f5f5;border:1.5px solid #e0e0e0;border-radius:22px;padding:6px 12px;gap:8px;transition:.15s}
.search-box:focus-within{border-color:#1A5D1A;background:#fff}
.search-box input{flex:1;border:none;background:transparent;font-size:12px;color:#333;outline:none;font-family:inherit}
.search-box svg{width:14px;height:14px;stroke:#aaa;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}

/* 뷰 전환 */
.view{flex:1;overflow-y:auto;display:none}
.view.active{display:flex;flex-direction:column}
.view::-webkit-scrollbar{display:none}

/* 나라 선택 뷰 */
.country-list{padding:6px 0}
.country-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid #f5f5f5;cursor:pointer;transition:.1s}
.country-item:hover{background:#f9f9f9}
.country-flag{font-size:22px;flex-shrink:0}
.country-info{flex:1;min-width:0}
.country-name{font-size:13px;font-weight:600;color:#111;margin-bottom:1px}
.country-cities{font-size:10px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.country-arr{font-size:14px;color:#ccc}

/* 도시 선택 뷰 */
.city-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid #f0f0f0;flex-shrink:0}
.city-back{font-size:12px;color:#1A5D1A;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.city-country-name{font-size:13px;font-weight:700;color:#111}
.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}
.city-btn{padding:10px 6px;border-radius:10px;background:#f5f5f5;border:none;font-size:12px;font-weight:600;color:#333;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}
.city-btn:hover{background:#e8f5e8;color:#1A5D1A}

/* 매장 목록 뷰 */
.store-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid #f0f0f0;flex-shrink:0}
.store-back{font-size:12px;color:#1A5D1A;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.store-city-name{font-size:13px;font-weight:700;color:#111}
.store-count{font-size:11px;color:#bbb;margin-left:auto}
.store-list{flex:1;overflow-y:auto}
.store-list::-webkit-scrollbar{display:none}
.store-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid #f5f5f5;cursor:pointer;transition:.1s}
.store-item:hover{background:#f9f9f9}
.store-thumb{width:48px;height:48px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#f0f0f0}
.store-thumb img{width:100%;height:100%;object-fit:cover}
.store-info{flex:1;min-width:0}
.store-name{font-size:13px;font-weight:600;color:#111;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store-sub{font-size:10px;color:#999;margin-bottom:4px}
.store-cards-row{display:flex;gap:3px;flex-wrap:wrap}
.sc{font-size:8px;padding:1px 5px;border-radius:3px;font-weight:700;color:#fff}
.sc-visa{background:#1a1f71}.sc-master{background:#eb001b}.sc-jcb{background:#007b40}
.sc-amex{background:#007bc1}.sc-tlog{background:#FF6B00}.sc-twallet{background:#FFD600;color:#333}.sc-union{background:#e21836}
.store-empty{padding:40px 16px;text-align:center;font-size:13px;color:#bbb;line-height:1.8}
.store-loading{padding:40px 16px;text-align:center;font-size:12px;color:#bbb}

/* 검색 결과 뷰 */
.search-empty{padding:40px 16px;text-align:center;font-size:13px;color:#bbb}
</style>
</head>
<body>
<div class="phone">
  <div class="sb"><span>9:41</span><span>해카</span><span style="opacity:0">●</span></div>
  <div class="topbar">
    <button class="back-btn" id="main-back" onclick="handleBack()">←</button>
    <span style="font-size:13px;font-weight:700;color:#111" id="top-title">도시별로 찾기</span>
    <div style="width:30px"></div>
  </div>

  <!-- 검색창 -->
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
      <input id="search-inp" placeholder="나라명, 도시명으로 검색" oninput="doSearch(this.value)"/>
    </div>
  </div>

  <!-- 나라 목록 뷰 -->
  <div class="view active" id="view-country">
    <div class="country-list" id="country-list"></div>
  </div>

  <!-- 도시 선택 뷰 -->
  <div class="view" id="view-city">
    <div class="city-header">
      <button class="city-back" onclick="showCountryView()">← 나라 선택</button>
      <span class="city-country-name" id="city-country-name"></span>
    </div>
    <div class="city-grid" id="city-grid"></div>
  </div>

  <!-- 매장 목록 뷰 -->
  <div class="view" id="view-stores">
    <div class="store-header">
      <button class="store-back" id="store-back-btn" onclick="showCityView()">← 도시 선택</button>
      <span class="store-city-name" id="store-city-name"></span>
      <span class="store-count" id="store-count"></span>
    </div>
    <div class="store-list" id="store-list"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const app = initializeApp({
  apiKey:"AIzaSyCmcsC_89TfZUIhgH6hKPaTKLXQn3rRzCo",
  authDomain:"card-store-finder.firebaseapp.com",
  projectId:"card-store-finder",
  storageBucket:"card-store-finder.firebasestorage.app",
  messagingSenderId:"340038449458",
  appId:"1:340038449458:web:14c3327a26d0d2892f3f2b"
});
const db=getFirestore(app);
window._allStores=null;
getDocs(collection(db,'stores')).then(function(snap){
  window._allStores=[];
  snap.forEach(function(d){ window._allStores.push({id:d.id,...d.data()}); });
  console.log('stores loaded:',window._allStores.length);
});
</script>

// 나라 목록 렌더링
function renderCountries(list){
  var el=document.getElementById('country-list');
  el.innerHTML=list.map(function(c){
    var citiesPreview=c.cities.slice(0,5).join(', ')+(c.cities.length>5?' 외 '+(c.cities.length-5)+'개':'');
    return '<div class="country-item" onclick="selectCountry(\''+c.name+'\')"><span class="country-flag">'+c.flag+'</span>'
      +'<div class="country-info"><div class="country-name">'+c.name+'</div><div class="country-cities">'+citiesPreview+'</div></div>'
      +'<span class="country-arr">›</span></div>';
  }).join('');
}

// 나라 선택
function selectCountry(name){
  _currentCountry=COUNTRIES.find(function(c){return c.name===name;});
  if(!_currentCountry) return;
  document.getElementById('city-country-name').textContent=_currentCountry.flag+' '+_currentCountry.name;
  var grid=document.getElementById('city-grid');
  grid.innerHTML=_currentCountry.cities.map(function(city){
    return '<button class="city-btn" onclick="selectCity(\''+city+'\')">'+city+'</button>';
  }).join('');
  showView('view-city');
}

function cityMatches(s, city){
  var cityLow=city.toLowerCase();
  var enKeyword=(CITY_EN_MAP[city]||'').toLowerCase();
  var addr=(s.address||s.addr||'').toLowerCase();
  var sCity=(s.city||'').toLowerCase();
  var sName=(s.name||'').toLowerCase();
  return sCity.indexOf(cityLow)>-1
    || addr.indexOf(cityLow)>-1
    || (enKeyword && addr.indexOf(enKeyword)>-1)
    || (enKeyword && sCity.indexOf(enKeyword)>-1);
}

function selectCity(city){
  _currentCity=city;
  document.getElementById('store-city-name').textContent=city;
  document.getElementById('store-count').textContent='';
  var listEl=document.getElementById('store-list');
  listEl.innerHTML='<div class="store-loading">불러오는 중...</div>';
  document.getElementById('store-back-btn').onclick=showCityView;
  showView('view-stores');
  waitForStores(function(stores){
    var filtered=stores.filter(function(s){ return cityMatches(s, city); });
    document.getElementById('store-count').textContent=filtered.length+'개';
    renderStores(filtered, listEl, city);
  });
}

function waitForStores(cb){
  if(window._allStores!==null){ cb(window._allStores); return; }
  var t=setInterval(function(){ if(window._allStores!==null){ clearInterval(t); cb(window._allStores); } },200);
}

function renderStores(stores, el, city){
  if(!stores.length){
    el.innerHTML='<div class="store-empty">'+city+'에 등록된 매장이 없어요<br>첫 번째로 등록해보세요! 🗺️</div>';
    return;
  }
  el.innerHTML=stores.map(function(s){
    var thumb=s.images&&s.images[0]?'<img src="'+s.images[0]+'" loading="eager"/>':'';
    var cards=(s.payOk||s.cards||[]).map(function(c){
      var cl=CARD_MAP[c]||''; return cl?'<span class="sc '+cl+'">'+c+'</span>':'';
    }).join('');
    return '<div class="store-item" onclick="location.href=\'heka_store_detail.html?id='+s.id+'\'">'
      +'<div class="store-thumb">'+thumb+'</div>'
      +'<div class="store-info">'
      +'<div class="store-name">'+s.name+'</div>'
      +'<div class="store-sub">'+(s.category||'')+(s.address?' · '+s.address.split(',')[0]:'')+'</div>'
      +'<div class="store-cards-row">'+cards+'</div>'
      +'</div></div>';
  }).join('');
}

// 검색
function doSearch(val){
  val=val.trim().toLowerCase();
  if(!val){ renderCountries(COUNTRIES); showView('view-country'); return; }

  // 나라명 매칭
  var countryMatch=COUNTRIES.filter(function(c){ return c.name.indexOf(val)>-1; });
  // 도시명 매칭
  var cityMatches=[];
  COUNTRIES.forEach(function(c){
    c.cities.forEach(function(city){
      if(city.indexOf(val)>-1) cityMatches.push({country:c, city:city});
    });
  });

  if(countryMatch.length&&!cityMatches.length){
    renderCountries(countryMatch);
    showView('view-country');
    return;
  }

  if(cityMatches.length){
    // 도시 검색 결과 바로 표시
    var el=document.getElementById('country-list');
    el.innerHTML='<div style="padding:10px 16px 4px;font-size:11px;color:#aaa;font-weight:600">도시 검색 결과</div>'
      +cityMatches.map(function(m){
        return '<div class="country-item" onclick="selectCityDirect(\''+m.country.name+'\',\''+m.city+'\')"><span class="country-flag">'+m.country.flag+'</span>'
          +'<div class="country-info"><div class="country-name">'+m.city+'</div><div class="country-cities">'+m.country.name+'</div></div>'
          +'<span class="country-arr">›</span></div>';
      }).join('');
    showView('view-country');
  } else if(countryMatch.length){
    renderCountries(countryMatch);
    showView('view-country');
  } else {
    document.getElementById('country-list').innerHTML='<div class="search-empty">검색 결과가 없어요</div>';
    showView('view-country');
  }
}

function selectCityDirect(countryName, city){
  _currentCountry=COUNTRIES.find(function(c){return c.name===countryName;});
  selectCity(city);
}

// 뷰 전환
function showView(id){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function showCountryView(){
  _currentCity=null;
  doSearch(document.getElementById('search-inp').value);
  showView('view-country');
}

function showCityView(){
  if(_currentCountry) selectCountry(_currentCountry.name);
  else showView('view-country');
}

function handleBack(){
  var active=document.querySelector('.view.active');
  if(active.id==='view-stores'){ showCityView(); }
  else if(active.id==='view-city'){ showCountryView(); }
  else { history.back(); }
}

renderCountries(COUNTRIES);
