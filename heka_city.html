*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f0f0;display:flex;justify-content:center;padding:30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.phone{width:300px;background:#fff;border-radius:26px;border:1px solid #e0e0e0;overflow:hidden;color:#111;position:relative;min-height:620px;display:flex;flex-direction:column}
.sb{background:#FF3900;color:#fff;font-size:10px;padding:10px 16px 6px;display:flex;justify-content:space-between;flex-shrink:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:.5px solid #f0f0f0;background:#fff;flex-shrink:0}
.back-btn{width:30px;height:30px;border-radius:50%;background:#f5f5f5;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#111}

/* 검색창 */
.search-wrap{padding:10px 14px 6px;flex-shrink:0}
.search-box{display:flex;align-items:center;background:#f5f5f5;border:1.5px solid #e0e0e0;border-radius:22px;padding:6px 12px;gap:8px;transition:.15s}
.search-box:focus-within{border-color:#FF3900;background:#fff}
.search-box input{flex:1;border:none;background:transparent;font-size:12px;color:#333;outline:none;font-family:inherit}
.search-box svg{width:14px;height:14px;stroke:#aaa;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}

/* 뷰 전환 */
.view{flex:1;overflow-y:auto;display:none}
.view.active{display:flex;flex-direction:column}
.view::-webkit-scrollbar{display:none}

/* 나라 선택 뷰 */
.sort-bar{display:flex;gap:6px;padding:4px 14px 0;flex-shrink:0}
.sort-btn{padding:4px 12px;border-radius:16px;border:1.5px solid #e0e0e0;font-size:11px;font-weight:600;color:#888;background:#fff;cursor:pointer;font-family:inherit;transition:.15s}
.sort-btn.on{border-color:#FF3900;color:#FF3900;background:#FFF1F2}
.country-list{padding:6px 0}
.country-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid #f5f5f5;cursor:pointer;transition:.1s}
.country-item:hover{background:#f9f9f9}
.country-flag{font-size:22px;flex-shrink:0}
.country-info{flex:1;min-width:0}
.country-name{font-size:13px;font-weight:600;color:#111;margin-bottom:1px}
.country-cities{font-size:10px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.country-arr{font-size:14px;color:#ccc}

/* 도시 선택 뷰 */
.city-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid #f0f0f0;flex-shrink:0}
.city-back{font-size:12px;color:#FF3900;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.city-country-name{font-size:13px;font-weight:700;color:#111}
.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}
.city-btn{padding:10px 6px;border-radius:10px;background:#f5f5f5;border:none;font-size:12px;font-weight:600;color:#333;cursor:pointer;font-family:inherit;text-align:center;transition:.15s}
.city-btn:hover{background:#FFF1F2;color:#FF3900}
.city-btn-all{grid-column:1/-1;background:#FFF1F2;color:#FF3900;font-weight:700;border:1.5px solid #FFE4E8;}
.city-btn-all:hover{background:#FFE4D6;}

/* 매장 목록 뷰 */
.store-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid #f0f0f0;flex-shrink:0}

.store-count{font-size:11px;color:#bbb;margin-left:auto}

.store-sub{font-size:10px;color:#999;margin-bottom:4px}

<script>
// 카드가 안 되는 가게는 목록에서 바로 보이게 빨간 표시를 붙인다
function payStatePill(s) {
  var no = (s && s.payNo) || [];
  if (no.indexOf("카드불가") < 0) return "";
  return '<span class="cpill" style="background:#DC2626;color:#fff">현금만</span>';
}
</script>
<script>
// 한글로 바꾼 가게는 현지 간판 이름도 작게 같이 보여준다
function localName(s) {
  var v = s && s.nameLocal;
  if (!v) return "";
  var e = window._esc || function(x){ return x==null?"":String(x); };
  return '<span style="font-size:11px;color:#9CA3AF;font-weight:500;margin-left:5px">' + e(v) + '</span>';
}
</script>
<script>
// 카드가 되는지 안 되는지에 따라 목록에 표시를 붙인다
//   현금만       : 카드가 안 된다고 확인된 곳
//   카드 정보 없음 : 아직 아무도 확인하지 않은 곳 (현금만과 헷갈리면 안 된다)
function payStatePill(s) {
  var ok = (s && s.payOk) || [], no = (s && s.payNo) || [];
  if (ok.indexOf("현금만") > -1 || no.indexOf("현금만") > -1 || no.indexOf("카드불가") > -1) return '<span class="cpill" style="background:#DC2626;color:#fff">현금만</span>';
  var hasCard = ok.some(function(c){ return /VISA|MASTER|JCB|AMEX|UnionPay|트래블|알리페이|위챗페이|카드가능/.test(c); });
  if (hasCard) return "";
  return '<span class="cpill" style="background:#E5E7EB;color:#6B7280">카드 정보 없음</span>';
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, limit, startAfter } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const app = initializeApp({
  apiKey:"AIzaSyCmcsC_89TfZUIhgH6hKPaTKlXQn3rRzCo",
  authDomain:"card-store-finder.firebaseapp.com",
  projectId:"card-store-finder",
  storageBucket:"card-store-finder.firebasestorage.app",
  messagingSenderId:"340038449458",
  appId:"1:340038449458:web:14c3327a26d0d2892f3f2b"
});
const db=getFirestore(app);
// 매장은 화면을 열 때 전부 받지 않는다. 고른 도시 것만, 300곳씩 나눠 받는다
window._cityCache = {};
window._PAGE = 300;
// 가게명 검색 — 띄어쓰기·기호·대소문자를 무시하고 앞글자로 찾는다 (전체를 받지 않는다)
// 매장마다 nameKey(한글 이름)·localKey(현지 이름) 가 저장돼 있다. 저장하는 쪽과 계산식이 같아야 한다
window._searchKey = function(v){ return String(v==null?'':v).toLowerCase().replace(/[\s\p{P}\p{S}]/gu,''); };
window._searchStores = function(term){
  var k = window._searchKey(term);
  if(!k) return Promise.resolve([]);
  var run = function(field){
    return getDocs(query(collection(db,'stores'), where(field,'>=',k), where(field,'<=',k+''), limit(20)))
      .then(function(snap){ var arr=[]; snap.forEach(function(d){ arr.push({id:d.id, ...d.data()}); }); return arr; })
      .catch(function(){ return []; });
  };
  // 대표메뉴(예: 라멘)로도 찾는다 — 메뉴 이름이 검색어와 같은 매장
  var byMenu = getDocs(query(collection(db,'stores'), where('menuKeys','array-contains',k), limit(20)))
    .then(function(snap){ var arr=[]; snap.forEach(function(d){ arr.push({id:d.id, ...d.data()}); }); return arr; })
    .catch(function(){ return []; });
  return Promise.all([run('nameKey'), run('localKey'), byMenu]).then(function(r){
    var seen={}, out=[];
    r[0].concat(r[1], r[2]).forEach(function(x){ if(!seen[x.id]){ seen[x.id]=1; out.push(x); } });
    return out;
  });
};
window._loadStores = function(field, value, after){
  var conds = [collection(db,'stores'), where(field,'==',value)];
  if (after) conds.push(startAfter(after));
  conds.push(limit(window._PAGE));
  return getDocs(query.apply(null, conds)).then(function(snap){
    var arr = [];
    snap.forEach(function(d){ arr.push({id:d.id, ...d.data()}); });
    return { rows: arr, last: snap.docs[snap.docs.length-1] || null, done: snap.size < window._PAGE };
  });
};
</script>

var POPULAR_ORDER=['일본','태국','베트남','싱가포르','홍콩','대만','마카오','중국','미국','프랑스','이탈리아','스페인','영국','독일','포르투갈','오스트리아','체코','그리스','튀르키예','크로아티아','호주','뉴질랜드','말레이시아','인도네시아','필리핀','인도','아랍에미리트','캐나다','멕시코','페루','브라질','모로코','남아프리카공화국','네덜란드'];

var _sortMode='popular';
function setSortMode(mode){
  _sortMode=mode;
  document.getElementById('btn-popular').classList.toggle('on', mode==='popular');
  document.getElementById('btn-alpha').classList.toggle('on', mode==='alpha');
  renderCountries(COUNTRIES);
}

function getSortedCountries(list){
  if(_sortMode==='alpha'){
    return list.slice().sort(function(a,b){ return a.name.localeCompare(b.name,'ko'); });
  }
  // 인기순
  return list.slice().sort(function(a,b){
    var ai=POPULAR_ORDER.indexOf(a.name); var bi=POPULAR_ORDER.indexOf(b.name);
    if(ai===-1) ai=999; if(bi===-1) bi=999;
    return ai-bi;
  });
}

// 나라 목록 렌더링
function renderCountries(list){
  var sorted=getSortedCountries(list);
  var el=document.getElementById('country-list');
  el.innerHTML=sorted.map(function(c){
    var citiesPreview=c.cities.slice(0,5).join(', ')+(c.cities.length>5?' 외 '+(c.cities.length-5)+'개':'');
    return '<div class="country-item" onclick="selectCountry(\''+c.name+'\')">'
      +'<div class="country-info"><div class="country-name">'+c.name+'</div><div class="country-cities">'+citiesPreview+'</div></div>'
      +'<span class="country-arr">›</span></div>';
  }).join('');
}

// 나라 선택
function selectCountry(name){
  _currentCountry=COUNTRIES.find(function(c){return c.name===name;});
  if(!_currentCountry) return;
  document.getElementById('city-country-name').textContent=_currentCountry.name;
  var grid=document.getElementById('city-grid');
  grid.innerHTML='<button class="city-btn city-btn-all" onclick="selectCountryAll(\''+_currentCountry.name+'\')">전체보기</button>'
    +_currentCountry.cities.map(function(city, idx){
      var cls=idx<3?'city-btn city-btn-featured':'city-btn';
      return '<button class="'+cls+'" onclick="selectCity(\''+city+'\')">'+city+'</button>';
    }).join('');
  showView('view-city');
}

var _pageState = null;
// 스크롤 끝에 닿으면 다음 300곳을 이어 받는다
// 목록을 거의 끝까지 내리면 다음 장을 이어 받는다
function _bindStoreScroll(){
  var el=document.getElementById('store-list');
  if(!el || el._bound) return;
  el._bound=true;
  el.addEventListener('scroll', function(){
    if(el.scrollTop + el.clientHeight >= el.scrollHeight - 300) loadMoreStores(el);
  });
}
// 필터·정렬이 맞으려면 그 도시 매장이 다 있어야 해서, 끝까지 이어 받는다
function loadMoreStores(listEl, first){
  if(!_pageState || _pageState.busy || _pageState.done) return;
  var st = _pageState;
  st.busy = true;
  window._loadStores(st.field, st.value, st.last).then(function(res){
    if(st !== _pageState) return; // 그 사이 다른 도시로 옮겨갔다
    st.rows = st.rows.concat(res.rows);
    st.last = res.last;
    st.done = res.done;
    st.busy = false;
    buildFilters();
    applyFilters();
    _bindStoreScroll();
    _applyRestoreScroll();
    if(st.done) _restoreY=null;
    if(!st.done) loadMoreStores(listEl);
  }).catch(function(){
    st.busy = false;
    if(first) listEl.innerHTML='<div class="store-empty">불러오지 못했어요</div>';
  });
}

// ── 카드별·업종별 필터, 위치를 알면 늘 거리순 ──
var FLT_CARDS=['VISA','MASTER','JCB','AMEX','트래블로그','트래블월렛','UnionPay','알리페이','위챗페이','현금'];
// '현금'은 현금가능·현금만(카드불가) 둘 다 잡는다. 현금불가로 확인된 곳은 뺀다
function payMatch(s, c){
  var ok=s.payOk||[], no=s.payNo||[];
  if(c==='현금') return no.indexOf('현금불가')<0 && (ok.indexOf('현금가능')>-1 || ok.indexOf('현금만')>-1 || no.indexOf('현금만')>-1 || no.indexOf('카드불가')>-1);
  return ok.indexOf(c)>-1;
}
var _flt = { cards:{}, cat:'' };
var _me = null;          // 내 위치 {lat,lng}

function resetFilters(){
  _flt = { cards:{}, cat:'' };
  ['flt-cards','flt-cats'].forEach(function(id){ document.getElementById(id).innerHTML=''; });
  askLocation();
}

function askLocation(){
  if(_me || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(p){
    _me = { lat:p.coords.latitude, lng:p.coords.longitude };
    buildFilters(); applyFilters();
  }, function(){}, { timeout:8000, maximumAge:600000 });
}

function distKm(a, b){
  var R=6371, r=Math.PI/180;
  var dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(h));
}

function buildFilters(){
  if(!_pageState) return;
  var rows=_pageState.rows;
  var cardHtml='<button class="flt-chip'+(Object.keys(_flt.cards).length?'':' on')+'" onclick="pickCard(\'\')">카드 전체</button>'
    + FLT_CARDS.filter(function(c){ return rows.some(function(s){ return payMatch(s, c); }); })
      .map(function(c){ return '<button class="flt-chip'+(_flt.cards[c]?' on':'')+'" onclick="pickCard(\''+c+'\')">'+c+'</button>'; }).join('');
  var cats=[];
  rows.forEach(function(s){ if(s.category && cats.indexOf(s.category)<0) cats.push(s.category); });
  // 홈·더보기와 같은 순서로 (목록에 없는 업종은 맨 뒤)
  var CAT_ORDER=['식당','카페','술집','패스트푸드','편의점','쇼핑','마트','입장권','호텔','ATM','기타'];
  cats.sort(function(a,b){ var x=CAT_ORDER.indexOf(a), y=CAT_ORDER.indexOf(b); return (x<0?99:x)-(y<0?99:y); });
  var catHtml='<button class="flt-chip'+(_flt.cat?'':' on')+'" onclick="pickCat(\'\')">업종 전체</button>'
    + cats.map(function(c){ return '<button class="flt-chip'+(_catOn(c)?' on':'')+'" onclick="pickCat(\''+c+'\')">'+(c==='호텔'?'숙소':c)+'</button>'; }).join('');
  document.getElementById('flt-cards').innerHTML=rows.length?cardHtml:'';
  document.getElementById('flt-cats').innerHTML=rows.length?catHtml:'';
}

function pickCard(c){
  if(!c) _flt.cards={};
  else if(_flt.cards[c]) delete _flt.cards[c];
  else _flt.cards[c]=1;
  buildFilters(); applyFilters();
}
// 업종은 카드처럼 여러 개를 함께 고를 수 있다(_flt.cat 에 '식당|카페' 처럼 담는다). 다시 누르면 풀리고, '업종 전체'는 모두 푼다
function _catList(){ return _flt.cat ? _flt.cat.split('|') : []; }
function _catOn(c){ return _catList().indexOf(c)>-1; }
function pickCat(c){
  if(!c){ _flt.cat=''; }
  else{ var a=_catList(), i=a.indexOf(c); if(i>-1) a.splice(i,1); else a.push(c); _flt.cat=a.join('|'); }
  buildFilters(); applyFilters();
}

function applyFilters(){
  if(!_pageState) return;
  var sel=Object.keys(_flt.cards);
  var list=_pageState.rows.filter(function(s){
    var cOk=!sel.length || Object.keys(_flt.cards).some(function(c){ return payMatch(s, c); });
    var tOk=!_flt.cat || _catOn(s.category);
    return cOk && tOk;
  });
  list.forEach(function(s){ s._km = (_me && s.lat && s.lng) ? distKm(_me, s) : null; });
  if(_me) list.sort(function(a,b){ return (a._km==null?1e9:a._km)-(b._km==null?1e9:b._km); });
  var total=_pageState.rows.length, filtered=sel.length||_flt.cat;
  document.getElementById('store-count').textContent = (filtered ? list.length+' / ' : '') + total + (_pageState.done ? '개' : '개+');
  renderStores(list, document.getElementById('store-list'), _pageState.label, !!_me, !!filtered);
}

function renderStores(stores, el, city, showDist, filtered){
  if(!stores.length){
    el.innerHTML = filtered
      ? '<div class="store-empty">조건에 맞는 매장이 없어요</div>'
      : '<div class="store-empty">'+city+'에 등록된 매장이 없어요<br>첫 번째로 등록해보세요! 🗺️</div>';
    return;
  }
  el.innerHTML=stores.map(function(s){
    var _t=storeThumb(s); var thumb=_t?'<img src="'+_t+'" loading="eager"/>':'';
    var cards=payStatePill(s).replace(/cpill/,"sc")+(s.payOk||s.cards||[]).filter(function(c){ return c!=='현금만' && c!=='카드불가' && !(c==='현금가능' && ((s.payNo||[]).indexOf('카드불가')>-1||(s.payOk||[]).indexOf('현금만')>-1)); }).map(function(c){
      var cl=CARD_MAP[c]||''; return cl?'<span class="sc '+cl+'">'+c+'</span>':'';
    }).join('');
    return '<div class="store-item" onclick="openStore(\''+s.id+'\')">'
      +'<div class="store-thumb">'+thumb+'</div>'
      +'<div class="store-info">'
      +'<div class="store-name">'+(window._esc?window._esc(s.name):String(s.name||''))+localName(s)+'</div>'
      +'<div class="store-sub">'+(showDist&&s._km!=null?'<span class="store-dist">'+(s._km<1?Math.round(s._km*1000)+'m':s._km.toFixed(1)+'km')+'</span>':'')+(((s.category==='호텔'||s.cuisine===s.category)&&s.cuisine)?s.cuisine:[s.cuisine, (s.category==='호텔'?'숙소':s.category)].filter(Boolean).join(' · '))+(s.address?' · '+s.address.split(',')[0]:'')+'</div>'
      +'<div class="store-cards-row">'+cards+((window.haekaBook&&haekaBook(s))?'<span class="sc" style="background:#EEF4FF;color:#2563eb;border:1px solid #BFDBFE">온라인 예매</span>':'')+'</div>'
      +'</div></div>';
  }).join('');
}

var _searchCache={};
// 검색
// 한국식 이름으로도 찾을 수 있게 하는 도시 별칭
var CITY_ALIAS={
  '상하이':['상해'],'베이징':['북경'],'톈진':['천진'],'옌타이':['연태'],'웨이하이':['위해'],'연길':['옌지','연변'],
  '내몽골':['네이멍구','후허하오터','내몽고'],'지난':['제남'],'창춘':['장춘'],'선양':['심양'],'청두':['성도'],'광저우':['광주'],
  '충칭':['중경'],'선전':['심천'],'항저우':['항주'],'시안':['서안'],'우한':['무한'],'난징':['남경'],'쿤밍':['곤명'],
  '구이린':['계림'],'하얼빈':['합이빈'],'샤먼':['하문'],'칭다오':['청도'],'다롄':['대련'],'쑤저우':['소주'],
  '장자제':['장가계'],'리장':['여강'],
  '샌디에이고':['샌디에고'],'로스앤젤레스':['LA','엘에이','로스엔젤레스'],'라스베가스':['라스베이거스'],'타이베이':['타이페이','대북'],'워싱턴DC':['워싱턴'],'뉘른베르크':['뉴른베르크','뉘렌베르크'],'안트베르펜':['앤트워프','안트워프'],'브뤼헤':['브뤼주','브루게','브루지'],'겐트':['헨트'],'류블랴나':['루블라냐','류블라나'],'시칠리아':['시실리'],'몰타':['말타']
};
function _cityAlias(city,val){
  var a=CITY_ALIAS[city]||[];
  for(var i=0;i<a.length;i++){ if(a[i].toLowerCase().indexOf(val)>-1) return a[i]; }
  return '';
}
// 매장·입장권이 등록된 도시 이름 목록(data/cities.json). 나라로 검색했을 때 등록된 도시만 보여주려고 쓴다
var _regCities=null;
fetch('data/cities.json').then(function(r){ return r.json(); }).then(function(list){
  _regCities={}; (list||[]).forEach(function(c){ _regCities[c.name]=1; });
  var inp=document.getElementById('search-inp');
  if(inp && inp.value.trim()) doSearch(inp.value);   // 이미 검색 중이면 다시 그린다
}).catch(function(){});
function doSearch(val){
  val=val.trim().toLowerCase();
  document.getElementById('city-img-grid').style.display=val?'none':'grid';document.getElementById('view-country').style.setProperty('display',val?'block':'none','important');
  if(!val){ renderCountries(COUNTRIES); showView('view-country'); return; }

  // 1. 나라명 매칭
  var countryMatch=COUNTRIES.filter(function(c){ return c.name.toLowerCase().indexOf(val)>-1; });
  // 2. 도시명 매칭
  var cityResults=[];
  COUNTRIES.forEach(function(c){
    c.cities.forEach(function(city){
      if(city.toLowerCase().indexOf(val)>-1) cityResults.push({country:c, city:city});
      else { var al=_cityAlias(city,val); if(al) cityResults.push({country:c, city:city, alias:al}); }
    });
  });

  // 2-1. 나라 이름으로 찾았으면 그 나라의 등록된 도시를 모두 보여준다
  countryMatch.forEach(function(c){
    c.cities.forEach(function(city){
      if(_regCities && !_regCities[city]) return;
      if(cityResults.some(function(m){ return m.city===city && m.country===c; })) return;
      cityResults.push({country:c, city:city});
    });
  });

  // 3. 가게명 매칭 — 서버에서 앞글자로 찾는다
  var raw=(document.getElementById('search-inp').value||'').trim();
  var storeResults=_searchCache[raw]||[];
  if(_searchCache[raw]===undefined && raw){
    _searchCache[raw]=[];
    window._searchStores(raw).then(function(rows){
      _searchCache[raw]=rows;
      if((document.getElementById('search-inp').value||'').trim()===raw) doSearch(raw);
    });
  }

  var el=document.getElementById('country-list');
  var html='';

  if(cityResults.length){
    html+='<div style="font-size:12px;font-weight:800;color:var(--hk-muted);padding:12px 16px 4px;letter-spacing:.05em">도시</div>';
    html+=cityResults.map(function(m){
      return '<div class="country-item" onclick="selectCityDirect(\''+m.country.name+'\',\''+m.city+'\')">'
        +'<div class="country-info"><div class="country-name">'+m.city+(m.alias?' ('+m.alias+')':'')+'</div><div class="country-cities">'+m.country.name+'</div></div>'
        +'<span class="country-arr">›</span></div>';
    }).join('');
  }

  if(storeResults.length){
    html+='<div style="font-size:12px;font-weight:800;color:var(--hk-muted);padding:12px 16px 4px;letter-spacing:.05em">매장</div>';
    html+=storeResults.map(function(s){
      var _t=storeThumb(s); var thumb=_t?'<img src="'+_t+'" style="width:100%;height:100%;object-fit:cover"/>':'';
      return '<div class="store-item" onclick="openStore(\''+s.id+'\')">'
        +'<div class="store-thumb">'+thumb+'</div>'
        +'<div class="store-info">'
        +'<div class="store-name">'+(window._esc?window._esc(s.name):String(s.name||''))+localName(s)+'</div>'
        +'<div class="store-sub">'+(((s.category==='호텔'||s.cuisine===s.category)&&s.cuisine)?s.cuisine:[s.cuisine, (s.category==='호텔'?'숙소':s.category)].filter(Boolean).join(' · '))+(s.city?' · '+s.city:s.address?' · '+s.address.split(',')[0]:'')+'</div>'
        +((window.haekaBook&&haekaBook(s))?'<div class="store-cards-row"><span style="display:inline-flex;align-items:center;font-size:8px;font-weight:800;padding:3px 7px;border-radius:999px;background:#EEF4FF;color:#2563eb;border:1px solid #BFDBFE;white-space:nowrap;flex-shrink:0">온라인 예매</span></div>':'')
        +'</div></div>';
    }).join('');
  } else if(countryMatch.length&&!cityResults.length){
    html=''; // 나라만 있으면 기존 방식
    el.innerHTML=''; showView('view-country');
    renderCountries(countryMatch); return;
  }

  if(html){
    el.innerHTML=html;
    showView('view-country');
  } else if(countryMatch.length){
    renderCountries(countryMatch);
    showView('view-country');
  } else {
    el.innerHTML='<div class="search-empty">검색 결과가 없어요</div>';
    showView('view-country');
  }
}

function _cityScrollers(){ return [document.querySelector('.phone'), document.getElementById('store-list'), document.querySelector('.view.active')].filter(Boolean); }
function openStore(id){
  try{
    var ys=_cityScrollers().map(function(el){ return el.scrollTop||0; });
    sessionStorage.setItem('haeka_city_state', JSON.stringify({
      city:_currentCity||'', country:(_currentCountry&&_currentCountry.name)||'',
      cat:_flt.cat||'', cards:Object.keys(_flt.cards||{}),
      q:(document.getElementById('search-inp').value||''),
      y:Math.max.apply(null, ys.concat([window.scrollY||0])), at:Date.now()
    }));
  }catch(e){}
  location.href='heka_store_detail.html?id='+id;
}
var _restoreY=null;
function _applyRestoreScroll(){
  if(_restoreY==null) return;
  var y=_restoreY, ok=false;
  _cityScrollers().forEach(function(el){ if(el.scrollHeight-el.clientHeight>=y-5){ el.scrollTop=y; if(Math.abs(el.scrollTop-y)<6) ok=true; } });
  if(!ok && document.documentElement.scrollHeight-window.innerHeight>=y-5){ window.scrollTo(0,y); ok=true; }
  if(ok) _restoreY=null;
}
window.addEventListener('pageshow', function(e){ if(e.persisted){ try{ sessionStorage.removeItem('haeka_city_state'); }catch(_){} } });
window.addEventListener('DOMContentLoaded', function(){
  var st=null;
  try{ st=JSON.parse(sessionStorage.getItem('haeka_city_state')||'null'); sessionStorage.removeItem('haeka_city_state'); }catch(e){}
  if(!st || Date.now()-st.at>30*60*1000) return;
  var nav=(performance.getEntriesByType && performance.getEntriesByType('navigation')[0])||{};
  if(nav.type && nav.type!=='back_forward') return;   // 뒤로가기로 돌아온 때만 되살린다
  if(st.city && st.country){
    selectCityDirect(st.country, st.city);
    _flt={ cards:{}, cat:st.cat||'' };
    (st.cards||[]).forEach(function(c){ _flt.cards[c]=1; });
    _restoreY=st.y||0;
  } else if(st.q){
    var inp=document.getElementById('search-inp');
    inp.value=st.q;
    doSearch(st.q);
  }
});

function handleBack(){
  var active=document.querySelector('.view.active');
  if(active.id==='view-stores'){ showCityView(); }
  else if(active.id==='view-city'){ showCountryView(); }
  else { history.back(); }
}

renderCountries(COUNTRIES);
