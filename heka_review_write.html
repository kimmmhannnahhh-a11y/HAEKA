<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<meta name="theme-color" content="#FF3900"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="HAEKA"/>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>후기 쓰기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('haeka_rebuild_common.css');
@media not all{
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:100px}
.topbar{position:sticky;top:0;z-index:100;background:#fff;display:flex;align-items:center;padding:0 16px;height:52px;border-bottom:1px solid #eee}
.back-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:none;font-size:18px;color:#222;margin-right:8px}
.topbar-title{font-size:16px;font-weight:700;color:#111;flex:1}
.submit-btn-top{background:#FF3900;color:#fff;border:none;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.submit-btn-top:disabled{background:#ccc;cursor:not-allowed}

.store-info{background:#fff;padding:14px 16px;border-bottom:1px solid #f0f0f0;margin-bottom:8px}
.store-info-name{font-size:13px;font-weight:700;color:#111}
.store-info-sub{font-size:11px;color:#aaa;margin-top:2px}

.section{background:#fff;padding:16px;margin-bottom:8px}
.sec-label{font-size:12px;font-weight:700;color:#555;margin-bottom:10px}
.required{color:#e53e3e;margin-left:2px}

/* 별점 */
.stars{display:flex;gap:6px;margin-bottom:4px}
.star{font-size:34px;cursor:pointer;color:#ddd;transition:color .15s;line-height:1;user-select:none}
.star.on{color:#f5a623}
.star-label{font-size:12px;color:#888;height:18px}

/* 텍스트 */
textarea{width:100%;border:1.5px solid #eee;border-radius:10px;padding:12px;font-size:14px;font-family:inherit;resize:none;height:120px;outline:none;line-height:1.6;color:#222}
textarea:focus{border-color:#FF3900}
.char-count{text-align:right;font-size:11px;color:#bbb;margin-top:4px}

/* 사진 첨부 */
.photo-wrap{display:flex;gap:8px;flex-wrap:wrap}
.photo-add{width:72px;height:72px;border:2px dashed #ddd;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#bbb;font-size:10px;gap:2px;flex-shrink:0}
.photo-add-icon{font-size:22px}
.photo-thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;flex-shrink:0}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-del{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.photo-count{font-size:10px;color:#aaa;margin-top:4px}

/* 카드 선택 */
.card-grid{display:flex;flex-wrap:wrap;gap:6px}
.card-chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:.15s;color:#fff}
.card-chip.off{opacity:.35;filter:grayscale(.5)}
.card-chip.on{opacity:1;filter:none;box-shadow:0 0 0 2px #fff, 0 0 0 4px #FF3900}

/* 하단 제출 */
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.submit-full{width:100%;background:#FF3900;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.submit-full:disabled{background:#ccc;cursor:not-allowed}

/* 로그인 필요 */
.login-wall{background:#fff;margin:20px 16px;border-radius:14px;padding:30px 20px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.login-wall-icon{font-size:36px;margin-bottom:10px}
.login-wall-txt{font-size:14px;color:#555;margin-bottom:16px;line-height:1.6}
.login-btn{background:#FF3900;color:#fff;border:none;border-radius:10px;padding:11px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}

/* 토스트 */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:50px;font-size:13px;font-weight:600;white-space:nowrap;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* HAEKA 2.0 common override */
:root{--hk-bg:#FAFAF8;--hk-surface:#fff;--hk-text:#1A1A1A;--hk-sub:#6B7280;--hk-muted:#9CA3AF;--hk-accent:#FF3900;--hk-accent-bg:#FFF1F2;--hk-border:#F3F4F6;--hk-card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
body{background:var(--hk-bg)!important;font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important;color:var(--hk-text)!important}.phone{background:var(--hk-bg)!important;border:0!important;box-shadow:0 24px 70px rgba(17,24,39,.14)!important}.sb{background:#fff!important;color:var(--hk-text)!important;border-bottom:1px solid var(--hk-border)!important}.topbar{background:#fff!important;border-bottom:1px solid var(--hk-border)!important;box-shadow:0 1px 10px rgba(0,0,0,.035)!important}.topbar-title,.logo{color:var(--hk-text)!important;font-weight:800!important}.btn-green,.btn-primary,.primary,.popup-btn,.send-btn{background:var(--hk-accent)!important;color:#fff!important;border-color:var(--hk-accent)!important;border-radius:12px!important;box-shadow:0 8px 20px rgba(255,56,92,.25)!important}.btn-outline,.btn-secondary{background:transparent!important;color:var(--hk-text)!important;border:1.5px solid #E5E7EB!important;border-radius:12px!important}input:focus,textarea:focus,select:focus{border-color:var(--hk-accent)!important;box-shadow:0 0 0 3px rgba(255,56,92,.10)!important}.card,.item,.list-item,.post-card,.store-card,.notice-item,.review-card{background:#fff!important;border:0!important;border-radius:16px!important;box-shadow:var(--hk-card-shadow)!important}.bnav{background:rgba(255,255,255,.94)!important;border-top:1px solid var(--hk-border)!important}.ni.on,.nplbl{color:var(--hk-accent)!important}.npbtn{background:var(--hk-accent)!important;box-shadow:0 8px 20px rgba(255,56,92,.25)!important}.toast{background:rgba(26,26,26,.88)!important;backdrop-filter:blur(10px)!important;border-radius:999px!important}button[style*="#FF3900"],[style*="background:#FF3900"]{background:var(--hk-accent)!important;color:#fff!important}[style*="color:#FF3900"],[style*="border-color:#FF3900"]{color:var(--hk-accent)!important;border-color:var(--hk-accent)!important}
}
</style>
<script src="security.js"></script>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="topbar-title">후기 쓰기</div>
  <button class="submit-btn-top" id="submit-top" onclick="submitReview()" disabled>등록</button>
</div>

<div id="main-wrap"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmcsC_89TfZUIhgH6hKPaTKLXQn3rRzCo",
  authDomain: "card-store-finder.firebaseapp.com",
  projectId: "card-store-finder",
  storageBucket: "card-store-finder.firebasestorage.app",
  appId: "1:340038449458:web:14c3327a26d0d2892f3f2b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

const CARD_LIST = [
  {name:'VISA', color:'#1a1f71'},
  {name:'MASTER', color:'#eb001b'},
  {name:'JCB', color:'#007b40'},
  {name:'AMEX', color:'#007bc1'},
  {name:'트래블로그', color:'#FF6B00'},
  {name:'트래블월렛', color:'#b8970a'},
  {name:'UnionPay', color:'#e21836'},
  {name:'현금', color:'#555555'},
];

const STAR_LABELS = ['','별로예요','그저 그래요','보통이에요','좋아요','최고예요!'];

const params = new URLSearchParams(location.search);
const storeId = params.get('id') || '';
const storeName = decodeURIComponent(params.get('name') || '');

let currentUser = null;
let selectedStar = 0;
let selectedCards = new Set();
let photoFiles = [];
let photoURLs = [];
let submitting = false;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function checkSubmittable() {
  const txt = document.getElementById('rev-text');
  const ok = currentUser && selectedStar > 0 && txt && txt.value.trim().length >= 1;
  document.getElementById('submit-top').disabled = !ok;
  const sb = document.getElementById('submit-bottom');
  if (sb) sb.disabled = !ok;
}

// 별점
window._setStar = function(n) {
  selectedStar = n;
  document.querySelectorAll('.star').forEach((el, i) => {
    el.classList.toggle('on', i < n);
  });
  document.getElementById('star-label').textContent = STAR_LABELS[n] || '';
  checkSubmittable();
};

// 카드 토글
window._toggleCard = function(name) {
  if (selectedCards.has(name)) selectedCards.delete(name);
  else selectedCards.add(name);
  document.querySelectorAll('.card-chip').forEach(el => {
    const on = selectedCards.has(el.dataset.card);
    el.classList.toggle('on', on);
    el.classList.toggle('off', !on);
  });
};

// 사진 추가
window._addPhoto = function() {
  if (photoFiles.length >= 4) { showToast('사진은 최대 4장까지 가능해요'); return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = function() {
    const files = Array.from(inp.files);
    files.forEach(f => {
      if (photoFiles.length >= 4) return;
      photoFiles.push(f);
      const url = URL.createObjectURL(f);
      photoURLs.push(url);
    });
    renderPhotos();
  };
  inp.click();
};

window._removePhoto = function(i) {
  photoFiles.splice(i, 1);
  photoURLs.splice(i, 1);
  renderPhotos();
};

function renderPhotos() {
  const wrap = document.getElementById('photo-wrap');
  wrap.innerHTML = photoURLs.map((u, i) =>
    `<div class="photo-thumb"><img src="${u}"><button class="photo-del" onclick="_removePhoto(${i})">×</button></div>`
  ).join('') + (photoFiles.length < 4 ? `<div class="photo-add" onclick="_addPhoto()"><span class="photo-add-icon">📷</span><span>${photoFiles.length}/4</span></div>` : '');
}

// 제출
window.submitReview = async function() {
  if (submitting) return;
  const txt = document.getElementById('rev-text');
  if (!currentUser) { showToast('로그인이 필요해요'); return; }
  if (selectedStar === 0) { showToast('별점을 선택해주세요'); return; }


  submitting = true;
  document.getElementById('submit-top').disabled = true;
  const sb = document.getElementById('submit-bottom');
  if (sb) { sb.disabled = true; sb.textContent = '등록 중...'; }

  try {
    // 사진 업로드
    const uploadedURLs = [];
    for (let i = 0; i < photoFiles.length; i++) {
      const f = photoFiles[i];
      const r = ref(storage, `reviews/${storeId}/${Date.now()}_${i}_${f.name}`);
      await uploadBytes(r, f);
      const url = await getDownloadURL(r);
      uploadedURLs.push(url);
    }

    // Firestore 저장
    await addDoc(collection(db, 'stores', storeId, 'reviews'), {
      uid: currentUser.uid,
      nickname: currentUser.displayName || currentUser.email?.split('@')[0] || '익명',
      photoURL: currentUser.photoURL || null,
      rating: selectedStar,
      text: txt.value.trim(),
      cards: [...selectedCards],
      images: uploadedURLs,
      createdAt: serverTimestamp()
    });

    // reviewCount +1
    await updateDoc(doc(db, 'stores', storeId), { reviewCount: increment(1) });

    showToast('후기가 등록됐어요!');
    setTimeout(() => {
      history.back();
    }, 1200);
  } catch(e) {
    console.error(e);
    showToast('오류가 발생했어요. 다시 시도해주세요');
    submitting = false;
    checkSubmittable();
    if (sb) sb.textContent = '후기 등록하기';
  }
};

function renderLoginWall() {
  document.getElementById('main-wrap').innerHTML = `
    <div class="store-info">
      <div class="store-info-name">${storeName}</div>
      <div class="store-info-sub">결제 후기 작성</div>
    </div>
    <div class="login-wall">
      <div class="login-wall-icon">🔐</div>
      <div class="login-wall-txt">후기를 쓰려면<br>로그인이 필요해요</div>
      <button class="login-btn" onclick="location.href='heka_login_v5.html?redirect='+encodeURIComponent(location.href)">로그인하기</button>
    </div>`;
}

function renderForm() {
  document.getElementById('main-wrap').innerHTML = `
    <div class="store-info">
      <div class="store-info-name">${storeName}</div>
      <div class="store-info-sub">결제 후기 작성</div>
    </div>

    <div class="section">
      <div class="sec-label">별점<span class="required">*</span></div>
      <div class="stars">
        ${[1,2,3,4,5].map(n=>`<span class="star" onclick="_setStar(${n})">★</span>`).join('')}
      </div>
      <div class="star-label" id="star-label"></div>
    </div>

    <div class="section">
      <div class="sec-label">후기<span class="required">*</span> </div>
      <textarea id="rev-text" placeholder="결제 경험을 자유롭게 적어주세요 😊" oninput="document.getElementById('char-cnt').textContent=this.value.length+'자';_checkSubmit()"></textarea>
      <div class="char-count" id="char-cnt">0자</div>
    </div>

    <div class="section">
      <div class="sec-label">사진 <span style="font-size:10px;color:#aaa;font-weight:400">최대 4장</span></div>
      <div class="photo-wrap" id="photo-wrap">
        <div class="photo-add" onclick="_addPhoto()">
          <span class="photo-add-icon">📷</span>
          <span>0/4</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sec-label">사용한 카드 <span style="font-size:10px;color:#aaa;font-weight:400">선택</span></div>
      <div class="card-grid">
        ${CARD_LIST.map(c=>`<div class="card-chip off" data-card="${c.name}" style="background:${c.color}" onclick="_toggleCard('${c.name}')">${c.name}</div>`).join('')}
      </div>
    </div>

    <div class="bottom-bar">
      <button class="submit-full" id="submit-bottom" onclick="submitReview()" disabled>후기 등록하기</button>
    </div>`;
}

window._checkSubmit = checkSubmittable;

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (!user) {
    renderLoginWall();
  } else {
    renderForm();
    checkSubmittable();
  }
});
</script>
</body>
</html>
