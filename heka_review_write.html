<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="manifest" href="site.webmanifest"/>
<meta name="theme-color" content="#FF3900"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="HAEKA"/>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>후기 쓰기</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('haeka_rebuild_common.css');
:root{--hk-bg:#FAFAF8;--hk-surface:#fff;--hk-text:#1A1A1A;--hk-sub:#6B7280;--hk-muted:#9CA3AF;--hk-accent:#FF3900;--hk-accent-bg:#FFF1F2;--hk-border:#F3F4F6;--hk-card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;display:flex;justify-content:center;padding:30px;min-height:100vh;color:var(--hk-text)}
.phone{width:300px!important;height:620px!important;background:var(--hk-bg)!important;border-radius:30px!important;border:0!important;overflow:hidden!important;color:var(--hk-text)!important;position:relative!important;display:flex!important;flex-direction:column!important;box-shadow:0 24px 70px rgba(17,24,39,.15)!important}

.topbar{flex-shrink:0;background:#fff;display:flex;align-items:center;padding:0 16px;height:56px;border-bottom:1px solid var(--hk-border);box-shadow:0 1px 10px rgba(0,0,0,.035);z-index:10}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:84px}
.scroll-area::-webkit-scrollbar{display:none}
.back-btn{width:34px;height:34px;border-radius:50%;background:#F5F5F3;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:17px;color:var(--hk-text);margin-right:10px;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:800;color:var(--hk-text);flex:1;letter-spacing:-.02em}
.submit-btn-top{background:var(--hk-accent);color:#fff;border:none;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:-.01em;box-shadow:0 4px 12px rgba(255,57,0,.22);transition:transform .12s ease}
.submit-btn-top:active{transform:scale(.96)}
.submit-btn-top:disabled{background:#E5E7EB;color:#9CA3AF;cursor:not-allowed;box-shadow:none}

/* 매장 헤더 카드 */
.store-info{background:#fff;margin:14px 14px 10px;padding:14px 18px;border-radius:16px;box-shadow:var(--hk-card-shadow)}
.store-info-name{font-size:15.5px;font-weight:800;color:var(--hk-text);letter-spacing:-.02em}
.store-info-sub{font-size:12px;color:var(--hk-sub);margin-top:3px;font-weight:600}

/* 섹션 카드 */
.section{background:#fff;margin:0 14px 10px;padding:18px 18px 16px;border-radius:16px;box-shadow:var(--hk-card-shadow)}
.sec-label{font-size:13px;font-weight:800;color:var(--hk-text);margin-bottom:12px;letter-spacing:-.01em;display:flex;align-items:center;gap:4px}
.sec-label-sub{font-size:11.5px;color:var(--hk-muted);font-weight:500;margin-left:4px}
.required{color:var(--hk-accent);margin-left:2px;font-weight:900}

/* 별점 */
.stars{display:flex;gap:8px;margin-bottom:6px}
.star{font-size:38px;cursor:pointer;color:#E5E7EB;transition:color .15s ease,transform .12s ease;line-height:1;user-select:none}
.star.on{color:#F59E0B}
.star:active{transform:scale(1.15)}
.star-label{font-size:14px;color:var(--hk-accent);font-weight:700;height:20px;letter-spacing:-.01em;margin-top:2px}

/* 텍스트 */
textarea{width:100%;border:1.5px solid #E5E7EB;border-radius:14px;padding:14px;font-size:14.5px;font-family:inherit;resize:none;height:130px;outline:none;line-height:1.65;color:var(--hk-text);background:#fff;transition:border-color .15s ease,box-shadow .15s ease;letter-spacing:-.01em}
textarea::placeholder{color:var(--hk-muted);font-weight:500}
textarea:focus{border-color:var(--hk-accent);box-shadow:0 0 0 3px rgba(255,57,0,.10)}
.char-count{text-align:right;font-size:11.5px;color:var(--hk-muted);margin-top:6px;font-weight:600}

/* 사진 첨부 */
.photo-wrap{display:flex;gap:8px;flex-wrap:wrap}
.photo-add{width:76px;height:76px;border:1.5px solid #E5E7EB;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--hk-muted);font-size:11.5px;gap:4px;flex-shrink:0;background:#FAFAF8;transition:border-color .15s ease,background .15s ease;font-weight:600}
.photo-add:hover{border-color:var(--hk-accent);background:#FFF8F6}
.photo-add svg{width:22px;height:22px;stroke:var(--hk-sub);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.photo-add-count{font-size:11.5px;color:var(--hk-muted);font-weight:700}
.photo-thumb{position:relative;width:76px;height:76px;border-radius:14px;overflow:hidden;flex-shrink:0;box-shadow:var(--hk-card-shadow)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-weight:700}

/* 카드 선택 */
.card-grid{display:flex;flex-wrap:wrap;gap:7px}
.card-chip{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:800;cursor:pointer;border:2px solid transparent;transition:all .15s ease;letter-spacing:-.01em;background:#F3F4F6;color:#4B5563;display:inline-flex;align-items:center;gap:5px}
.card-chip.off{background:#F3F4F6!important;color:#4B5563!important;border-color:transparent!important}
.card-chip.on{color:#fff!important;border:2px solid var(--hk-accent)!important;box-shadow:0 4px 10px rgba(255,57,0,.18)}
.card-chip.on::before{content:'';display:inline-block;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");background-position:center;background-repeat:no-repeat;background-size:11px}

/* 하단 제출 (.phone 안 absolute) */
.bottom-bar{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--hk-border);padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -2px 14px rgba(0,0,0,.04)}
.submit-full{width:100%;background:var(--hk-accent);color:#fff;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:-.02em;box-shadow:0 8px 20px rgba(255,57,0,.22);transition:transform .12s ease}
.submit-full:active{transform:scale(.99)}
.submit-full:disabled{background:#E5E7EB;color:#9CA3AF;cursor:not-allowed;box-shadow:none}

/* 로그인 필요 */
.login-wall{background:#fff;margin:30px 14px;border-radius:18px;padding:36px 24px;text-align:center;box-shadow:var(--hk-card-shadow)}
.login-wall-txt{font-size:15.5px;color:var(--hk-text);margin-bottom:20px;line-height:1.65;font-weight:500;letter-spacing:-.01em}
.login-btn{background:var(--hk-accent);color:#fff;border:none;border-radius:999px;padding:13px 32px;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:-.01em;box-shadow:0 6px 16px rgba(255,57,0,.22);transition:transform .12s ease}
.login-btn:active{transform:scale(.97)}

/* 토스트 (.phone 안 absolute) */
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(26,26,26,.92);backdrop-filter:blur(10px);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;z-index:999;opacity:0;transition:opacity .2s ease;pointer-events:none;letter-spacing:-.01em}
.toast.show{opacity:1}

/* 모바일 풀폭 */
@media (max-width:480px){
  body{padding:0!important;background:var(--hk-bg)!important}
  .phone{width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important;min-height:100vh!important}
}
</style>
<script src="security.js"></script>
</head>
<body>
<div class="phone">

<div class="topbar">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="topbar-title">후기 쓰기</div>
  <button class="submit-btn-top" id="submit-top" onclick="submitReview()" disabled>등록</button>
</div>

<div class="scroll-area">
  <div id="main-wrap"><div class="loading" style="text-align:center;padding:60px;color:#9CA3AF;font-size:14px;font-weight:500">불러오는 중...</div></div>
</div>
<div class="toast" id="toast"></div>

</div><!-- /.phone -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmcsC_89TfZUIhgH6hKPaTKLXQn3rRzCo",
  authDomain: "card-store-finder.firebaseapp.com",
  projectId: "card-store-finder",
  storageBucket: "card-store-finder.firebasestorage.app",
  appId: "1:340038449458:web:14c3327a26d0d2892f3f2b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

const CARD_LIST = [
  {name:'VISA', color:'#1a1f71'},
  {name:'MASTER', color:'#eb001b'},
  {name:'JCB', color:'#007b40'},
  {name:'AMEX', color:'#007bc1'},
  {name:'트래블로그', color:'#FF6B00'},
  {name:'트래블월렛', color:'#b8970a'},
  {name:'UnionPay', color:'#e21836'},
  {name:'현금', color:'#555555'},
];

const STAR_LABELS = ['','별로예요','그저 그래요','보통이에요','좋아요','최고예요!'];

const params = new URLSearchParams(location.search);
const storeId = params.get('id') || '';
let storeName = '';
try {
  storeName = decodeURIComponent(params.get('name') || '');
} catch(e) {
  storeName = params.get('name') || '';
}
if (!storeId) {
  document.getElementById('main-wrap').innerHTML = '<div class="login-wall" style="margin:30px 14px"><div class="login-wall-txt">매장 정보가 없어요<br>매장 상세 페이지에서 다시 시도해주세요</div><button class="login-btn" onclick="history.back()">뒤로 가기</button></div>';
}

let currentUser = null;
let selectedStar = 0;
let selectedCards = new Set();
let photoFiles = [];
let photoURLs = [];
let submitting = false;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function checkSubmittable() {
  const txt = document.getElementById('rev-text');
  const ok = currentUser && selectedStar > 0 && txt && txt.value.trim().length >= 1;
  document.getElementById('submit-top').disabled = !ok;
  const sb = document.getElementById('submit-bottom');
  if (sb) sb.disabled = !ok;
}

// 별점
window._setStar = function(n) {
  selectedStar = n;
  document.querySelectorAll('.star').forEach((el, i) => {
    el.classList.toggle('on', i < n);
  });
  document.getElementById('star-label').textContent = STAR_LABELS[n] || '';
  checkSubmittable();
};

// 카드 토글
window._toggleCard = function(name) {
  if (selectedCards.has(name)) selectedCards.delete(name);
  else selectedCards.add(name);
  document.querySelectorAll('.card-chip').forEach(el => {
    const on = selectedCards.has(el.dataset.card);
    el.classList.toggle('on', on);
    el.classList.toggle('off', !on);
  });
};

// 사진 추가
window._addPhoto = function() {
  if (photoFiles.length >= 4) { showToast('사진은 최대 4장까지 가능해요'); return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = function() {
    const files = Array.from(inp.files);
    files.forEach(f => {
      if (photoFiles.length >= 4) return;
      photoFiles.push(f);
      const url = URL.createObjectURL(f);
      photoURLs.push(url);
    });
    renderPhotos();
  };
  inp.click();
};

window._removePhoto = function(i) {
  photoFiles.splice(i, 1);
  photoURLs.splice(i, 1);
  renderPhotos();
};

function renderPhotos() {
  const wrap = document.getElementById('photo-wrap');
  wrap.innerHTML = photoURLs.map((u, i) =>
    `<div class="photo-thumb"><img src="${u}"><button class="photo-del" onclick="_removePhoto(${i})">×</button></div>`
  ).join('') + (photoFiles.length < 4 ? `<div class="photo-add" onclick="_addPhoto()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="photo-add-count">${photoFiles.length}/4</span></div>` : '');
}

// 제출
window.submitReview = async function() {
  if (submitting) return;
  const txt = document.getElementById('rev-text');
  if (!currentUser) { showToast('로그인이 필요해요'); return; }
  if (selectedStar === 0) { showToast('별점을 선택해주세요'); return; }


  submitting = true;
  document.getElementById('submit-top').disabled = true;
  const sb = document.getElementById('submit-bottom');
  if (sb) { sb.disabled = true; sb.textContent = '등록 중...'; }

  try {
    // 사진 업로드
    const uploadedURLs = [];
    for (let i = 0; i < photoFiles.length; i++) {
      const f = photoFiles[i];
      const r = ref(storage, `reviews/${storeId}/${Date.now()}_${i}_${f.name}`);
      await uploadBytes(r, f);
      const url = await getDownloadURL(r);
      uploadedURLs.push(url);
    }

    // Firestore 저장
    await addDoc(collection(db, 'stores', storeId, 'reviews'), {
      uid: currentUser.uid,
      nickname: currentUser.displayName || currentUser.email?.split('@')[0] || '익명',
      photoURL: currentUser.photoURL || null,
      rating: selectedStar,
      text: txt.value.trim(),
      cards: [...selectedCards],
      images: uploadedURLs,
      createdAt: serverTimestamp()
    });

    // reviewCount +1
    await updateDoc(doc(db, 'stores', storeId), { reviewCount: increment(1) });

    showToast('후기가 등록됐어요!');
    setTimeout(() => {
      history.back();
    }, 1200);
  } catch(e) {
    console.error(e);
    showToast('오류가 발생했어요. 다시 시도해주세요');
    submitting = false;
    checkSubmittable();
    if (sb) sb.textContent = '후기 등록하기';
  }
};

function renderLoginWall() {
  document.getElementById('main-wrap').innerHTML = `
    <div class="store-info">
      <div class="store-info-name">${storeName}</div>
      <div class="store-info-sub">결제 후기 작성</div>
    </div>
    <div class="login-wall">
      <div class="login-wall-txt">후기를 쓰려면<br>로그인이 필요해요</div>
      <button class="login-btn" onclick="location.href='heka_login_v5.html?redirect='+encodeURIComponent(location.href)">로그인하기</button>
    </div>`;
}

function renderForm() {
  document.getElementById('main-wrap').innerHTML = `
    <div class="store-info">
      <div class="store-info-name">${storeName}</div>
      <div class="store-info-sub">결제 후기 작성</div>
    </div>

    <div class="section">
      <div class="sec-label">별점<span class="required">*</span></div>
      <div class="stars">
        ${[1,2,3,4,5].map(n=>`<span class="star" onclick="_setStar(${n})">★</span>`).join('')}
      </div>
      <div class="star-label" id="star-label"></div>
    </div>

    <div class="section">
      <div class="sec-label">후기<span class="required">*</span></div>
      <textarea id="rev-text" placeholder="결제 경험을 자유롭게 적어주세요" oninput="document.getElementById('char-cnt').textContent=this.value.length+'자';_checkSubmit()"></textarea>
      <div class="char-count" id="char-cnt">0자</div>
    </div>

    <div class="section">
      <div class="sec-label">사진<span class="sec-label-sub">최대 4장</span></div>
      <div class="photo-wrap" id="photo-wrap">
        <div class="photo-add" onclick="_addPhoto()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span class="photo-add-count">0/4</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sec-label">사용한 카드<span class="sec-label-sub">선택</span></div>
      <div class="card-grid">
        ${CARD_LIST.map(c=>`<div class="card-chip off" data-card="${c.name}" style="background:${c.color}" onclick="_toggleCard('${c.name}')">${c.name}</div>`).join('')}
      </div>
    </div>

    <div class="bottom-bar">
      <button class="submit-full" id="submit-bottom" onclick="submitReview()" disabled>후기 등록하기</button>
    </div>`;
}

window._checkSubmit = checkSubmittable;

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (!user) {
    renderLoginWall();
  } else {
    renderForm();
    checkSubmittable();
  }
});
</script>
</body>
</html>
