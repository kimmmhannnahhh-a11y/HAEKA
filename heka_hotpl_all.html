<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="app-mobile.css"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('haeka_rebuild_common.css');
@media not all{
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f0f0;display:flex;justify-content:center;padding:30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.phone{width:300px;background:#fff;border-radius:26px;border:1px solid #e0e0e0;overflow:hidden;color:#111;position:relative;min-height:620px;display:flex;flex-direction:column}
.sb{background:#FF3900;color:#fff;font-size:10px;padding:10px 16px 6px;display:flex;justify-content:space-between;flex-shrink:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:.5px solid #f0f0f0;background:#fff;flex-shrink:0}
.back-btn{width:30px;height:30px;border-radius:50%;background:#f5f5f5;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#111;line-height:1}

.scroll-wrap{flex:1;overflow-y:auto;padding-bottom:16px}
.scroll-wrap::-webkit-scrollbar{display:none}

/* 카드 */
.hotpl-card{margin:12px 14px 0;border-radius:12px;overflow:hidden;border:.5px solid #e8e8e8;cursor:pointer;background:#fff}
.hotpl-card:first-child{margin-top:14px}
.hotpl-media{width:100%;height:161px;position:relative;overflow:hidden;background:#1a2e1a}
.hotpl-media img,.hotpl-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hotpl-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:8px 12px 10px}
.live-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);border-radius:20px;padding:2px 8px;margin-bottom:4px}
.live-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hotpl-title{font-size:12px;font-weight:500;color:#fff;line-height:1.4;margin-bottom:4px}
.hotpl-reporter{display:flex;align-items:center;gap:4px}
.rep-av{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff}
.rep-name{font-size:10px;color:rgba(255,255,255,.85)}

/* 정보 영역 */
.hotpl-info{padding:7px 12px 10px}
.hotpl-name{font-size:12px;font-weight:700;color:#111;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.hotpl-meta{display:flex;align-items:center;justify-content:space-between;gap:6px}
.hotpl-cat{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;background:#f0f0f0;color:#555}
.cat-restaurant{}
.cat-cafe{}
.cat-pub{}
.cat-etc{}
.hotpl-city{font-size:10px;color:#999}
.hotpl-cards{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.card-badge{font-size:9px;padding:2px 5px;border-radius:3px;font-weight:700;color:#fff}
.cb-visa{background:#1a1f71}
.cb-master{background:#eb001b}
.cb-jcb{background:#007b40}
.cb-amex{background:#007bc1}
.cb-tlog{background:#FF6B00}
.cb-twallet{background:#FFD600;color:#333}
.cb-union{background:#e21836}
.hotpl-time{font-size:10px;color:#bbb}

.empty{padding:60px 16px;text-align:center;font-size:13px;color:#bbb}
.loading{padding:40px 16px;text-align:center;font-size:12px;color:#bbb}
/* HAEKA 2.0 common override */
:root{--hk-bg:#FAFAF8;--hk-surface:#fff;--hk-text:#1A1A1A;--hk-sub:#6B7280;--hk-muted:#9CA3AF;--hk-accent:#FF3900;--hk-accent-bg:#FFF1F2;--hk-border:#F3F4F6;--hk-card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
body{background:var(--hk-bg)!important;font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important;color:var(--hk-text)!important}.phone{background:var(--hk-bg)!important;border:0!important;box-shadow:0 24px 70px rgba(17,24,39,.14)!important}.sb{background:#fff!important;color:var(--hk-text)!important;border-bottom:1px solid var(--hk-border)!important}.topbar{background:#fff!important;border-bottom:1px solid var(--hk-border)!important;box-shadow:0 1px 10px rgba(0,0,0,.035)!important}.topbar-title,.logo{color:var(--hk-text)!important;font-weight:800!important}.btn-green,.btn-primary,.primary,.popup-btn,.send-btn{background:var(--hk-accent)!important;color:#fff!important;border-color:var(--hk-accent)!important;border-radius:12px!important;box-shadow:0 8px 20px rgba(255,56,92,.25)!important}.btn-outline,.btn-secondary{background:transparent!important;color:var(--hk-text)!important;border:1.5px solid #E5E7EB!important;border-radius:12px!important}input:focus,textarea:focus,select:focus{border-color:var(--hk-accent)!important;box-shadow:0 0 0 3px rgba(255,56,92,.10)!important}.card,.item,.list-item,.post-card,.store-card,.notice-item,.review-card{background:#fff!important;border:0!important;border-radius:16px!important;box-shadow:var(--hk-card-shadow)!important}.bnav{background:rgba(255,255,255,.94)!important;border-top:1px solid var(--hk-border)!important}.ni.on,.nplbl{color:var(--hk-accent)!important}.npbtn{background:var(--hk-accent)!important;box-shadow:0 8px 20px rgba(255,56,92,.25)!important}.toast{background:rgba(26,26,26,.88)!important;backdrop-filter:blur(10px)!important;border-radius:999px!important}button[style*="#FF3900"],[style*="background:#FF3900"]{background:var(--hk-accent)!important;color:#fff!important}[style*="color:#FF3900"],[style*="border-color:#FF3900"]{color:var(--hk-accent)!important;border-color:var(--hk-accent)!important}
}
</style>
<script src="security.js"></script>
</head>
<body>
<div class="phone">
  <div class="sb"><span>9:41</span><span>해카</span><span style="opacity:0">●</span></div>
  <div class="topbar">
    <button class="back-btn" onclick="history.back()">←</button>
    <span style="font-size:13px;font-weight:700;color:#111">지금 여기! 실시간 결제 핫플</span>
    <div style="width:30px"></div>
  </div>
  <div class="scroll-wrap" id="scroll-wrap">
    <div class="loading" id="loading">불러오는 중...</div>
    <div style="text-align:center;padding:6px 16px 4px;font-size:10px;color:#4ADE80;font-weight:600">· 실시간 최근 50개 표시 중 ·</div>
    <div id="hotpl-list"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyCmcsC_89TfZUIhgH6hKPaTKLXQn3rRzCo",
  authDomain:"card-store-finder.firebaseapp.com",
  projectId:"card-store-finder",
  storageBucket:"card-store-finder.firebasestorage.app",
  messagingSenderId:"340038449458",
  appId:"1:340038449458:web:14c3327a26d0d2892f3f2b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const q = query(collection(db,'stores'), orderBy('createdAt','desc'), limit(50));
onSnapshot(q, function(snapshot){
  var stores = [];
  snapshot.forEach(function(d){ stores.push({id:d.id,...d.data()}); });
  document.getElementById('loading').style.display='none';
  if(window.renderHotpl) window.renderHotpl(stores);
});
</script>

<script>
var EN_TO_KO={'Tokyo':'도쿄','Osaka':'오사카','Kyoto':'교토','Fukuoka':'후쿠오카','Sapporo':'삿포로','Nagoya':'나고야','Hiroshima':'히로시마','Nara':'나라','Kobe':'고베','Okinawa':'오키나와','Kanazawa':'가나자와','Sendai':'센다이','Hakata':'하카타','Beppu':'벳푸','Yufuin':'유후인','Shanghai':'상하이','Beijing':'베이징','Chengdu':'청두','Guangzhou':'광저우','Chongqing':'충칭','Shenzhen':'선전','Hangzhou':'항저우','Nanjing':'난징','Kunming':'쿤밍','Guilin':'구이린','Harbin':'하얼빈','Xiamen':'샤먼','Qingdao':'칭다오','New York':'뉴욕','Los Angeles':'로스앤젤레스','Las Vegas':'라스베가스','San Francisco':'샌프란시스코','Chicago':'시카고','Seattle':'시애틀','Miami':'마이애미','Hawaii':'하와이','Boston':'보스턴','Paris':'파리','Nice':'니스','Lyon':'리옹','Marseille':'마르세유','Bordeaux':'보르도','London':'런던','Manchester':'맨체스터','Edinburgh':'에든버러','Birmingham':'버밍엄','Liverpool':'리버풀','Rome':'로마','Milan':'밀라노','Florence':'피렌체','Venice':'베네치아','Naples':'나폴리','Barcelona':'바르셀로나','Madrid':'마드리드','Seville':'세비야','Valencia':'발렌시아','Berlin':'베를린','Munich':'뮌헨','Hamburg':'함부르크','Frankfurt':'프랑크푸르트','Bangkok':'방콕','Chiang Mai':'치앙마이','Pattaya':'파타야','Phuket':'푸켓','Ho Chi Minh':'호치민','Hanoi':'하노이','Da Nang':'다낭','Hoi An':'호이안','Nha Trang':'나트랑','Singapore':'싱가포르','Sydney':'시드니','Melbourne':'멜버른','Brisbane':'브리즈번','Perth':'퍼스','Toronto':'토론토','Vancouver':'밴쿠버','Montreal':'몬트리올','Lisbon':'리스본','Porto':'포르투','Amsterdam':'암스테르담','Vienna':'빈','Prague':'프라하','Dubai':'두바이','Abu Dhabi':'아부다비','Hong Kong':'홍콩','Taipei':'타이페이','Taichung':'타이중','Kaohsiung':'가오슝','Kuala Lumpur':'쿠알라룸푸르','Penang':'페낭','Kota Kinabalu':'코타키나발루','Manila':'마닐라','Cebu':'세부','Bali':'발리','Jakarta':'자카르타','Dubrovnik':'두브로브니크','Zagreb':'자그레브','Athens':'아테네','Santorini':'산토리니','Istanbul':'이스탄불','Cappadocia':'카파도키아','Mumbai':'뭄바이','Delhi':'델리','Auckland':'오클랜드','Queenstown':'퀸스타운','Marrakesh':'마라케시','Cape Town':'케이프타운','Rio de Janeiro':'리우데자네이루','Hakata Ward':'후쿠오카','Chuo Ward':'오사카','Shinjuku':'도쿄','Shibuya':'도쿄'};

function toKoreanCity(str){
  if(!str) return '';
  // 직접 매핑
  for(var en in EN_TO_KO){ if(str.indexOf(en)>-1) return EN_TO_KO[en]; }
  return str;
}

function extractCity(addr){
  if(!addr) return '';
  // 일본 주소: "Osaka, Chuo Ward" 같은 패턴에서 도시명 우선
  var japanCities=['Tokyo','Osaka','Kyoto','Fukuoka','Sapporo','Nagoya','Hiroshima','Nara','Kobe','Okinawa','Kanazawa','Sendai','Yokohama','Kobe','Kawasaki','Saitama','Chiba','Kumamoto','Niigata','Hamamatsu'];
  for(var i=0;i<japanCities.length;i++){
    if(addr.indexOf(japanCities[i])>-1) return japanCities[i];
  }
  var parts=addr.split(',').map(function(s){return s.trim();});
  var skip=['일본','한국','중국','미국','프랑스','영국','독일','이탈리아','스페인','태국','베트남','싱가포르','호주','캐나다','포르투갈','네덜란드','오스트리아','체코','그리스','튀르키예','크로아티아','말레이시아','필리핀','인도네시아','인도','아랍에미리트','홍콩','대만','브라질','페루','모로코','뉴질랜드','Japan','China','USA','France','UK','Germany','Italy','Spain','Thailand','Vietnam','Singapore','Australia','Canada','Portugal','Netherlands','Austria','Czech','Greece','Turkey','Croatia','Malaysia','Philippines','Indonesia','India','Ward','Prefecture','District','Province','City','County'];
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    if(/^\d/.test(p)) continue;
    if(skip.some(function(k){return p.toLowerCase().indexOf(k.toLowerCase())>-1;})) continue;
    if(p.length>1) return p;
  }
  return '';
}

function getCity(s){
  if(s.city) return s.city;
  if(s.location) return s.location;
  var raw=extractCity(s.address||'');
  return toKoreanCity(raw)||raw;
}

function timeAgo(ts){
  if(!ts) return '방금 전';
  var t=ts.toMillis?ts.toMillis():(ts.seconds?ts.seconds*1000:(typeof ts==='number'?ts:Date.now()));
  var diff=Math.floor((Date.now()-t)/60000);
  if(diff<1) return '방금 전';
  if(diff<60) return diff+'분 전';
  if(diff<1440) return Math.floor(diff/60)+'시간 전';
  var d=new Date(t);
  var curYear=new Date().getFullYear();
  var mm=String(d.getMonth()+1).padStart(2,'0');
  var dd=String(d.getDate()).padStart(2,'0');
  var hh=String(d.getHours()).padStart(2,'0');
  var min=String(d.getMinutes()).padStart(2,'0');
  if(d.getFullYear()===curYear) return mm+'.'+dd+' '+hh+':'+min;
  return String(d.getFullYear()).slice(2)+'.'+mm+'.'+dd+' '+hh+':'+min;
}

function catClass(cat){
  if(!cat) return 'cat-etc';
  if(cat.includes('식당')||cat.includes('레스토랑')||cat.includes('맛집')) return 'cat-restaurant';
  if(cat.includes('카페')||cat.includes('커피')) return 'cat-cafe';
  if(cat.includes('펍')||cat.includes('바')) return 'cat-pub';
  return 'cat-etc';
}

function cardBadges(store){
  var cards = store.cards || store.acceptedCards || [];
  var map = {
    'VISA':'cb-visa','MASTER':'cb-master','JCB':'cb-jcb',
    'AMEX':'cb-amex','트래블로그':'cb-tlog','트래블월렛':'cb-twallet','UnionPay':'cb-union'
  };
  return cards.map(function(c){
    var cls = map[c]||'cb-etc';
    return '<span class="card-badge '+cls+'">'+c+'</span>';
  }).join('');
}

window.renderHotpl = function(stores){
  var el = document.getElementById('hotpl-list');
  if(!stores.length){
    el.innerHTML='<div class="empty">등록된 핫플이 없어요</div>';
    return;
  }
  el.innerHTML = stores.map(function(s){
    var nick = s.nickname||s.nick||'해카마왕';
    var letter = nick.charAt(0);
    var ago = timeAgo(s.createdAt);
    var catTxt = s.category||'기타';

    // 미디어
    var media = '';
    if(s.videoUrl){
      media = '<video src="'+s.videoUrl+'" autoplay muted loop playsinline preload="auto" loading="eager" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></video>';
    } else if(s.images && s.images[0]){
      media = '<img src="'+s.images[0]+'" loading="eager" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"/>';
    }

    return '<div class="hotpl-card" onclick="window.location.href=\'heka_store_detail.html?id='+s.id+'\'">'
      +'<div class="hotpl-media">'
      +media
      +'<div class="hotpl-overlay">'
      +'<div class="live-badge"><div class="live-dot"></div><span style="font-size:9px;color:#fff;font-weight:500">LIVE</span></div>'
      +'<div class="hotpl-title">"'+s.name+', '+ago+' 결제 성공!"</div>'
      +'<div class="hotpl-reporter"><div class="rep-av">'+letter+'</div><span class="rep-name">'+nick+'</span></div>'
      +'</div></div>'
      +'<div class="hotpl-info" style="display:flex;justify-content:space-between;align-items:flex-start">'
      +'<div style="flex:1;min-width:0">'
      +'<div class="hotpl-name">'+(s.name)+'<span style="font-size:10px;color:#bbb;font-weight:400;margin-left:6px">'+getCity(s)+'</span></div>'
      
      +'<div class="hotpl-cards">'+cardBadges(s)+'</div>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-left:8px;flex-shrink:0">'
      +'<span class="hotpl-cat '+catClass(catTxt)+'">'+catTxt+'</span>'
      +'<span class="hotpl-time">'+ago+'</span>'
      +'</div>'
      +'</div></div>';
  }).join('');
};
</script>
</body>
</html>
