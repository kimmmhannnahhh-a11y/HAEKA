<style>
@import url('haeka_rebuild_common.css');
:root{--hk-bg:#FAFAF8;--hk-surface:#fff;--hk-text:#1A1A1A;--hk-sub:#6B7280;--hk-muted:#9CA3AF;--hk-accent:#FF3900;--hk-accent-bg:#FFF1F2;--hk-border:#F3F4F6;--hk-card-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--hk-bg);display:flex;justify-content:center;padding:30px;font-family:'Plus Jakarta Sans',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--hk-text)}
.phone{width:300px;background:var(--hk-bg);border-radius:26px;border:0;overflow:hidden;color:var(--hk-text);position:relative;min-height:620px;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(17,24,39,.14)}
.sb{background:#fff;color:var(--hk-text);font-size:10px;padding:10px 16px 6px;display:flex;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--hk-border)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:#fff;flex-shrink:0;box-shadow:0 1px 10px rgba(0,0,0,.04);border-bottom:1px solid var(--hk-border)}
.back-btn{width:32px;height:32px;border-radius:50%;background:#F5F5F3;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--hk-text);line-height:1;flex-shrink:0}

/* 상단바 타이틀 — 홈 핫플섹션과 통일 */
.hotpl-topbar-title{display:inline-flex;align-items:center;gap:5px;font-size:16px;font-weight:800;letter-spacing:-.03em;color:var(--hk-text);flex:1;justify-content:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hotpl-topbar-title .hot-live{display:inline-flex;align-items:center;justify-content:center;padding:2px 5px;border-radius:4px;background:var(--hk-accent);color:#fff;font-size:8px;font-weight:900;letter-spacing:.04em;transform:rotate(-3deg);box-shadow:0 3px 8px rgba(255,57,0,.22);margin-right:1px}
.hotpl-topbar-title .hot-now{color:var(--hk-accent)}
.hotpl-topbar-title .hot-main{color:var(--hk-text)}

.scroll-wrap{flex:1;overflow-y:auto;padding-bottom:84px;-webkit-overflow-scrolling:touch}
.scroll-wrap::-webkit-scrollbar{display:none}

.live-meta-caption{text-align:center;padding:10px 16px 2px;font-size:11px;color:#16A34A;font-weight:700;letter-spacing:.01em}

/* 카드 */
.hotpl-card{margin:14px 14px 0;border-radius:18px;overflow:hidden;border:0;cursor:pointer;background:#fff;box-shadow:var(--hk-card-shadow);transition:transform .18s ease,box-shadow .18s ease}
.hotpl-card:first-child{margin-top:14px}
.hotpl-card:active{transform:scale(.992)}
.hotpl-media{width:100%;height:200px;position:relative;overflow:hidden;background:#1a2e1a}
.hotpl-media img,.hotpl-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hotpl-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent 0%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.85) 100%);padding:14px 14px 12px}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border-radius:999px;padding:4px 10px;margin-bottom:6px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:blink 1.5s infinite;box-shadow:0 0 8px rgba(74,222,128,.6)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hotpl-title{font-size:13.5px;font-weight:600;color:#fff;line-height:1.45;margin-bottom:6px;letter-spacing:-.01em}
.hotpl-success{color:#16A34A;font-weight:900;text-shadow:0 1px 6px rgba(0,0,0,.55),0 0 14px rgba(22,163,74,.55)}
.hotpl-reporter{display:flex;align-items:center;gap:6px}
.rep-av{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.rep-name{font-size:11.5px;color:rgba(255,255,255,.92);font-weight:600}

/* 정보 영역 */
.hotpl-info{padding:11px 14px 13px}
.hotpl-name{font-size:15px;font-weight:800;color:var(--hk-text);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.02em}
.hotpl-meta{display:flex;align-items:center;justify-content:space-between;gap:6px}
.hotpl-cat{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:700;background:#F3F4F6;color:#4B5563;letter-spacing:-.01em}
.hotpl-city{font-size:12.5px;color:var(--hk-sub);font-weight:500}
.hotpl-cards{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.card-badge{font-size:11px;padding:3px 7px;border-radius:5px;font-weight:800;color:#fff;letter-spacing:.01em}
.cb-visa{background:#1a1f71}
.cb-master{background:#eb001b}
.cb-jcb{background:#007b40}
.cb-amex{background:#007bc1}
.cb-tlog{background:#FF6B00}
.cb-twallet{background:#FFD600;color:#1F2937}
.cb-union{background:#e21836}
.cb-etc{background:#6B7280}
.hotpl-time{font-size:11.5px;color:var(--hk-muted);font-weight:500}

.empty{padding:80px 16px;text-align:center;font-size:14px;color:var(--hk-muted);line-height:1.6;font-weight:500}
.loading{padding:60px 16px;text-align:center;font-size:14px;color:var(--hk-muted);font-weight:500}

/* 하단 네비 (홈 표준) */
.bnav{display:flex;border-top:1px solid var(--hk-border);background:#FFFFFF;padding:8px 0 10px;flex-shrink:0;position:sticky;bottom:0;z-index:20}

.bnav .ni svg{width:22px;height:22px}
.bnav .ni.on{color:var(--hk-accent)}
.bnav .ni.on svg{stroke:var(--hk-accent)}
.bnav .nplus{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.bnav .npbtn{width:36px;height:36px;border-radius:50%;background:var(--hk-accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;border:none;cursor:pointer;margin-bottom:2px;margin-top:-4px;box-shadow:0 8px 16px rgba(255,57,0,.25)}

/* 모바일 풀폭 */
@media (max-width:480px){

  .phone{width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0!important;border:0!important;box-shadow:none!important;min-height:100vh!important}
}

<script type="module">

const app = initializeApp(firebaseConfig);

<script>
var EN_TO_KO={'Tokyo':'도쿄','Osaka':'오사카','Kyoto':'교토','Fukuoka':'후쿠오카','Sapporo':'삿포로','Nagoya':'나고야','Hiroshima':'히로시마','Nara':'나라','Kobe':'고베','Okinawa':'오키나와','Kanazawa':'가나자와','Sendai':'센다이','Hakata':'하카타','Beppu':'벳푸','Yufuin':'유후인','Shanghai':'상하이','Beijing':'베이징','Chengdu':'청두','Guangzhou':'광저우','Chongqing':'충칭','Shenzhen':'선전','Hangzhou':'항저우','Nanjing':'난징','Kunming':'쿤밍','Guilin':'구이린','Harbin':'하얼빈','Xiamen':'샤먼','Qingdao':'칭다오','New York':'뉴욕','Los Angeles':'로스앤젤레스','Las Vegas':'라스베가스','San Francisco':'샌프란시스코','Chicago':'시카고','Seattle':'시애틀','Miami':'마이애미','Hawaii':'하와이','Boston':'보스턴','Paris':'파리','Nice':'니스','Lyon':'리옹','Marseille':'마르세유','Bordeaux':'보르도','London':'런던','Manchester':'맨체스터','Edinburgh':'에든버러','Birmingham':'버밍엄','Liverpool':'리버풀','Rome':'로마','Milan':'밀라노','Florence':'피렌체','Venice':'베네치아','Naples':'나폴리','Barcelona':'바르셀로나','Madrid':'마드리드','Seville':'세비야','Valencia':'발렌시아','Berlin':'베를린','Munich':'뮌헨','Hamburg':'함부르크','Frankfurt':'프랑크푸르트','Bangkok':'방콕','Chiang Mai':'치앙마이','Pattaya':'파타야','Phuket':'푸켓','Ho Chi Minh':'호치민','Hanoi':'하노이','Da Nang':'다낭','Hoi An':'호이안','Nha Trang':'나트랑','Singapore':'싱가포르','Sydney':'시드니','Melbourne':'멜버른','Brisbane':'브리즈번','Perth':'퍼스','Toronto':'토론토','Vancouver':'밴쿠버','Montreal':'몬트리올','Lisbon':'리스본','Porto':'포르투','Amsterdam':'암스테르담','Vienna':'빈','Prague':'프라하','Dubai':'두바이','Abu Dhabi':'아부다비','Hong Kong':'홍콩','Taipei':'타이페이','Taichung':'타이중','Kaohsiung':'가오슝','Kuala Lumpur':'쿠알라룸푸르','Penang':'페낭','Kota Kinabalu':'코타키나발루','Manila':'마닐라','Cebu':'세부','Bali':'발리','Jakarta':'자카르타','Dubrovnik':'두브로브니크','Zagreb':'자그레브','Athens':'아테네','Santorini':'산토리니','Istanbul':'이스탄불','Cappadocia':'카파도키아','Mumbai':'뭄바이','Delhi':'델리','Auckland':'오클랜드','Queenstown':'퀸스타운','Marrakesh':'마라케시','Cape Town':'케이프타운','Rio de Janeiro':'리우데자네이루','Hakata Ward':'후쿠오카','Chuo Ward':'오사카','Shinjuku':'도쿄','Shibuya':'도쿄'};

function toKoreanCity(str){
  if(!str) return '';
  // 직접 매핑
  for(var en in EN_TO_KO){ if(str.indexOf(en)>-1) return EN_TO_KO[en]; }
  return str;
}

function extractCity(addr){
  if(!addr) return '';
  // 일본 주소: "Osaka, Chuo Ward" 같은 패턴에서 도시명 우선
  var japanCities=['Tokyo','Osaka','Kyoto','Fukuoka','Sapporo','Nagoya','Hiroshima','Nara','Kobe','Okinawa','Kanazawa','Sendai','Yokohama','Kobe','Kawasaki','Saitama','Chiba','Kumamoto','Niigata','Hamamatsu'];
  for(var i=0;i<japanCities.length;i++){
    if(addr.indexOf(japanCities[i])>-1) return japanCities[i];
  }
  var parts=addr.split(',').map(function(s){return s.trim();});
  var skip=['일본','한국','중국','미국','프랑스','영국','독일','이탈리아','스페인','태국','베트남','싱가포르','호주','캐나다','포르투갈','네덜란드','오스트리아','체코','그리스','튀르키예','크로아티아','말레이시아','필리핀','인도네시아','인도','아랍에미리트','홍콩','대만','브라질','페루','모로코','뉴질랜드','Japan','China','USA','France','UK','Germany','Italy','Spain','Thailand','Vietnam','Singapore','Australia','Canada','Portugal','Netherlands','Austria','Czech','Greece','Turkey','Croatia','Malaysia','Philippines','Indonesia','India','Ward','Prefecture','District','Province','City','County'];
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    if(/^\d/.test(p)) continue;
    if(skip.some(function(k){return p.toLowerCase().indexOf(k.toLowerCase())>-1;})) continue;
    if(p.length>1) return p;
  }
  return '';
}

function getCity(s){
  if(s.city) return s.city;
  if(s.location) return s.location;
  var raw=extractCity(s.address||'');
  return toKoreanCity(raw)||raw;
}

function timeAgo(ts){
  if(!ts) return '방금 전';
  var t=ts.toMillis?ts.toMillis():(ts.seconds?ts.seconds*1000:(typeof ts==='number'?ts:Date.now()));
  var diff=Math.floor((Date.now()-t)/60000);
  if(diff<1) return '방금 전';
  if(diff<60) return diff+'분 전';
  if(diff<1440) return Math.floor(diff/60)+'시간 전';
  var d=new Date(t);
  var curYear=new Date().getFullYear();
  var mm=String(d.getMonth()+1).padStart(2,'0');
  var dd=String(d.getDate()).padStart(2,'0');
  var hh=String(d.getHours()).padStart(2,'0');
  var min=String(d.getMinutes()).padStart(2,'0');
  if(d.getFullYear()===curYear) return mm+'.'+dd+' '+hh+':'+min;
  return String(d.getFullYear()).slice(2)+'.'+mm+'.'+dd+' '+hh+':'+min;
}

function catClass(cat){
  if(!cat) return 'cat-etc';
  if(cat.includes('식당')||cat.includes('레스토랑')||cat.includes('맛집')) return 'cat-restaurant';
  if(cat.includes('카페')||cat.includes('커피')) return 'cat-cafe';
  if(cat.includes('펍')||cat.includes('바')) return 'cat-pub';
  return 'cat-etc';
}

function cardBadges(store){
  var cards = store.cards || store.acceptedCards || [];
  var map = {
    'VISA':'cb-visa','MASTER':'cb-master','JCB':'cb-jcb',
    'AMEX':'cb-amex','트래블로그':'cb-tlog','트래블월렛':'cb-twallet','UnionPay':'cb-union'
  };
  var _e = window._esc || function(x){return x==null?'':String(x);};
  return cards.map(function(c){
    var cls = map[c]||'cb-etc';
    return '<span class="card-badge '+cls+'">'+_e(c)+'</span>';
  }).join('');
}

window.renderHotpl = function(stores){
  var el = document.getElementById('hotpl-list');
  if(!stores.length){
    el.innerHTML='<div class="empty">등록된 핫플이 없어요</div>';
    return;
  }
  var _e = window._esc || function(x){return x==null?'':String(x);};
  var _u = window._safeImg || function(x){return x==null?'':(/^https:\/\//i.test(x)?x:'');};
  el.innerHTML = stores.map(function(s){
    var nick = s.nickname||s.nick||'해카마왕';
    var letter = nick.charAt(0);
    var ago = timeAgo(s.createdAt);
    var catTxt = s.category||'기타';
    var sName = _e(s.name);
    var sId = _e(s.id);

    // 미디어 (https만 허용)
    var media = '';
    if(s.videoUrl){
      var vSrc = _u(s.videoUrl);
      if(vSrc) media = '<video src="'+vSrc+'" autoplay muted loop playsinline preload="auto" loading="eager" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></video>';
    } else if(s.images && s.images[0]){
      var iSrc = _u(s.images[0]);
      if(iSrc) media = '<img src="'+iSrc+'" loading="eager" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"/>';
    }

    return '<div class="hotpl-card" onclick="window.location.href=\'heka_store_detail.html?id='+encodeURIComponent(s.id||'')+'\'">'
      +'<div class="hotpl-media">'
      +media
      +'<div class="hotpl-overlay">'
      +'<div class="live-badge"><div class="live-dot"></div><span style="font-size:10px;color:#fff;font-weight:900;letter-spacing:.04em">LIVE</span></div>'
      +'<div class="hotpl-title">"'+sName+', '+_e(ago)+' <span class="hotpl-success">결제 성공!</span>"</div>'
      +'<div class="hotpl-reporter"><div class="rep-av">'+_e(letter)+'</div><span class="rep-name">'+_e(nick)+'</span></div>'
      +'</div></div>'
      +'<div class="hotpl-info" style="display:flex;justify-content:space-between;align-items:flex-start">'
      +'<div style="flex:1;min-width:0">'
      +'<div class="hotpl-name">'+sName+'<span class="hotpl-city" style="margin-left:8px">'+_e(getCity(s))+'</span></div>'
      
      +'<div class="hotpl-cards">'+cardBadges(s)+'</div>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-left:8px;flex-shrink:0">'
      +'<span class="hotpl-cat '+catClass(catTxt)+'">'+_e(catTxt)+'</span>'
      +'<span class="hotpl-time">'+_e(ago)+'</span>'
      +'</div>'
      +'</div></div>';
  }).join('');
};
</script>
</body>
</html>
